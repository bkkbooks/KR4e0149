body:
  text: 東江家藏集卷三十六後集三明顧清撰歸來稿詩七十七首乙酉立春書事晴日當空雪滿川兒童簫鼓竹林邊相逢盡説新年好遠信仍多吉語傳紫塞旌旗還故壘是日傳報雲中事定白頭光景付陳編東風不擇間門户柳色依稀欲帶煙人日北野有詩次韻靑山十年夢為作遠遊人已辦謝公屐獨少林宗巾近日從北野借幅巾樣忩間魚弄日枕上鳥鳴春更説園收事吾生的未貧來詩云園收未當貧頥元許惠五加皮本期雨後乃移以詩促之二月辛丑簷溜達旦好雨連三日靈苖應五車分栽有鄰約服食自仙家酒想金罌煮籬看翠幕遮長鑱臨去囑為我惜萌芽寄阮廷言秦淮北上內街前一榻清風四十年聞道主人強健在夜燈長對課兒編顧渚春風粟粒芽宜興小扇簇金花多情每作臨岐贈不問回溪兩翅斜兩都相隔路三千客邸尋常一笑歡雙槳畫舟清泖上可能翻似北河難芝蘭結好傳三葉桑梓連陰共一鄉莫把陸郎賓客待好從小阮説文章成化癸卯豫初觀場屋主阮大經廷言兄弟家所以相期甚厚豫在翰林大經往來不絶廷言子春試亦嘗會於京師豫既南歸聲問遂隔矣孫兒應陽卒業成均有懷往昔賦此寄之陳汝玊瀕行留卷索詩因陽孫奉寄朱旗組甲照晴川錦褾牙籖出玳筵老去山林惟一懶夢回池草又三年班超功業時來建郤克詩書世共賢遙想秣陵今夜月淸光還似海門圓沈春庭示舊詩次韻有後引當年誰見玉堂花信手題詩只漫誇兩家人事今粗定共領紅香亦未賖白玊堂前一樹花生紅一點萬人誇兩家人物真相稱為報分栽不許賖敘云荆公詠玊堂石榴詩萬緑枝頭紅一點動人春色不須多景和家有此花久許分遺因詩以速之當時未嘗落稿春庭近理故書得之以為昔友而今親殆非偶然封以見示豫謂親則似矣而玊堂之讖猶有所未合也意者其自今始乎次韻答之且書其左方以俟薛景春號采芝山人為賦四韻任公拋却釣鰲絲薛任姓國也來向吳山學采芝穩步不思滄海闊幽尋似與白雲期仙稊未覺層霄敻藥籠寧於一物私善救不遺他日事年來鄉里半瘡痍王草菴挽詩塵海無濡迹騷壇早樹麾家聲盧扁舊人物晉唐遺華表空仙語煙波想釣絲餘芳知未泯孫子桂林枝良醫沈希賢將還沂上持梅竹聚禽圖索題有懷東臯秋崖二都憲因託以寄興梅竹影參差東忩日上時坐看羣羽集如從九苞儀緗素餘文彩雲霄憶别離歲寒平日意誰報故人知椿庭日永壽王慕雪仙木凌雲擁畫堂重簾窣地映青陽舊家人物今誰健間處光陰此更長花亞錦屏催送酒煙斜石鼎看添香八千亦是人間歲况有斑衣侍尚方龜山寄湖淡菴詩云欲驅殘臘變春風只有寒梅作選鋒莫把疏英輕鬪雪好藏清艷月明中延平先生嘗舉以示朱子丙戌正月十四日鶴塘舟中誦之有省因代梅答本無顔色競東風冷落孤山水月中多謝詩翁好擡舉微言已墜棘端鋒十七夜聞諸孫讀書喜而有作癡人結習自何生白首塵編不盡情今夜短檠花亦喜咿吾遙聼隔簾聲辛巳泊舟青縣有畜犬登岸將發哀號覔舟他人驅之至欲泅水而不顧今日午食見其循案齧骨感而賦之時三月六日也瀛河東下水分岐記得沿流認主時今日上堂還繞案主人心事也應知次韻世卿方伯西園牡丹名花開日百花殘春到清明意已闌餘賞自非天力與芳心爭得巧工攢開元勝會連資福錦石幽叢轉靜觀翹首荆溪三百里幾時相對捲簾看錦石亭靜觀室小園種牡丹處也招東曙觀稼少耽耕稼苦無田馬上朝雞二十年晚景天留作佳話賞音人復往同川橰亭舊葺依深樹風檻新開俯碧漣明日分秧有前令酒杯還向緑陰傳行苖有感適東曙有和章疊􅸘為謝屋上靑林水上田林間曵杖自年年本來瓦缶非周鼎欲捧丸泥障蜀川幸不風塵隨澒洞敢嗟輪輻限清漣分秧昨日新題句又託王維畫裏傳壽鄉人瑞為談貞菴賦弧南星彩燭吳東洛社風流恰到翁名德舊為桑梓重衣冠今又畫圖中玉田漫説青芝滿丹穴誰看紫鳯翀同醉此鄉應不恨夕陽回首萬山紅鶴涇田舍見舊作扁舟長憶訪田翁落木空江遡遠風一笑今朝是何日十年遊子忽耕農西清東閣煙霄外曲水方洲畫卷中間拂舊題看不厭欲憑精衛寄愚公倚市長憐刺繡工班生亦笑馬遷公高才自昔還如此往運何由得再逢山玊海珠爭自美短鳬長鶴詎能同間身倘可充田畯沒齒西疇不負儂村田樂繞屋桑麻接稻塍夜齋燈火讀書聲老翁睡熟東忩裏夢在斜川曵杖行金杯歎黃金杯當四筵白玊堂五十年玉樓功成人在天金杯幻作金銅仙珊瑚鉤麒麟段彭宣幾向中堂見媒書銜袖誤成真讒鼎出疆原是贋真與贋兩嗟吁人不識子欺豫龍宫海藏豈有魚目作明珠君不見他人家金暑簟玊茗壼李文正公在仕路五十年參機政者十八年家止一金杯公殁家人試之乃銅也蓋求文者以為贄而公因用之初不知其贋也丙戌六月九日公生辰與客談及歌以識之夏日感事次味苓韻陶翁正好北忩眠也為間情一愴然水屋自應荷作蓋金貂定以玊為蟬祥雲捧日羣龍擁巨堰浮山一蟻穿神運斡旋俄頃事未須低首拜啼鵑南村約菴雨中過訪喜新街成飲平胃散酒是日談論間多可慨者别後賦此寄之白雲本是靑雲侣今雨依然舊雨人輿力競誇新路穩酒奴還説近方醇紛紛且置人間事皎皎誰全物外身畢竟浮生幾兩屐欲將泰華等遊塵新舟成約菴期與諸公同泛詩以速之蘭訪新成著釣綸肩輿從此事平分雲山到處天開畫風水有時川會文內史空留三泖宅鴟夷終策五湖勳高秋一曲凌波調不是間人未許聞杜竹泉六十二壽詩竹林娟好石泉紆林下幽人六十餘裹藥歲煩紅印紙畫容新試碧霞裾堯年舜厯資延引二豎三彭待掃除慎勿求仙想遺世羡門依舊海濱居同味苓泛舟疊前韻半生塵海共紛綸老幸江鷗一席分雪屋浪翻千月影筠簾日織五絲文蘆問畫楫疑漁父天際紅雲想放勳一笛淸風瑁湖底餘音飛去隔城聞穫稻用分秧韻負郭園池帶宅田老晴天氣太平年穫來黍稻叢高廪散出牛羊滿近川饙啓甑山騰霧靄蟻香醅甕起淪漣斜陽一枕西忩夢縱有丹靑不與傳一覽樓望陸瑁湖高閣金仙擁法輪小山霜鶴怨遊人臺傾沼沒知何處雲白天靑現此身沙市幾經魚潑剌稻畦時見石嶙峋煙波落日情無限欲倩漁郎為問津十二日同北野諸公泛㴘湖三疊綸字韻尋常紙上説經綸雲漢機絲要手分投杼却尋東海釣馳煙已愧北山文短簑高笠詩添景醉舞狂吟酒䇿勳落日推蓬見歸鶴一聲猶想夢中聞送沈子公副使之貴州皇德同天覆賢人簡帝心却紆閩海節去歷井垣深履道無夷險逢時自古今江亭一杯酒聽奏伯牙琴作室藏舟於瑁湖適超果住僧濬寺濠北鄰薛生期復仙冢舊迹落成之日眼界一新豫少讀書寺中不意老而還此笑遊也詩以記之何處堪豫泊釣舟陸家湖尾寺灘頭幾灣緑樹迎潮入一帶紅蘭映水浮已喜金沙清佛界更疏玊澗繞仙洲誰知白首歸來客重與溪山結勝遊四疊綸字韻答味苓間身無復半通綸天許三江一道分擁楫有時成白醉著書終不效玄文悠哉細雨灘頭釣邈矣凌煙閣上勳昨日城中傳邸報溪翁對面不曾聞五疊綸字韻清潭百尺裊風綸楊柳芙蓉四面分前去桃源知有路後來甫里亦能文筆床影落天池月茶竈銘書鼎足勳一事最竒曾未有龍吟近在枕邊聞疊舟字韻越相鴟夷老一舟南征新息困壺頭人間岐路古今在江上煙波日夜浮詩卷釣竿新谷水石渠金馬舊瀛洲寺廊斜日青襟散猶想兒童挾策遊再疊蓮葉空聞太乙舟五湖今在鶴涇頭行牽藻荇隨橈去卧看雲山隔樹浮返照入簾經别浦微風引纜又前洲江鄉不辨東山具到處從人説淡遊至夕觀書有感用甲申紀夢韻詩人空復惱靑蠅黑白人間本自明試論當年齊景富何如千古伯夷名悠悠總到間邊熄赫赫常於靜裏萌斜月西樓見梅影一枝淸傍綺忩橫南村約菴相携為北野先生八十壽自今歲一行之賦此為例十一月二十九日也北野先生初八十南山勝會恰三人桑榆並照林間影松柏爭看雪後身賸有風神飛藻翰絶無塵土上冠巾百齡前去知非遠歲一稱觴亦未頻會許一菴葬臘月十二日素車搖曵古城東猶記題詩壽一翁往事只今成曉夢後生何地挹淳風遺言了了人能誦餘業蕭蕭道未窮一片洞涇原上石有誰提筆贊林宗立春日招味苓嘗酒東忩小鳥聒清晨坐擁靑綾憶古人心醉六經千古事眼看七十四回春芒鞋不踏紛華地藤杖能扶健在身梅蕚茶花待公久一杯來試雪香新丁亥元日拜闕罷與客言有感客去燭至疊前蠅字韻誤筆休看畫裏蠅殘書且趂夜燈明高才自古難為繼匹士尋常亦顧名巨浸稽天來蟻穴喬林翳日起勾萌君王聖德今堯舜曾見庚庚卜大橫三人醉後書醉人那可問往事不須詳咄咄憂為樂紛紛靜裏忙攫金寧顧市挾䇿亦亡羊一笑堪誰語梅花在短墻觀書有感兀兀燈前千古思古人心在不同時同時只好今人笑暮夜懷金尚畏知春蠶默默五絲成絡緯中宵百變聲分席孔堂誰第一兩言博約盡平生既醉鳬鷖寫治安邠風七月畫艱難施為次第分明在只恐塵編倒背看老質功多踐履艱下探淵海上高山年來此事從人意只在從容數語間錢穀簿書歸俗吏天人性命合時賢世間尚有宫啇在敢道期亡便絶絃約菴先生壽七十五偕諸公携酒為慶詩以先之二月七日也南村北野遞賡酬次第賓筵接太丘樂國未輸清潁曲德星今在瑁湖頭墻桃暗結長春果徑竹新添記海籌從此酒杯公莫算東園幾日又清秋東園憶味苓翁梅花已作魚鱗白櫻蕊初含豆蔲紅詩老閉門空覔句槐陰幾日又薰風薛民望號九山持卷乞詩西北三江帶五湖九山清勝結吾廬風煙陸瑁家相近水石王蒙畫不如長日林光圍几席有時空翠落衣裾鶴書未論他年事門外時來長者車二月七日壽約菴先生有園桃暗結長春果之句後十九日先生得孫詩以賀之仍用前韻先生七十五春秋始抱蘭枝第一籌來晚恰符園果讖名成須著錦標頭家書便合添千卷身世真堪老一丘却望壽筵無幾日酒杯重疊費公酬辰孫將赴秋山甥館其兄有詩依依不忍離别之意豫謂孫之情殆有甚焉因書此慰之勤學以立身親賢以自輔平日之耄言多矣體而行之將來之顯揚秋山且望焉而何有於一時之離濶也孫其勉之庭萱入望雁行分風木仍牽夢裏魂欲盡此情難亦易夜燈時省白頭言禽言忩雞喔喔鳴未巳更著山禽喚人起雞鳴不醒喚不譍近來銅壺有六更吁嗟乎爾禽空復情有客苦無酒提壺向鄰沽山禽當我前笑我提壺盧壺盧壺盧我自提爾自不提聒聒鳴何為橋亭成有作呈南村約菴諸公田野歌平政輿梁揭勝亭翬飛天不盡鰲鎮物常寧吉夢先經始豐年協地靈白頭何幸也還此照淸泠題張秋山舊扇王孟仁畫王郎近代丹青手寫出秋山意外淸遺迹宛然人不見臨風無限古今情東湖錢君縹藏其母林夫人繡桃竹雙雞遺命其子國用求題識觀其運思精妙王淵邊文進之寫生也時風下移事多茍簡有愧於斯人多矣賦絶句以歸之周漢遺文劫火深晉唐緗素亦煙沉靑縑一尺絲千縷留與閨門作佩針亭橋次尤南渠韻金沙新迹古亭橋平界靑𡨕壓翠濤龍見不從神物化翬飛還比夢中高憑闌及我間無病題柱看君老向豪為謝笻枝莫相遠晚途銜策正須操前題次周北野韻城中每見説三亭城外紅闌此日憑多事只從春夢起好詩今作畫圖稱金沙玊澗交旋擁布襪青鞋穩降升百年如此良不惡隴頭休問鶴書徴五月一日行東園憂來不知端撫心翻自疑雖慙風雲氣寧復兒女癡園林既成趣書卷亦堪依如何草年意觸眼還在兹瘦馬愁遠道羈禽懷故枝往事已如此後來安可期焉得還吾故高眠看雲飛兼善赴義孰南渠有詩豫亦繼作八月草四日也蘭堂拙館舊遊歌屈指年光六十過師席再登傳父子書香一脈會松蘿靑燈黃卷瞻依切時雨春風感繫多他日分明眼前事庭柯落葉水回波九月七日東園先生壽七十三詩以祝之用前壽約菴韻東園此日正淸秋前去重陽只兩籌酒盞不隨元亮後菊花先插紫微頭國恩寵報延三世家學真傳自九丘杖履造朝今未論百年詩會要公酬九日諸公會石橋新樓望東園作東園樓外復東樓回首園亭滿目秋黃菊紫萸今日會曲街委巷少年遊時移物運誰能挽地敻天高直耐愁看取五陵豪俊子金丸終日話封侯約菴促豫西行且有早歸之約詩以答之風波蹤迹病中身歸卧靑山荷主恩礱石方思豫丘首賜環何意復衡門西風建業追遊地斜日吳江别酒尊願託餘光照衰朽杖藜還繞陸家村諸廣文餞豫龍潭僧舍别後有懷味苓聽鶴亭前欲上潮龍潭落木晚蕭蕭愁來别酒難成醉老去詩翁不可招地下騷壇自旗鼓人間博局幾盧梟翠蘿金碗當時句殘月空梁獨自謡晚坐東軒覩水木山亭知為夏忠靖公賜第感舊懷賢得絶句八首乾坤身世五湖萍南北風塵兩鬢星獨坐小軒成一笑平生到處有山亭右總序紫藤蒼柏間三峰曲檻回軒面面通四十年來忘不得連甍如霧此堂空右趙錦衣希明宅乙卯至庚申居之今再易主舊迹一新矣重到長安迹屢移南峰小院亦崔嵬梨花檻格蒲萄架勾引鄉園入夢思右南城徐學士宅丁卯召修書仍主趙氏戊辰居此有憶家園二十四首絶壁連彎秀幾重淸池倒浸玊芙蓉別來往事那堪記總付西軒一笑中右龍驤街後宅癸酉再入至辛巳居之得謗時緝事者屢至其下或執炙行觴而人不知也然事乃以是得白小作山林窄作池一亭飛起桂叢西長沙舊迹文皇賜千載都人路不迷以下皆夏氏宅東墻緑水帶逶迤北户連峰湧翠眉正是皇州佳麗處草堂容我坐吟詩山在軒前登其上秦淮鍾阜宫闕樓臺舉在目前真城中勝地也長沙厚德魏安陽見蘇州志禹績東南澤更長坐挹遺蹤想明盛又從東里到文襄忠靖治水而民以安文襄督賦而民以裕皆大有功於東南者文襄忠靖所保留其用則東里之薦也水土平來澤國秋陳紅相望十三州於今此意從誰語惟有江淮日夜流近歲往往有議文襄謂其法不可復行者而田野之氓終不以為然也故於此見之訪客江上作尚憶當年别何言此地逢乾坤真浩蕩阡陌任衡縱妙舞須長袖幽尋稱短笻龍江今夜月知復為誰容東江家藏集卷三十六
