body:
  text: 東江家藏集卷三初集三明顧清撰山中稿詩五十七首送髙進之入上海學丙午秋企也來時猶稚年雙髫初合未勝冠三冬自解攻文史五色今看振羽翰人欲別時情自惡學粗通處事方難重來定有驚人句不作尋常子弟看與曹宗魏髙進之酌別戊申春小石橋西舊草堂故人停駕速壺觴相從未覺當時樂已别方知此會良潑眼生紅榴萬點染衣濃緑柳千行舊時遊處今為客怪得尊前語話長戊申春雨書寓所壁去年秋旱深憂稼今嵗春霖復損苗聖主不應天有譴清時寧許物為妖浸淫便恐魚生釡漂泊誰將蟻渡橋江上舍前泥一尺掩書終夕聽飄蕭題張性夫小景四絶句寂寂空山裏春和草自芳隔溪人不見髣佛喚劉郎水木隂森處茅堂四五間主人容直造擕手看青山秋氣著林麓蕭條門户間兒童拾松子日暮不知還積雪斷山路柴扉晝不開明朝稍晴霽先看屋東梅種桂花桂花分種出蟾宫柯葉雖異根荄同移來植向萬仭峰天髙地濶風露濃柯如碧琅玕織網罥出波濤寒葉如藍田玉金刀刻成光煜煜吳剛有斧不敢侵買臣睥睨停謳吟月來清影亦蕭瑟雨後緑葉常隂森我昔遊廣寒靣受嫦娥訣世間蘭麝竟紛紛天香自與凡花别便須和本移不必凌風折眼明見此秋風前已覺身在青雲邊還將兩袖黃金粟散作竒香遍九天紀蟬青林的皪珠月明有蜩夜棲安不驚吸風飲露髙且清忽焉有物來相仍扼吭拊背施五兵失聲長號死復生命已絶兮猶力爭我方撫卷臨前楹聞之惻然起再行修翎廣顙金簧聲須臾已復不得矜弱肉強食神所憎六王已畢秦亦傾臨危欲援力不能豈獨此蜩傷我情題宋起周扇今改字天民馬頭花霧撲春衣馬尾青山步步隨歸去奚童莫催促先生得意正吟詩阮莊為張信夫題張郎別墅阮郎琴千載風流此會心認得湖山佳絶處緑楊窣地草堂深過吳應文墓君丁丑生辛丑擢第知棗強縣年二十九卒弱齡隨伴走紅塵青眼相看獨有君俯仰十年嗟逝水凄涼今日拜孤墳英雄有恨文章在忠信無憑夭壽分下馬不堪重上馬夕陽回首亂浮雲己酉西行出門别親友長揖官道傍送者或低回行者何慨慷功名來趣人安得戀舊鄉千金裝湛盧萬斛駕艅艎揚帆出三泖凌空度天潢揮刃斬蛟鼉回首招鳯凰浮雲東南來矯若遊龍翔前飛若先驅遙遙西北行西北帝王居樓闕天中央年華際太平賢俊爭趨蹌一行策竒勳六轡馳康莊致君堯舜上載歌卿雲章夙志自耿耿况當膂力剛雨過碧天淨月明仙桂香豪飲盡百瓠長歌激清商去去君莫疑船頭起虹光梅竹月橫幅羅浮仙子跨青鸞午夜凌風覲廣寒十二樓中都不寐大家齊憑玉闌看題扇靣二絶句緑樹蔭重灘平疇繞故山一犁春雨足萬事不相關敲火然青竹磨刀割素鱗江湖真樂事輸與洞庭人泗涇曉發時同李天瑞迎提學王先生夢醒滄江月上初依稀聽得唱吳歈推篷欲認停舟處已過前村十里餘泊七寶鎮春來三月未登山此夜偏舟暫當間怪底劔光藏不得舟人齊指斗牛間庚戌初度三十年前此日中滿堂犀玉動春風桑弧有事羞長劔花甲無情恨轉篷白日嘯歌天地老青衫拜舞歲時同雲山向晚催詩句目斷天涯沒去鴻春日雜書雙翼錦褵褷花間任爾棲春來自多雨日暮不煩啼日日花枝上新聲變轉嬌何如逐鳴鳯天上協簫韶清晨戒童子竹户不須開昨夜東風惡蒼苔有落梅庭樹誰教種無端惱客情昨宵窗外雨一半是渠聲無事盆池畔吹萍看藕秧金魚前歲放長得許來長種花種長春君子有深意願得堂上人紅顔亦如是凡花皆可愛萱草更忘憂未必真能爾聊將慰逺遊王相之畫石蝴蝶處士夢中幽意美人衣上春風日午小軒人靜闌干佇立從容樂歸為張椿庭賦東海先生伯兄東皇運玄化百物競華滋金商一司令黃葉滿庭墀大塊陶我形有合須有離古來賢達人此事那能違桓子治石槨三年費鐫追牛山感夕陽哀傷涕沾衣拳拳惜餘日欲作無窮規竟同草木腐千秋有餘悲賢哉椿庭翁洞燭今古非自言八十載不蹈危險機修身慎吾行大化從遷移幸此手足完庶不慙恩私生乎頽然順死當浩然歸陶濳擬挽歌生與親舊辭司空遊壙中酣飲仍賦詩二子信可人吾今其庶幾酌酒自為奠告終自為詞琅琅數百言藥石兼蓍龜春風動歌吹賓從相追隨山丘及華屋一視了不疑曠然世外遊豈為形迹羇人生有此身所貴能不虧全歸見其親此樂知者稀尚懷子輿氏易簀開衾時往者信自賢來日方未涯願翁劭厥德優遊過期頥寄張拱辰納納乾坤一草廬年來蹤迹半樵漁龍紋漸澀牀頭劔鴻寶虛傳枕內書霜後菊花香未減月中楊柳葉全疏飛書欲共天公語矯首青鸞隔太虛秋雨三首江頭雨深泥沒膝閉門十日氣欲塞黃茅斷岸景色異正晝狐狸嘯叢棘騎牛小兒誇慣熟疾走鳴鞭叩牛角幽人拄頰樓上坐欲拔青蛇抉雲破男兒不學資身策有家不居逺為客年過三十尚塵土屢揖庸兒愧腰膝堂堂白日間裏過可憐少年難再得嗚呼此道亦未喪且復臨風默惆悵日暮北風捲地來柴扉無人驚自開黃沙飄揚擊人靣起看天色如煤炲此時高堂坐白首弱妻供具正奔走主人酌酒殷勤勸不知客心隨風亂題柳文裔扇峥嶸碧琅玕上有棲鳯枝鳯凰飛不還山鳥空愁思春風開野棠緑葉含華滋豈無好聲音緘口芳菲時諒無同心人欲語先成悲佳人惜芳年壯夫懷逺期寧能闒兩翅撲簌蒿下肥庚戌歲暮在子南館夢二人傳呼入大門數折而東豫問此何處曰內閣也方思所以應對者忽聞百舌鳴而寤以詩記賈董才名愧不勝臯夔事業我何情春風一刻邯鄲路欹枕窗前百舌聲癸丑選庶吉士從左掖門趨內閣宛然夢中境也辛亥感興六首六籍無孔孟諸子競為書班馬雄兩漢韓柳後馳驅斯文雖未喪元氣久已殊云胡後來者每變日下趨靡然事華藻瑣甚雕蟲魚杳眇亂人耳黃鍾委路衢時無歐陽子誰為掃其蕪秦皇肆吞噬王白亦雄哉漢祖仗黃鉞韓彭後先來仁暴雖異趨戡定各竒才悠悠千載下文勝武略頽貔貅百萬輩孰是長城材虎臥不脫爪天行不廢雷干羽格有苗茲運久未回大運日頽下皇風返無期區區二三子乘時各揚眉聲名動京闕舉世欽所為吾觀古人作舉措不如茲悠悠歎升沉我獨傷此時漢王仗三尺陸賈陳詩書齊客工彈瑟其王乃好竽為業非不精鑿枘將焉如入水須操舟陸行須駕車君看屠龍手終年不食魚仲淹歸鄉閭榮光照江東散帛分族人府藏一時空明年買義莊傾槖無吝容向來西山下平田正春農老稚各欣欣鄉里自成風仰止慕芳躅咄嗟吾道窮急湍無漫波髙岡多烈風君子抱竒節安能與時同譬彼松柏姿豈雜蕭艾叢水濁不汚月道喪身乃窮誰云唐虞逺大運不再逢夢入大第若官府有冠帔如命婦者肅容出果實為禮皆大如瓜將别贈以硯其言意之委曲不能詳也記之以詩海霞流光五色爛瑶花風吹香不斷曲廊轉入迷近逺朱簾素壁光凌亂青衣傳言鳯凰囀雲鬟十二梳未遍金龍水寒粟生釧銀屏窈窕深不見朱扉啞然開半扇屋梁初日晃如練當軒揖我使我先神清度逺不敢眄遺我五花文玉硯雕盤異果珠琲粲入手光輝不能辨鳴鞘一聲來天上回身踏破梅花帳題吳子南梅花扇一枝清絶傍瑶池消息須從雪裏窺待得玲瓏開滿樹狂蜂浪蝶已能知筠屋為徐大章季父廷美賦徐君愛竹如愛玉種竹成林密如束林間結屋三四楹自説此生心事足闌干一徑曲復曲落翠飛青暗人目我疑月明深夜中定有青鸞屋頭宿青鸞飛去久不還滿林翠羽秋闌珊時時一羽落書幌清氣逼人毛骨寒前年識徐君傾蓋即知已坐我筠屋中焚香拂素几彈琴瀹茗終日留知我愛君清莫比雲萍一散雨經秋春風想見林塘幽晴窗展卷對圗畫使我東望心悠悠山林詩酒自真味江湖風波多隱憂洛陽紅紫易消歇冰雪此君宜共遊呼王猷招蔣詡便合屋中連日住明年騎鶴上揚州碧雲回首知何處花見羞後唐明宗淑妃王氏也豫讀五代史感其瀕死為子乞命數語故為賦之花見羞問汝何時生不得見爾靣徒聞誇爾名爾名至今猶在人爾貌當時知絶倫花見羞雙蛾緑出侯門入金屋君王本代來不識中州曲風塵一朝起零落隨馬足隨馬足事已非果然摧眉伏沙泥遊魂茫茫繞青冢羅衣血染何當歸花見羞入黃泉生時花應妬死後花反憐花謝枝頭子還結妾死心事誰當傳君王墓草埋寒煙春風麥飯灑誰邊花見羞恨千年賦得碧甃寒根夀胡友松曲廊隂隂清晝間砌臺亂匝苔花斑蒼龍何年蛻寒骨化為古松根屈蟠百折不能去回戈折戟相撑住突然奮起石為裂散作孫枝不知數堅剛不容螻蟻穴正直默有神靈護主人自是華陽仙雙瞳碧色耳垂肩平生丘壑有深癖愛此松根時醉眠薰風四月日正長松隂滿庭天氣涼我來夀君勸君酒摩挲鐡石龍鱗香松兮歲久根益深流膏滲乳日侵潯更千年後重相尋為君斸取根下苓采花釀酒共君斟飄然輕舉紫山岑友松諱澄方靣疏髯龎然福厚人也豫與其子以祥遊故往夀之同會者王鶴坡良佐戚龍淵舜和姚經憲平夫侯司訓公積嚴潤菴以德豫與以德連姻自此日始俯仰三十有三年矣追思往迹為之悵然甲申端午日記夜泊鳯凰山聞鳥啼有感吳蠶三眠欲上山吳禽夜啼吻欲乾啼言摘山須看火天欲明時啼更苦傷弓傷虎人物同此鳥前身是蠶女青樓美人紅錦帷歌舞歸來月已低銀釭斜明照春睡問著摘山渾不知節庵君不見徂徠松四時不改葉又不見淇園竹青青傲霜雪借問二子何能然信是平生有竒節男兒意氣干雲霓草廬抱膝龍蟠泥廟廊不改巖穴操事在他時人未知同以祥赴試過張性夫宿水底雞鳴事有無琉璃千頃浸浮圗眼中便覺塵嚻盡他日何煩去五湖落日放舟三泖西紅霞碧浪樹參差輞川風景還堪畫喚取王維共賦詩夢破滄洲明月低水村依約有鳴雞江神借我天風便牆柳枝枝盡向西楓橋望虎丘闔閭葬後三千歲霸氣銷沈虎亦亡留得當時舊園寢重重樓閣祀空王為阮大經題畫二首萬里龍沙隔五湖朔風吹雪點黃蘆題詩為問沙頭鴈來日天驕欵塞無單于羊馬漢臣衣泪灑西風日暮時千歲子卿終不死白頭知為李陵悲試後待榜題桂花期顧時亨次舜和韻花發年年自有時往年空恨得花遲長安歸路天香滿喚起黃筌寫折枝憶從年少看花譜數到紅梅已厭遲入手天香笑今日秋風己過第三枝為任藝軒題畫兼以識别先生家住南村頭草堂占絶林塘幽隂森竹樹交户牖屏居終歲忘春秋家藏舊書三萬軸子孫百世猶堪讀漁鄉松鄉及薇庵後先聲價遙相屬先生讀書不為名春秋四十猶間身彈琴賦詩足真趣壺矢終日留佳賓晴窗時臨硬黃帖鐡畫銀鈎照箱篋廣平老宋何足誇髙意直與鍾王接新編古製收不遺珊瑚寶樹琅玕枝人言一字不充飽先生把玩恆忘飢鯫生忝是龍門客十載過從如一日天風吹人不得留只尺遂成千里隔離筵示我古畫圗畫景倣佛南村居青山九點遙相映淺水平橋接芳徑橋上人來知為誰安丘橫雲逺莫定山林朝市不可偕臨圗使我心悠哉便須立效報天子還此同歌歸去來藝軒名志字孝忠能書好文安丘袁澄夫湘橫雲顧東曙曦皆藝軒詩會中友也河間道中遇雪次何汝誠韻冒雪登車倚酒酣日髙猶自怯風嚴不須更問春消息已有天花壓帽簷是日五鼓行天明雪滿頭䰒鬆如瑶花俞君世美董君世良相視大笑因賦此壬戌汝誠下第卒丙寅世美授臨江推官卒獨世良以丙辰登第今為大理丞同車四人十餘年間半入鬼録人生豈足恃哉己巳三月二日東昌舟中識東江家藏集卷三
