body:
  text: 東江家藏集卷十一中集七明顧清撰北遊稿詩一百五十九首己巳待泮潞渚單氏兩翁以鄉里來會長者八十二少者七十三皆朴茂淳古類山谷中人遡其生當宣德正統間得氣之方厚者也為之感歎適有以畫竹惠者因書其上贈之正月二十日手披雙竹寫新詩往伴髙堂兩鬢絲總是目前稀有物升平父老嵗寒枝題畫贈寓館羅翁及單希賢京華相識半鄉人潞渚逢君意更親認取畫中山好處草堂歸訪故園春南州鄉里北州身看畫思鄉總未真若到練川佳絶處也應回首潞河春題菜贈楊翁普能時年七十三斷肉六十年矣上沃泉甘野水邊烏菘紫芥各紛然主人為爾都忘味更伴清齋六十年題菊贈天津張信千户先任金山讀書好禮時號文張我家老圃金芍藥獨立嵗晚淩霜風新圖贈君為君壽白頭相對即蒼松田上堠田上堠堆復堆官新築圓若腄貴人賜田連帝畿不封不築民終以為私上植柳傍作圍牛羊不踐雨不頽堠不頽民不走為君耕為君守但願貴人千萬壽免為他人作封堠秋嶼為田廷相郎中賦水心著山自可畫况是潦盡霜清時使君於此興不淺絶境使我心先馳蓬萊猶恨弱水逺浮玉更比金焦竒星槎何日同汗漫歸來重賦遊仙詞重過安山安山閘下停舟處舊日風光又眼前試問阿蜣功滿未柳陰旋轉自年年蜣蜋功滿成仙安山村童語也黃家閘南數里地曠多盜丁卯北行閣淺三宿是日風帆迅疾家童指示其處為之憮然此地曾三宿重來尚眼明寒泉髙岸下還似昔時清岸隙有泉甚清冽下邳阻風簡天民漳河遡流兼遡風汾河貴人不相容清河一日可千里南風逆浪勢轉雄方舟野宿頻相失憂水憂風過三日篷窗晚立看風檣過眼鴻毛天一方請公小忍不須悶待渠定時吾亦進阻風邳南第七屯百户王君留宿薄暮風止行二里餘復作與天民舟相失戲書示風小住復顛狂泊我空灘外聽汝吾弗嗔汝寧亦知愧望露筋廟作荒陂下殘日踈木出古祠伊昔露筋媛明靈此棲遲渺然葭葦鄉挺此冰玉姿仙骨諒已蛻英風浩無涯想當野宿日寧與廟食期頽垣不踰肩缺瓦苔參差不知春秋祀有土能不遺堂堂七尺軀冠帶稱男兒婉婉形勢途所覬在一資使當生死際寧復顧四維念此欲下拜風檣浩南馳滄波望不盡目極空煙霏伐薪秋霖害我稼卒嵗淪洪淵青山富薪槱猛虎當晝眠炊人屢告罄飢僕怒爭先平生怯懦心蜂蠆等戈鋌會衆伐金鼓長驅陟其巔我進彼亦退芟夷砉無前方舟雜稇載浩歌戒言旋陰風海上來白雨如奔川飄零不自救狼籍遍原田虎暴厭人肉村墟哭相傳履險指一㸑命鄰倀鬼編幸勝天復爾栽培豈其然生人亦已久穢德熏彼玄鴟梟啄鸞鳯闒茸乘後賢橫奔不復制伊鬱誰當宣由來城門火橫及池中鮮嚴霜下百草豈擇蘭與荃沮洳本自處屢空誰爾憐似聞老農説豐穰在明年行看飫漿酒豈復憂厨煙小忍濟乃大天運有推遷再拜謝老農買金鐫爾言十月一日夢抑之得告還鄉賦詩送别寤而記其首句因足成之水心亭下木蘭舟昨夜分明賦逺遊消息眼前無可問滿天風雨獨登樓時先生調官南都後草餘日以母憂去計大故正夢時也顧德章尊人龍川介壽卷吾宗東吳秀奕葉多俊良矯矯龍川翁早脫名利場歸來自洪都十年鬢猶蒼以彼文字遊放此雲水鄉春風介眉壽珠玉間笙簧藹藹亭林雲幽幽玉山堂阿英所居上下千載餘聲華蔚相望何當駕扁舟共泛川上光手携蟠桃枝酌彼崑崙觴再歌行葦篇和以伐木章佳期自今始矯首希青陽十一月十一日極寒十分飢饉十分寒目見傷心耳亦酸袖手茅簷對殘日此身猶是論思官是嵗秋菜蝕於蟲再種皆凍而稿杭人以舟載鹽菹鬻于市從昔所未有也經始方洲田舍有憂其難成者賦此答之面勢佳而地卑下用力頗艱憂之者嚴潤庵以德也無食始學稼南村尋老農沙田積雨後沮洳連雲空方將葺棟宇擁褐歌年豐沿源渡水曲騁望出丘中嵗晏草木盡諸村林木皆髠為薪空江來逺風顧影忽自笑葛巾揚飛蓬平生坎壈身何事非所躬已為後時計况當吾嵗窮情知倚市利逺勝刺繡工所安諒在此違性傷我衷填海有精衛移山有愚公決策自今始有善吾其從周文煥致槐栽十二本列植道南美而且巨不日成陰矣詩以謝之庚午正月望日水後江村萬木童間人門巷一時空薰風六月清陰遍好與周郎賦角弓蜀江榿木三年大魏國槐陰四海平先遣黃花勸秋駕老夫還此聽音聲方洲示役夫田夫具畚鍤問我功何始我功亦汗漫我屋當素擬前臨有方洲後枕須曲水相泥以為深因以崇我址虧盈豈豫心一舉成二美行當藝椒蘭且復樹梧梓連村翳桑麻接畛被穈芑勉旃相豫成為爾歌至喜後屋成遂名至喜堂舊嵗三月阻風于清河屯田百户王君致香椿一本涉淮濟江顛沛數矣而此特無恙每一顧之心未嘗不在淮北也發春伊始移植朝陽賦以志感白門斜日阻歸航野老墻頭碧玉長感遇不辭千里别僑居又是一年強流光荏苒嗟豫老行路間關備爾嘗淺薄無能繫思憶宦途留此作甘棠題彭君言歸省卷青衫擬著慰親顔已著青衫卒未間他日三公真不換鴛鴦湖上綵舟還足夢中語相期不我會天上嫁張碩琅風凝矞雲輪囷倚空碧迎牛于子南千金買寶劔塵匣空挂壁賣劔買牛耕百口歌足食有牛無劔古且為之矧劔不往而牛自來水田和軟牛腯肥日耕十畝不言疲腰間寶鋏光陸離逢時還足斬鯨鯢不然力耕老東災作詩迎牛屬牛兒此意只可吳郎知四月十二日定庵先生過訪誦東坡過清虛堂詩用韻奉謝夜忩急雨鳴撒沙晨鼓不辨州官衙村童晏眠蓬户閉榆莢一徑交殘花經年不及長者室泥水真作田農家髙軒何自忽戾止豁若暝霧騰金鴉清容穆穆峙霜柏妙語郁郁飛天葩塵埃塞胸不自理次第一一煩梳爬盤飱菲惡愧草草幸有杞枿供春茶此時天公亦助喜列缺捲熖雷停撾騷壇夙昔願奔走世事八九堪咨嗟酒闌公去倚江閣遙見一鶴沖髙霞陪定庵過北野再用韻河洲淺水籠銀沙髙柳隔岸排晨衙濕雲晴旭互吞吐時復映空飛雨花人間嵗月總能幾三年不到先生家諸孫迎拜肅有禮别時稚語猶軋鴉不知甘露何日降親見紫芝團玉葩山林朝市各有適如痛須抑癢須爬羊羮黿炙豈不美陸羽獨好山中茶惜哉彌衡傲一世營門乃作漁陽撾先生歸來萬事足耳目所及吁堪嗟尊前有酒便一笑不用導引吞朝霞時北野先太史墓産芝甘露降庭樹壽萱圖為董徴吉張德馨題萱草花開北堂鳯翎鵠咮參差光采而佩之百憂忘金章謝庭子徵吉進納得官繡腹王家郎花前拜舞進瑶觴花枝暖拂春風香酒不盡花益芳重帷深深春晝長更六十年春未央四月十八日泖港舟中作漸喜逢人少扁舟傍野塘緑波侵隱几細雨對分秧潮長汀蒲短風微岸芷香沙邊雙白鳥來往亦相忘題愛山卷好山吾亦愛知子鍾情處鬱鬱橫空雲中有王裒樹君先墓在橫雲山書陸服周扇用包汝調韻詩筆縱橫格氣深故人應是渼陂岑秋來白髮知多少猶自松間抱一琴五月十四日遣悶有跋五月吳天漏三江禹迹蕪閭閻自生死城郭且徵輸窘蹇醫瘡計蒼茫卒嵗儲南陽有召杜異代直堪吁自四月雨至于是日不止髙田皆沒而在位若無聞舊嵗熟田正稅外畝加三斗六升矣至是又議畝加一斗七升出於縣令而郡中初不知也緣是得止雨後文儀欲過小樓間話詩以速之買得仙人縮地符三江七澤盡吾區諸公為有登樓興來看揚州白馬湖時一望巨浸而諸村樹錯立其間宛然湖中葭葦也米船歎禁增價也秋田生浪甑生苔日望米船江上來聞道城中有新令米船臨到却翻回題畫送王二守入京行路人人説好官一舟如葉上長安王守已甚嚴君王若問東南事不似江山畫裏看鹿門遺隱襄陽耆德世空傳谷口清風有象賢心識雙橋何日到青山無數夕陽邊江海收身五十餘青山不改舊園廬人來欲問遺留計孫子躬耕又讀書送陳經歷奉表留都兼簡秋闈諸君子陳君名廣閩人宦薄身清職事間每蒙騎馬扣柴關朝來喜色盈眉宇又向金陵飽看山山水金陵是昔遊海鵬雲鶚正當秋相逢為道長林下每夕披襟望斗牛聞宗孝御史復冠帶旋拂蔥袍整惠文聖朝元不負忠臣赤墀鵷鷺頻回首次第春風接後塵雨露冰霜總化工逢干何必羡夔龍向來陳迹浮雲變看取層崖雪後松題畫送都指揮袁君歸河間江海三年擁使旌江風不動海波寧瀛州可是垂綸地萬里燕然要勒銘題畫送陳子進教諭貴池秋浦山川似若耶廣文官舍列仙家無因得附星槎便箕踞長松看九華題畫送祁通判朝明年正月時宦瑾伏誅海內拭目以觀新化雪後蓬萊萬景鮮綵雲紅日在堯天江湖不及元正會遙聽升歌采菽篇午忩睡起杜以芳持扇索詩走筆書贈流水灣頭竹半欹夕陽山外鶴歸遲幽亭獨坐無窮意只恐鍾期亦未知藝屋儲書青青庭下草芬馥掩椒蘭能令脈望走使我緗帙完鄴侯彼何人插駕萬軸攢而我千載餘觸事如面垣孫翁識恨晚聞風起三歎締構亦已勤畜聚良獨難不知幾年心成此萬玉山屋下五綵衣萬卷胸中蟠小出已髙第逺圖未容殫春風開壽尊酒緑衣裳斑願以卷中訓永奉膝下歡青山拂新圖虹光起簷端何當淩七峯一快平生觀文儀别豫赴會試風甚留宿拈韻賦此為贈錯指長雲怪石尤海天回首是瀛洲飇輪未會三山駕文筆先題五鳯樓到手錦標堪一笑臨岐紅燭且須留前年六博非空兆有待金羊送綵輈十二月十八日大雪登樓作寄進之天錫時諸君方修府志酸風割耳鬚作虬聞雪強起開西樓西樓一望幾十里玉田瑶圃爛不收兩年粳稻化魚龞窮計每日占來牟眼前富貴已如此何苦更作明年愁書生耐冷自常事北忩清坐端誰留神遊不到黨家帳意行屢上山陰舟淮南山海誕莫考吳中溝澮須精求映雪著書堪一笑却似五月披羊裘次晚風雪又作用前韻玉龍飛天從萬虬下與白鳯窺紅樓天人翦水碧雲霄幻作萬寶無人收晚來疾風振林谷時復亂牛同一牟蔣生扁舟泊河處時天錫出行水道未返縱有美酒還堪愁進之病骨近始蘇旅食豈為魚美留爐灰撥殘紅燭短誰與再傾雙玉舟一夫失所是豫責二氣迭勝非人謀夜闌寒甚欲就枕解帶却愧狐重裘進之天錫舜弼有和章再用韻凍指握筆如拳虬猶有雪詩來北樓北樓幾日不一到寒陳未許陽烏收瑶琨鷺羽孰堅脆往往精辨聞龍牟長安書生四十韻逺喜不救溝中愁潁陰禁體亦何事雕刻但有空言留慿髙極目意頗豁滉漾如駕虛空舟珠宫玉宇隔人世一暖誰為蒼生謀洛陽盡覆吾亦願尚恐目前無此裘和進之壬戌雪中作冰柱誰家長萬尺世人未見神仙宅崑崙五城樓十二一一銀山半天白天河倒挂楹棟間下視蓬婆等卷石東方有士古袁安平生自信干人難閉門僵臥三日雪早起翻念神仙寒書生未試多濩落此事幾為流俗歎草堂相對一尊酒龍公水妃互奔走須臾瀰漫天地變崖塹區區復何有瓦溝何恨太飄忽檜頂何親獨淹久從來幸不分町畦此日寧須問容受晚來筆凍可奈何滿庭落葉寒風多嫦娥矯立碧雲裏似欲鬭彩撩清哦我今有詩亦不作此雪詎堪還更落辛未元旦試筆五十看加二浮生事可幾未論前迹繆已覺故人稀把酒憐青鏡臨風眷素衣漁童江上去拂我舊苔磯送陸時敏之長沙有跋猶記藍袍拂暗塵詩成二十九回春年催緑鬢看俱老身有青衫不當貧宣室久虛前席地草亭還有著書人荆吳風物皆相似莫為思鄉詠白蘋怡庵門下學者甚衆而豫與時敏及王君用常最先進豫無似最先忝竊而時敏繼之用常偃蹇紓遲蓋猶有待也時敏之往長沙也豫與用常餞于東園憶癸卯初春寄時敏韻用以識别俯仰今昔為之慨然題杭文錫扇雜畫菘薤桃李蓮芰之屬園實畦芼雜水英墨卿收拾太多情不知煙雨湖頭路猶有和鹽一味清題海鶴圖壽陳畏庵太守二月十四日合共祥麟侍衮龍回翔暫息海門風蓬山二月羣仙會又看桃花一度紅題鄭節之丹崖卷谷口清風不可攀丹崖千仞白雲間人來欲問長生訣瑶草春風盡日間松山種松傍青山因與青山名山耶不知松松亦兩忘形天風夜半來共作江濤聲清境不易到新圖空復情千秋無我棄相携斸仙苓猛虎三首猛虎昔當路獵夫逺潛身麒麟在山中左右良已勤一朝猛虎死彎弓射麒麟麟也亦有咎但非獵夫知不射亦不免射之寧復辭但恨豺與狼紛紛滿山蹊射麟麟不嗔射虎虎傷身虎縱不敢射可射寧獨麟射者每如此所以虎欺人東曙寄詩志局為教甚多次韻奉答蓋各言其志而亦互相發也舉世紛紛役此生腐儒身後獨矜名可能綺陌金丸子併有箕山潁水清米傳未消陳壽恥醬封須待子雲明南樓昨夜憑闌望耿耿銀潢帶玉衡次韻畏庵太守罷郡後作鴒原接羽憶當年君弟民懷豫同年進士梓里親耕召父田正好棠陰看露冕誰令清瑟改朱絃池魚豈識焚城火塞馬還留偃蓋天莫學君家老仙伯雲臺從此便髙眠君初履任郡𨽻有入京者舍於逆瑾黨人家其夕被收𨽻踰垣而免衆喧然謂君附匪人求進因以去官不知隸乃致前守書君無預也畏庵和章趣成郡志末有三泖九峰遺似屣之句再疊反騷憂國尋常願有年幾畨騎馬看湖田心勞為綰陽城印調古誰聆單父絃三泖共涵卿士月九山猶戴使君天不應便作江邊屣已是桑林一嵗眠故國遺文四百年消沈已似海東田編摩濫把丹青筆心賞誰分燥濕絃緗夾逺封應有日藜燈深夜敢誣天橫雲片玉書堆近多少英雄地下眠畏庵既定四城門名有詩見示次韻有跋使君無復眷吳儂歸興飄然萬里篷臨發匆匆繕城圃古人元有認真風昔叔孫所館一日必葺陸抗臨去繕完城圃史册嘉之先朝郡守記修府治嘗舉以自况先生不以罷郡而委廢墜於後人意豈異此因賡妙語用廣雅懷非敢以為佞也附原作北門鎖鑰不關儂只合煙波理釣篷去去無端題垤澤應煩人笑馬牛風東園餞别太守酒酣劇論至於得失寵辱之際聽之灑然是夕被酒齒痛不寐輒用蘇長公過清虛堂韻歌以揚之卒章頌言為將來世講之張本也三月草一日人間萬事真握沙黃堂作日猶早衙春風留人苦無計漫天撲路飛楊花楊花飄揚泊何處碧山夢繞先生家邯鄲已為魯酒誤事見前年字韻下注憂喜更足憑晨鴉東園雨餘緑滿樹猶有青子粘殘葩撫時惜别萬感集飄蕭短髮手屢爬衆賓微酣我輕汗論功莫計酒與茶花奴羯鼓不解事落日猛向紅闌撾盛時會須有代謝末俗正爾堪吁嗟歸舟安穩足春夢夢抱玉燕吞流霞題徂徠山人小景二幅山頭已自雨霏霏江上美人猶未歸趣放蘭舟迎接取免教雲霧濕仙衣逺山近山玉作堆東村西村梅亂開王猷興盡已歸去不道山童沽酒來題竹六言北固誰家江岸丁卯何處溪橋春盡煙波渺渺月明風竹蕭蕭宿天民西莊用丁卯楓橋留别韻碧玉繞村溪宛轉青絲拂岸柳􅧑毶風光嵗晚初停棹旅宿春深幾並驂己巳南歸與天民聨舟真隱底須尋谷口返招應與賦淮南銀箏畫燭通宵燕還似楓橋待酒酣固齒白玉膏歌為祁通判作神仙玉膏人不識煮玉和雲化為液溪藤均敷藤一色嗅之馨香捫無迹羅千有家蟯蚑宅風淩火焮震搖兀剪而封之還如石我聞三年索不得使君一封盈數百端稜而方長而白桓圭兩挺瑶琚析老羅見之三太息君來何遲使豫厄齦之邊兮齶之側啓封粲然雲白黑炎熇以清震淩息坐令食飲滋甘澤使君之仁薰兩邑歌謡已自盈阡陌我歌玉膏裁舉一玉兮固齒仁固國我與斯人同壽域玉膏之歌兮歌寧溢王義士助喪卷為王二守題太學資錢囊久竭丹陽麥舟篙櫓絶彭城義士古秦豪青史他年合三傑王侯一生慎許人手卷索詩遙贈君東南兩嵗溝壑滿放筆懷賢空暮雲壬申正月十九日過北野同南村訪北花園廢址明日北野有詩仍用清虛堂韻走筆奉答築隄不擬長安沙鳴鼓已放西曹衙夜遊涇南鶴城北隨處幅巾宜看花花林髙下映叢冢池臺舊屬淇水家衛公武本汲人譜曰淇水流慶録當時笙歌沸鄰里只今古樹啼寒鴉先生讀書洞千古過眼富貴如春葩時人不識競模擬往往背癢連衣爬消憂滿貯北海酒破悶亦有南山茶家生小奴解新曲時復羯鼓當軒撾郵筒往復方此始一倡何止三人嗟詩成揮翰向落日墨光繞筆飛玄霞為南村題蟠桃圖壽喻守蟠桃子熟金纍纍參差接到花開時仙山濶逺誰貌得使君燕寢回春姿海山千里春茫茫東風是處桃花香使君有意能小待實成亦是三千霜陳都閫汝玉以思親册求題久未有以復也二月君提兵過江賦此為别佇聞捷音把筆以俟都將牙旗出海門長淮北去淨妖氛平生一掬思親淚誓與天家策異勳塋木青青雨露垂赴君還憶别親時須知列鼎關心句便是元戎奏凱詩黃巖有水出天台下流入海湍悍能敗舟土人呼為惡溪艾齋陳君募鄉人築長隄截而回之民用無患是嵗與施彥器憲副訪豫雲間賦此為贈愚公移山骨成丘精衛塞海徒懷憂豈知天台萬壑裏一夜絶險成安流築隄回波誰始謀艾齋老人今白頭老人頭白何所求名與此水俱千秋彥器以忤逆瑾破家有詩述懷自題曰處困為書三絶句天津城下泊歸船回首江湖遂渺然邂逅雲間話疇昔不知今日是何年豫𢎞治癸亥識君於直沽長歎朱家亦男子間思劇孟是何人江頭抗手送君别愁見官亭柳色新脈脈江流渺渺春北河消息半虛真時羣盜自山東流向河南乾坤大有蓬飛客不用文詞效楚人招北野諸公看花杏花初發望君來望君不來桃又開花開不向枝頭看看取北墻紅滿苔劉時遇行人使占城過松留一宿而别環王封域海雲連漢使旌旗日月懸星象五州占驛騎魚龍千里避樓船華堂列炬翻疑夢紫禁聨鑣又隔年竒絶勝遊須有賦併將王會入新編竹西草堂鶴城西南瑁湖曲湖上森森萬竿竹竹林西畔屋三間六月清風灑冰玉林間一徑曲當門知君有意求多聞肩輿他日許直造共倚東忩看緑雲錫山王應藩工真行書尤善題署豫輯郡志為豫留數月將歸賦此贈之王郎運筆如運帚大字如盤一揮手有時細意寫烏絲蚊腳蠅頭滿忩牖松江古志新刻成龍宫塔廟俱鐫銘淩雲巨榜專有待不學韋公白髮生次韻楊崇周有懷見寄𢎞治庚戌進士乞為教授升國子監丞進長史手披紅印啓封題回首龍山落日西别路十年雲幾變王孫何處草還萋心期暗靄川原隔時節參差土炭低為馬為龍自君道可能懷寶視羣迷來詩云雲間天馬行彌健水底蛇龍卧轉低聞先生竹亭種竹人何在間亭故儼然名因王子傳興入武公篇夜雨涼生坐晴雲緑滿川人來問孫子玉立遍階前雲西為郭道士賦白雲西畔是君家蕭灑軒忩占物華我欲時來看修竹洞門無遣白雲遮童子東山采藥歸石橋流水漾斜暉回頭笑指來時路滿眼白雲橫翠微王西園畫鄭節之杏林深處圖鄭家杏林如董家王郎筆底騰朝霞青山周遭屋半隱中有石鼎熺靈砂平生活人不計功年年杏林花實紅花紅實落又成樹只恐青山十里無地容春風林日深花日密丹砂幾時成令我知消息分君一匕與君同升超凌太虛飛步紫清歸來弭節杏林下還問春風别後幾度飛紅英六月草二日天彛生辰諸親友携酒來賀蓼莪棠棣並感豫懷因書俗語為八絶句示之三十六年前此日幾多般涉到今辰夜來為汝從頭數淚落殘燈憶老親生汝艱迍惜汝深遺蹤歷歷怕追尋苦心自是當年事汝母當年更苦心同生兩弟一堪悲更欲相親不可追曾看東園春帖子春光都在紫荆枝吾家積德是鎡基致有如今汝合知人誤聽從他自誤莫將我是學人非昔年我似汝年時涉歷艱難汝所知人道好人容易做好人偏足受驅馳眼前地步放教寬儘著前行後便難我祖分明有先樣一生曾不用機關諸君置酒合歡聲一半從前見汝生自古仲尼稱至聖恂恂鄉黨似無能失人憔悴得人昌尺寸何須較短長但得好人長作伴自然門户有輝光題孫丹霞小景拂空翠蓋搖雙桐桐陰裊裊來天風仙山秋日如春融琪花瑶草長丰茸道人晏坐侍青童玉尊縹醴清若空洪崖有約浮邱公青禽誤集東皇宫飇輪西來滯瀛蓬停觴思入虛無中皇覽揆豫始鴻濛五十四載遺塵蹤玄綱袖領繄爾宗餘事復到臨池工良常西麓新宫崇金書玉刻騰蛟龍幼霞回首玄卿翁人間天上將無同蟠桃正熟火棗紅水邊處處黃花叢青山隱隱雲重重歸來何時尋赤松曹定庵壽八十一九山南下富林莊橫浦斜連八曲塘長向雲霄目雙鳯獨餘霜柏峙髙岡公與兄時和相繼登科有司表其門曰雙進士詩書盛有諸孫繼齒髮誰如暮景強八十春秋重起算廣成今在水雲鄉九日鶴塘莊過黃耳祠次髙進之韻六首平泉何處李家莊茅屋踈籬也夕陽三徑就荒吾不恨紅糕緑醑滿田香莊上無菊衆皆笑以為缺事五畝園池六尺垣清溪一曲正當門鶴雛牛犢皆詩料賸有美談留子孫進之詩莊頭幾日無人到黃犢生兒鶴長孫二陸亭臺昔未荒幾畨重九插萸房無人可論當年事又説江湖與廟堂漫説新莊類午橋幾年風雨困飄搖扁舟此日堪乘興來逐歸潮去上潮又向東村訪佛祠衰容數被野鷗窺不須更答三人問沂水風雩竟阿誰原倡有此外三人更是誰之句蓋小孫隨行也叢木回岡費討尋鶴涇回望九臯深洛陽遊子歸何日碧草春風歲嵗心過錦溪訪曹古松時年九十二以不及再見送豫甚逺為之愴然臨别贈此錦溪重過老人居丙午嵗曾到三十年來一夢餘掃榻又扶迎客杖揮金曾買教孫書衣冠故國風逾永君魏公利用之後水竹深村畫不如回首弧南光似月未須臨别重嗟吁送張教授之嘉興有引前進士蘄水張君容之程太史正之髙弟也自歸安教華亭士慶得師而君亦樂其風土方卜居焉而嘉興之命至得鄰之喜惜别之懷交戰于中而言固有不能盡也樂平門下久知名湖學東來重有情楩梓旋應充國器枌榆看已入鄉盟無端作惡緣新命便可相期是耦耕最喜家書十分便春波一夕到珠涇蒲葵扇歌送何朝宗教諭之同安天生蒲葵作涼箑野人乍見呼棕葉柄端出葉葉作摺裏稜外稜剛鬛鬛中攢邊展鳯翎接邊際筠絲壓妥貼通體天成此人合漢宫紈素出翦裁南陽白羽須編排丹青組繡却走避三舍紙屏石枕尚覺非全才先生南海我北海一葉輕涼為誰采翩然乘風致我傍簟几一時顔色改君今去我向閩關扇亦收藏篋笥間明年把扇京塵裏相憶千山重萬山將遊佘山先寄北野先輩時天有雨意北山長羡草亭幽有愧山靈欠一遊明日扁舟下橫浦只愁煙雨漫林丘北野書約東路見候用前韻蛇頭鳯尾好尋幽我亦西灣占一丘水墨畫圖三十里不妨分作雨中遊夜聞雪作口占山水皆言八曲幽何人肯向雪中遊于今便合成嘉話不待他年記某丘和顧德彰間居四詠冬至忩日誰添一線陰分明此日見天心星占紫極先三正氣始黃鍾冠五音簮佩曉趨天闕迥爐香燕坐草堂深君詩欲併三陽賀羲畫朝來已過臨頒厯老大驚看嵗月新天王布德本平均年占喜屬申連酉乞漿得酒之諺統法遙從漢改秦銜袖幾違當殿拜披圖共指隔年春向來光景誰能再敢復流連負此身冬暖流金破肉總鴻鈞十月由來是小春應為幾年陰作沴故教殘嵗物回新桃李有花朔南自古殊風氣刑德于時有屈伸間客未知調燮事願因和煦幸罷民己巳水後嚴寒有凍死者觀物前推無合後無離並戴圓穹履厚基畢竟誰形復誰色怪來相忤適相隨短鳬長鶴寧為病秋菊春蘭各一時試問陽坡兩黃犢還思清廟作純犧臘月十二日寶善堂上梁書示兒輩此堂成後屋俱新憶舊看新一愴神總謂承恩緣小子豈知餘慶自先人愛隆手足延殊姓讓洽家庭及四鄰先祖與沈氏兄弟同居至老鄰人侵地不與較此是小年親目見萬金留汝付兒孫癸酉正月陸時敏以詩贈行次韻客途南北幾暄涼又見旗亭柳色黃往事盡隨春物變離情直與暮雲長人將黼繡輕韋布我視江湖只廟廊昨夜小齋清夢裏一編還共短檠光與文瑞天民會散不寐用定庵丁卯贈行韻豈有謨謀益治安又將離别間交歡江湖十載頭看白風木中宵夢已寒病骨可堪仍逺客薄才猶喜是間官南村花竹西莊柳何日歸來曳杖看定庵用壬申壽詩韻贈行敬和小車不肯駐山莊短棹依然傍野塘忽聽驪駒歌柳陌似從鳴鳥集梧岡仙齡九十春猶淺客路三千里更強何日朝簪能謝却歸來先詣鄭公鄉除暴行壽子乾太守有引二月十七曉夢虎入門甚恐方言于家人而聞府中得虎已而太守喻侯命吏以肉饋夫虎猛而暴物其象為盜兵人之所甚惡也猛虎就戮此盜息民安之象人之所甚樂也除民之所惡以全其所樂此仁人之事得壽得福之基也越七日為侯生辰乃作除暴行俾從伶歌以為壽云五更夢虎方説虎天明饋肉來使府驚喜出門呼問故府兵殺虎如殺兔星流一矢鏡眸破典史施某射中一目電激雙矛夾心膂咆哮欲起踏兩股錦繃就舁氣猶怒去年海門妖血腥狼山事今年西江猶弄兵姚源華林使君四境貼以寧分明此物來象成有吾梗者殘其形書生方擬趨神京鄉園回首坦不驚何以報君雙兕觥願君百福仍千齡保我民物躋升平春田更賦騶虞行圌山長甚出孟瀆即見之舟人呼為隨山謂連綿不斷若隨人上下也阻風泊一夕青山傍我舟勢若隨人去因之得隨名萬古濵江住我來潮正落齦齶盡呈露仰攀魚龍窟凛有覆壓懼登髙足力倦望逺關百慮重來復何時記取停舟處題陸文質雲槎卷有引此卷留子齋中久矣北上倥偬携之以行夜泊趙家村夢雲槎督趣甚急書數行而寤髣佛可想遂足成之而關河羇旅行雲倦鳥之懷略於此具矣先生覽之寧無亦悵然矣乎四月十五日仙人乘槎真有無晴忩拭眼開新圖新圖只尺意萬里雲濤煙浪相縈紆煙雲縈紆望不極中有蘭舟一葉蕩漾疑慿虛仙翁長髯紫霞裾少年早侍紅雲居紅雲曉趨誤一蹶三年謫誦軒農書下方夭札帝所閔翩然復此來清都東浮玄洲掠蓬壺西歷翠水經天衢背挽北斗招黃姑銀潢俯弄明月珠青煙九點嗟塵區梅花爛漫三江隅平生繆識蘭臺儒結習未斷蚩泠符官舟風雨夜深卧猶有逺夢來催逋數行一筆尚可想銀鉤間錯珊瑚株張騫浪語空片石屈子逺遊終舊閭君才豈必謝時輩十年早已歌歸歟向來汗漫等鴻迹此日逍遙同澤車升天入地豈異路流行坎止真吾徒君不見行人倚棹汶河上回首煙江思釣魚過東昌訪前二守郝公適公生辰賦此為壽郝在松職專治水守亷奉公今不易得也四月二十一日别駕當年治五茸苞苴無迹稻田豐每從父老歌遺愛何意軒墀拜下風鶴骨未嫌金帶重致仕進階鳯雛還擬碧霄翀葵花榴蕚知人意相及生辰滿眼紅張虞咨以南京左軍都事滿考乞致仕升鴻臚寺丞南歸會于崇武驛託附平安有感書贈少保清風激懦夫家聲不忝又鴻臚寵光再錫傳弓裏世味三年染鼎餘南浦風煙增悵望西亭竹樹想扶疏何由便得從君去免向平安問鯉魚五月八日書事紫殿朝回白玉堂常時鵷鷺儼成行愁來隱几西忩下欲起孫通拜奉堂涯翁與二汪飲襄陵酒聞清來留一尊見待已而盡之賦一醉二首清至首以見示敬和江湖無地著心寬夢裏尊前一笑歡來晚尚餘三日恨春風只得半醒看黃閣歸來緑野寬諸生時得奉清歡吳泉晉水皆名勝正要先生次第看衆以襄陵為當時第一吳寧庵謂義興家釀可以敵之靳介庵復以鎮江五加皮為勝衆論未以為然涯翁示獨酌二詩序云是日飲松江酒次韻奉謝城闕非長往山林是夙期時開問字酒不賦解嘲詩緑樹停觴久紅闌點筆遲奚童斟酌慣深淺自能知左掖文書靜西亭竹樹幽幾時能獨醉此日是真休地逺陶潛社人懷庾亮樓賞音知有在誰復步兵求五月草二日馬上作新雨長安道行行愛好山美人何處也騎馬又空還合州訓導丘陵資陽訓導徐泰皆貢自安寧持原復提學書來臨别各賦一詩為贈泰之先吾華亭人也萬里誰傳北海書碧雞山下有雙魚歸裝帶得詩盈卷不遣空行到石渠西州文學故鄉人京邑相逢意自親歸見鄴侯煩致語江湖情事若為伸原復詩有江湖不盡情之句涯翁六十七嵗壽詩玉堂黃閣四朝班甲第安車未老間名姓兒童傳海外文章琬琰遍人間情懸北闕時占嵗家近西城飽看山自是皇穹壽平格不煩大藥駐朱顔賦荆樹同春送顧文明共愛君家好弟兄兩株荆樹一庭榮穠華正似提孩日扶倚還同急難情繞砌芝蘭添秀色並巢烏鵲助歡聲新詩不為將歸賦傳與鄉鄰作美評苦熱行寄傅北潭尚書苦熱不可耐觸事增煩憂煩憂將奈何怫鬱汗交流解衣坐盤礴四顧靡所投起步望北潭想見林居幽緑樹交夏陰清波映浮鯈于焉賦歸來俯仰百慮休男兒江海心所至希良遊軒裳亦何有庶以平生酬熊掌既我有生魚復焉求天風日暮起朱光頓然收華月流前庭碧雲淡西樓且復一尊酒吾道付滄洲李太史宗易母恭人邊氏壽七十太史尊人楘舊嘗尹上海夫君東海接棠陰令子西垣早盍簮紀德未慙羣彥後升堂已是十年心尊中月灩秋容滿誥裏鸞回御墨深向夕後堂歌吹沸錦繃重抱玉森森時太史得子又得孫東城夜歸與孚若聨句城上月初起孚若馬頭塵不飛天開萬里碧清漏出九門稀衢路人欲靜孚若雲林僧未歸誰知玉京地此夕共清暉清送沈東溪告歸長洲宦途南北事多違幾日相逢又送歸官好舊坊初視篆病來新帶總添圍天連茂苑三江近水繞漳河一鴈飛莫謂鱸鄉便堪老禁中朋輩十分稀宗易西園會散作西園日落更留賓醉别何曾謝主人猶憶午風亭上坐草香花馥似深春擬歸朝出江南耕暮歸江北休南北十餘里往來一葉舟情欣農畝諧迹與林塘幽田父荷鋤來立語依清溝謂言今嵗占禾麥皆好收內翰能不嫌社鼓樂田頭我本農圃人迷塗始回輈同心不待召同氣自相求勤苦謝父老相依願千秋與李仁仲副使酌别杏苑留題一字行玉堂收卷亦聨名君選吉士文甚佳有訾之者遂不預流雲逝水驚浮世塵榻虛忩又短檠詩律看於前日細宦情尤覺暮年輕盤江只尺回翔地肯為臨岐白髮生李太夫人麻氏夀八十八月二十八日生髙堂秋色避春輝四坐金緋擁繡帷寶副六珈明綵翠錦袍雙鶴動煙霏青雲並見諸孫貴黃閣新迎駟馬歸願學魯人歌燕喜百齡長得奉音徽九月十四日趙爾錫西莊泛舟和涯翁韻勝會復佳辰溪山汗漫身誰能百嵗健不放兩眉顰展席雲當樹回舟風起蘋謝公多逸興歸榻更留人重到曾遊地渾疑夢裏身樹看前日大眉共一時顰杖几分林樾壺觴間渚蘋錦囊歸路逺落日更思人屢與徵伯遊此好在鄰莊樹亭亭玉立身獨遊無我拒往事復誰顰山果紅疑橡汀花白是蘋板橋深澗裏應有武陵人雙節堂為鄭立之參議賦姑之心氷與清婦之心玉與貞誰知貞玉與清氷兩世一門雙節并雙節并兩心畢百年秪為三泉日三泉相見堪一莞葛源之流今日逺君不見州司舉例表門楣雙節遣孤同一辭歸善唐汝逹嘗侍其先君教華亭京邸相逢恍如一夢於其赴銅鼓學也賦以贈之怪底相逢熟姓名春風曾及見趨庭八千里外身如夢三十年來鬢未星賸有書香留仕版不將塵鞅愧山靈湘南風月堪娛弄可復懷人到鶴亭周伯明出按山西有紙屏留師邵御史家嘗借用之上有二月十九日與曹孚若聨句次韻柏臺春半氣猶寒柱史新除舊姓桓列嶽望風姦吏竦清尊對雨故交歡詞華此會真三絶鄰曲何因忝二難周與豫居對街盧在豫後興到不知貂續醜月明猶拂素屏看送汪器之太史赴南京司業汪家兄弟皆竒才聨飛齊上黃金臺馳聲東觀二十載一官不調衆所猜朝來忽報除書下却指南雍問官舍鴈行分飛心萬結聊復對牀相慰藉白樓兄行復情親祭酒吳南夫抑之同年聚首一堂春日溫豈徒文字破落莫直使風俗還真淳官河水寒冰欲結車輪已駕不可脫試問功名際會難何似别離情更切江東山水夢遊中故人更思羅與豐允升太常原學諭德因君寄語翻作惡目極江雲千萬重哭怡庵先生手拆鄉書淚滿衣西風落木正離離誰知總角橫經子便到蒼顔哭寢時兒女有情知眷戀豫妻先生女兄子也門墻無地答恩私馬駝原上青熒石儻許南容贊一辭陸玉崖訃至舊宅頻過有所思耿蘭書到一霑衣回看别路音塵盡獨立西風鬢髮稀不逐青陽媚桃李獨餘晚節照金緋九泉二俊如相遇應恨不同公早歸十二月朔郊壇候駕作季冬初吉已條風聖主嚴禋下法宫雲覆玉衢陰不動日升暘谷暈微紅十年海宇懷生息乙夜精誠徹昊穹詞苑小臣新扈從幾回翹望五天中檜亭示和涯翁慈恩寺二詩次韻奉答慈恩寺前海子頭謝傅錦衣懷昔遊委巷曲街人盡改石橋斜日水還流山林本是當時意霖雨何期此日收莫唱陽春滿都下明朝傳入鳯凰樓寶坊高處鳯城頭山色湖光引勝遊山作青龍平地起湖分白練繞城流觥船屢向松陰瀉棊局長教月下收回首車塵紅十里都人應起望仙樓陸水村母淑人壽八十十二月二十日生甫里仙人姑射姿平湖樓閣自瑶池簾間繡帔金叉擁天上斑衣玉帶垂倚户目隨江路永稱觴心逐海雲馳嵗寒風格長生信只有梅花最得知劉參議維信赴廣東索詩未及賦而其子應占入翰林因以寄賀使節初傳五嶺秋郎君又報上瀛洲書香父子賢相繼文學朝廷寵更優到處江山爭送喜向來煙雨莫深愁旬宣益重酬恩地只尺薇垣即鳯樓鐡柯為劉與清司寇賦萬牛鼓槖冶不銷萬山積雪凍不凋疾雷動地風倒海亭亭百尺撑雲霄老夔卻顧走百里鴟鳶螻蟻不敢窟穴安敢巢鐡之柯誰可擬秋臺老卿古柱史麾之不去招不來骨力風稜正相似君不見龍之年蛇之祀姦臣竊柄天下靡天下靡此老挺立風塵裏除夕諭病齒五十三脫齒久知非少媚明晨復加五豈復為爾諱爾家已漂搖爾意獨濡滯去爾非吾情虐我寧爾利爾職在咀嚼兹事久已廢牽聨兩不忍無乃併為纍山石有時泐天星有時墜矧我露電姿而汝復豫寄截肱斯壯夫戀棧非良驥揮手謝羅千勇決真吾契浣溪沙庚午二月草二日書感時水後疫癘盛行守臣美遷去部使者方加稅督責甚嚴陌上風花半欲飛樓頭更著管絃催傷心自起探斜暉燕子作雙翻水去蜂兒成陳采香歸園林誰為管芳菲東江家藏集卷十一
