body:
  text: 附録風聞言事論震澤王鏊著華亭顧君士亷為禮侍衆稱得人忽言者衊以曖昧事士亷不辯自引去或以問於王子曰若是者盍廷辯之可乎應之曰可凡物不得其平則鳴如所言者有之是天下之大惡也無之是天下之大寃也惡得而不辨哉曰朝廷以耳目寄之言官許以風聞言事雖有不實不當辯也曰朝廷以耳目寄之諫官許之風聞言事豈不欲是非之得其實乎而以曖昧不實之事衊人可乎且所謂風聞者何所始乎考之于經質之于史籍之于國家之典無有也唐時御史臺不受訟有訴可聞者略其姓名託以風聞此非風聞之所始乎凡前世所謂風聞者亦必事闗安危利害廹切勢不可緩故雖不實莫之罪也今乃以之攻訐隂私何哉吾聞聖主外屏不欲窺人之私故前旒蔽明黈纊塞耳有坐不亷而廢者曰簠簋不飾坐淫亂廢者曰帷簿不修古之人君待臣下如此其忠且厚也今乃以此為名何哉且百官之賢愚邪正較若白黑乃有所阿避不敢言舍昭昭之白過掇曖昧之浮言以自沽其直也是果得為直乎自昔小人之害君子多為流言飛語以中傷人或為歌詩以傳播于衆而不知其所自來葢多出于怨家之言妬者之口若是者當為辯明禁止庶幾抑遏䜛邪保全良善今反據之以加諸人人誰不可加者如此在位者人人自危矣誰肻為國任怨直道而行哉律匿名文書不得施行風聞之事何以異于匿名者乎雖朝廷不行而所損多矣昔漢相王啇持正不阿王鳳惡之使人上書言啇閨門事天子以暗昧之過不足以傷大臣有張匡者承鳳㫖復責之上知匡言多險詔勿治而鳳固爭啇遂免相嘔血死宋歐陽修以濮議引蔣之竒為御史衆目為奸邪之竒思所以自解乃造帷簿不根之謗以劾修修力辯之竒詞窮被黜修亦因自引去故忍而不辯王啇不免于死辯之而明歐陽修亦不免于去故人臣被誣有死與去而已是惡可泛泛以加諸人哉今朝廷保全臣子愛惜名節每為留中不下不知外議喧傳已快怨者之心堕妒者之計而亦不能安于位矣進言如是是為無名子報仇也安取其直哉如臣之愚凡以風聞訐人者莫若下其章根究所從來從來果實邪自當伏法以謝言者若誣焉言者亦安得無罪哉曰如是則於言路有阻朝廷不問所以示含容而廣言路也曰拒之而不納則於言路有阻因所言而根究之是行其言也何名為阻哉今民間有訟亦必兩造具備而後聽必不以偏辭成獄也惡有搢紳士夫受惡名不一湔洗受黯黮之忿以去哉若皆不辯人有惡於在位造飾惡語以聞于言官言官有惡于人自為謗語以聞于上皆曰我得之風聞也而可乎舜堲䜛説震驚朕師孔門惡訐以為直詩云營營青蠅止於樊豈弟君子無信䜛言又曰萋兮斐兮成是貝錦彼譛人者亦已太甚葢傷之也昔馬援以薏苡來謗李泌以餳獅致䜛直不疑無兄盗嫂第五伯魚娶寡女而撾婦翁自古受誣者多矣幸當時為能辯之不然至今含寃于地下矣昔陶安事我太祖御史黄瑾論安隱過上問何由知之瑾曰聞之路人上曰御史但取路人之言以毁譽人為盡職乎黜之安叩頭諫不聽竟黜之大哉皇言可以為萬世法矣伊川程子之言曰人臣進言當於有過者求無過不當無過者求有過司馬光亦曰彼汲汲於名猶汲汲於利也范鎮亦曰伺大臣之細過發其隱微以沽已直實不能也天下之事可言者多矣亦何必以暗昧中傷人之為快哉然則所謂風聞者固當禁乎曰禁之非縱之非故嘗為之説曰許以風聞言事者人主求言之心不以風聞中傷人者人臣進言之體東江家藏集附録
