body:
  text: 東江家藏集别集類五明提要臣等謹案東江家藏集四十二巻明顧清撰清有松江府志已著録是編凡山中稿四巻為初集乃未仕時作北遊稿二十九巻為中集乃既仕後作歸來稿九巻為後集乃致仕後作皆清晩年所自編故體例頗為精審又有留都稿四巻存稿十巻為其子孫所續輯今已不傳矣清學端行謹砥礪名節當正徳時諫疏凡十數上嘉靖初力請停遣旗校於時政皆有所獻替其詩清新婉麗天趣盎然文章簡練淳雅自嫻法律當時何李崛興文體將變清獨力守先民之矩矱雖波瀾氣熖未能極俶竒偉麗之觀要不謂之正聲不可也在茶陵一派之中亦挺然翹楚矣乾隆四十四年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:2482cfc306f1885c12dc7634901fb7c80e69564da85730a18c0a96dc36f28137
