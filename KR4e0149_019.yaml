body:
  text: 東江家藏集卷十九中集十五明顧清撰北遊稿序二十五首應天府鄉試録後序正德二年應天府鄉試録成臣清以職事當序其後乃拜稽首而言曰惟我國家之養士百四十年于此矣高皇帝始宅金陵戎馬未息而興學設科惓惓以得賢才成天下之治為務一時武烈文謨巍然煥然照映今古雖曰帝之神聖而諸賢之助亦多矣豐芑之詒于今益盛聖子神孫所以翕受敷施以光高帝之業成無疆之休誠不可謂無所自也夫人材惟其盛則其擇之也難精而其取之每患于不能盡譬則沙中之金千百一二則光彩照耀易以掇拾璚林大盈珍貝溢目應接不暇則挂一漏萬亦勢使然也臣嘗聞之前輩之司文衡者則亦病其然矣而臣生長畿甸亦四舉于是而後乃得之故知其難為尤真乃今奉命而來以校文為職凡前日之所謂盛者今皆得以接于目前而惟吾之所擇而前輩之所以為難者亦無所辭焉蓋喜幸之心不能勝戰兢之念而披閲之勤不足以釋鰥曠之憂至于所謂公無私者則臣之分內而在所不論也今撤棘有期録既成矣二旬之間􅊧珠于淵采玉于山亦自竭其力矣而臣之心猶未敢以釋然者高皇帝之作人始基于是皇上即位求賢輟儒臣以司校理亦首及于是是固望其率先四方羅真才以為新政助也而南畿之士其文章又若是其盛也則臣安敢謂所取之必得而遺珍墜寶果無一二于山海之間乎雖然登名是録者百三十有五人亦不謂之少矣臣又安敢謂無奇傑之才數人焉出其間以應上之求者顧嘗聞之文之盛者實之衰而天下之事類非一於文而無實者之所能辦諸生之文盛矣聖賢經世宰物之學槩於此具焉舉而措之成天下之治不難也其信皆所得乎故臣序録之終篇而三致意焉諸君者尚勉于其實而無徒以文為則有司其有望焉矣場屋執事諸氏名臣圭之首序詳之兹不復翰林院侍讀顧清謹序送瞿太守序三代之封疆其南不盡五嶺越裳獻白雉至重譯而來其所經厯則今交廣雲貴之間也而在當時則以為絶域矣天地間之風氣開發有時而聖人之教化其被也有漸粵自秦漢以來至于今日而峨昌麼些諸蠻之所窟穴戕牁特磨窮山絶谷咸列為郡縣聫為編戶以自比于王人蓋聖神之功化於是為至而方州之吏宣布德意涵育而撫摩之其為力亦勤矣廣南之為府即古特磨道之地山高崖險其民多儂人故俗儉以約有鹽井之利故好鬭而爭司衡鑑者以其然也高資良材靳弗以授吏於是者又多以其逺忽之由是澤壅於上情鬱于下上下之間日以扞格而昔之人所涵育而撫摩之者幾至於不可收矣夫惜才之良不以置之逺而使國家之德澤不究于域中山谷之民已自列于王人而不得與中州齒此其咎宜何歸而聖人一視之仁顧豈若是也上海瞿君起東以前進士佐天府幾十年三州二十七邑之民仰之若父母進參督府精敏練達太師英國張公而下皆重之用是聞于銓曹書上最將擢用君而廣南闕守告遂以君往夫以君之賢三州二十七邑之民知之太師英國張公而下知之吏部復知之豈不思偏州一郡不足以辱君哉其心以為屈一人使萬里之外知天子不鄙夷其民俾如君者為之牧也咸相戒以奉條教率禮服義不犯于有司與夫靳一人而隳疆埸之績孤嚮往之心其利害固相百也然則君之行其繫于天下也甚大而可以濡滯乎哉禮部尚書張公天駿合鄉人咸賦詩一首題之曰萬里春風持以為君贈紀德言懷其為言備矣豫故直道用人之意以速君之行送曹太守序天子在位之三年戊辰朝諸侯于明堂按國之故考其殿最而升黜之藩府亷車下及州縣顯績良才入為公卿餘各以其資登進而臺諫之英郎署之彥自正月以來相繼出外地望之髙下事任之簡繁銓次掄擇司衡鑑者視他日尤致精焉而吾曹君仲玉以工部郎擢廣東之廣州守廣州在唐為嶺南節度府北扼五嶺地重而大其南岸大海控制島夷以千百數昌黎韓子所謂帥得其人則一邊盡治無寇盜賊殺外國之貨日至溢于中國非其人則不幸往往有事者入國朝來諸州之事統于三司雖非復前日之任而地當會府兵戎財賦刑獄之政咸萃焉蠻夷無警歲時受事或有所咨議四方之賔客日至館榖將迎於守乎責之境內之常職不論也故名為一郡而事幾倍于他州非誠盡其心而老于更事者不足以付司衡鑑者尤于此而致精焉曹君以高才取進士為工部主事理漕河于山東三年不激不隨人畏而愛之事以大集入理曹務為員外郎郎中克舉其職以佐其長績用日章而端敏精愼終始如一人望而知其為可信任者及當斯舉皆翕然以為宜將行其同官徐君中行輩會餞于國門屬豫序其事曹君豫禮部所取士也知之久喜其道行而望其有行副用人者之心成天子之美政也故不讓而為之言送陸子齊赴南京戶部序𢎞治癸丑清初試禮部故少宗伯冶齋陸公今閣老西涯李公實主試事冶齋得清文喜置之上列出而延譽于公卿甚力私第通名見其諸子所以奬借而教誨之者尤至當是時私心竊自語幸得以鄉後進備門生之列而公之德厚如此其何以報之未幾公捐舍館諸子皆南歸不相聞者數歲然數聞士大夫稱道公家學有傳而誦巽章豫齊名尤習則又竊自喜公之有後而恨其不一覩以快所聞也丁卯承乏考南畿士得詩經一卷異之意其必名士及拆號則宛然吾子齊於是益信嚮所聞之不謬而喜吾先生之果有子矣子齊亦以清先公門下士而又得以文字交也相與日益親明年子齊擢進士拜户部主事分司南京都亭之餞公壻楊君百川謂清宜有述夫以清之受知于先生若是其深而子齊之於豫其契分又若是其厚然則序子齊别非清其孰宜之蓋吾聞良工之子必學為箕良冶之子必學為裘箕之於弓裘之於冶其事異而理同也先生德業聞望海內之人所倚以為公輔者而不竟其用天固將大啓其嗣人而子齊果克以其學振起于後計司之任誠不若館閣之雍容然自昔名卿負經濟之具者未有不該綜乎此六條均節宣公所以告德宗者皆實學也以先生之用而未盡者發之于子齊以自昔名卿所綜理若宣公之告其君者委之於受任之始簿書之校理金榖之鉤稽叢脞糾紛酬接不暇者皆所以玉子齊而大其成也然則是行也其所基甚大而何間劇之計於曹局彼此之間哉果然則繁弱干將又將自子齊出而門下老生為先公喜者不孤矣百川起曰此正吾人所以為子齊祝者于是出巨卷書之追納于行李送夏廷華同知濟寧序豫同年鄉舉士往往有名江隂二夏尤所謂傑然者如山既連得進士為省郎而廷華試春官輒不利往返南北踰十五年氣不少衰而學日益進吾每見春榜無君名未嘗不為有司惜而且愧其先之也戊辰試復不利銓次當得官衆且謂君不屑而君厭場屋矣於是同年士參部就注者幾十人江君廷璧張君時震最先授君次選乃得同知濟寧州衆又謂君且不懌而君怡然受命無幾微見于色也將發朱君顯卿輩餞于城南有執爵而起者曰廷華君早以文學名其薦于鄉年長矣五戰于南宫而氣不衰名益振何其壯也舊選人上第例得佐太府或作州次乃監郡縣令而君僅僅得一州佐退就列無一言又何其怯也君笑未及應而豫勦之曰斯乃君所以為壯者夫行已制事有義而得失利鈍有命義之所在委于命而自懈者非也君之所以百折而不撓也命之所在不以義而自制者亦非也君之所以隨遇而安之也衆人皆怠而我獨奮舉世方躁而我獨靜斯勇之大者而奚以怯云也然非獨此也廷華行且坐黃堂與太守可否事猾姦強禦一斷以法君必謂之勇矣仁以恤下而亷以律身鰥寡孤獨不敢侮而暮夜之謁恐恐然畏人知也君又以為怯乎衆於是歡然曰必如是而後為知廷華廷華必如是而後無負其所學有光于鄉榜也廷華喜舍爵而拜樂飲而後罷明日顯卿謂豫宜書以為送夏先生赴濟寧序遂書之壽張朝振七十序豫初入京寓錦衣趙百戶希明家趙永平人也因識其鄉先生張君朝振于坐觀其舉動磊落不作儒生酸論事可否評隲古今人得失又厯厯可聽豫心竊識之以為燕趙古稱多竒傑士兹其人哉時君方五十餘謝事家居京城子弟若錦衣指揮謝君汝容輩多從之學而其子元亮已有名未幾擢進士拜戶部主事與汝容往來趙氏益習而君年益高杜門郤掃不復可得見矣丁卯豫再入京君年已七十汝容乞豫文為壽而元亮方居其母憂豫辭之今年冬十一月汝容蹐門曰文今可以作矣是月五日先生初度也豫既感汝容之勤而又嘆夫流光之速乃作而言曰古之達人蓋有以天地為一朝萬期為須臾自豫識先生已十五六年由今思之猶旦暮事也以豫視十五六年猶旦暮則先生年雖高其自視平生亦奚以異哉方先生被褐衣論天下事賜第䇿名拜大行人使萬里外國朱衣玉節光照海外蠻君蛋伯俯仰道周其意氣何雄也已而掉名韁絶塵纓收其身於萬馬馳驟之場而自放于青山白雲之外又何其逸也然是二者於先生自視何如哉時雨將至山川出雲雷驅霆轟汨陵谷而霔九土風止雲斂澄空寂然豪傑之士其於是亦若是而已執是而言其前者既已若是則由今而往雖復更百年而事固猶旦暮也而又奚以異哉昔者屈子賦逺遊將求長生以觀反覆無窮之世變豫序先生壽而有感於出處得失之間知達人之如一日也敢因汝容寓一觴焉先生以為然其將為豫釂也海嶠清風詩序士之處世惟其無意于物而物自歸之吾徐起而受之夫然後受之者無愧而人皆信而服之而後吾之道可行于天下不然則雖其軒冕之巍峩權位之隆重威聲氣焰燀赫熏灼而有識之士固望而鄙之矣而其中實欿然俯仰承迎求以固其所有思其得之艱而恐其失也而且望進焉此其中寧有一日之樂哉而况其能以善吾政澤吾民而無負其所學也閩南李君士哲以前進士為旌德教諭升教授應天府由應天擢吾松推官皆以才行見推未嘗有勢位攀援之力其在松盡心職事訟者至為剖析情理歸于至當經君斷者皆自以不寃其律已嚴甚日用所須有仰于市者平直而取絲毫無所茍焉亷慎之聲著于逺邇而君以母夫人年高日謀歸養於進取泊如也李御史仲易按南畿將薦君君以其鄉人也力辭之而懇以歸請仲易未許而後使者堅留之剡章具矣而部符至以君判廣東惠州府由君之所行以觀其所得豈有一毫覬幸于其間哉古之君子不求有功不得已而功成故天下以為賢不求有言不得已而言出故人以為口實若君之乞歸而得遷求退而反進無所冀于物而物自歸之得不以為誇而失不以為纍也雖施之天下焉往而不達哉君之行也姚君程夫率鄉人為海嶠清風詩以贈夫自松而閩自閩而廣皆岸海之邦其間島嶼動以千百翠岑丹崖煙嵐雲木皆君輿蓋之所經行而旌幢之所披拂也風之為物觸于物以有聲而其聲又足以動物故昔人取以名詩以君之行事而播之篇章其清風乎渢渢乎起東海而薄于南海也炎煙瘴雨之鄉有不灑然而清泠者乎詩以贈君而目以是其有以稱斯行矣故為序之以見無慕於外其氣象有如此且以壯君之志使無改於歲寒也古文會編序古文會編者監察御史黃君希武之所輯也其書蓋萃文選真寶關鍵諸編之精者而一之故謂之會編初君為庶吉士讀書翰林時則有此志而未果既官內臺奉敕董南畿學政乃以其意授應天府學教授洪君敏及諸生某等緒成之既則以授吾郡守臨川民望繡諸梓以傳布諸郡曰將使里巷童蒙一展卷而得古人立言之法區區時文雖無事焉可也而以其首簡屬豫序豫謝不敏而君之請益堅則著其所以而系之言曰兩漢三代以前天下之文章一而已齊梁而降科目興而偶儷之辭作韓歐諸大家力起而變之終不能盡而時文與古文遂並行于天下場屋之利鈍進取之得失繫焉於是排比日工而古之道或幾于喪矣雖然雕蟲篆刻誠壯夫所不為而其傳于今者縟麗𢎞演猶粲乎其可觀也惟我國家文治蔚興無愧前古而科場習尚識者猶或病之至於書肆版行鈔選輯録之類則自有時文蓋莫甚于今日者矣唐之弊也得韓而興宋之陋也得歐而振雖不能盡而古道至今存黃君斯舉其有二公之心乎以天子之近臣秉司文之衡鑑指麾之下風草靡然而又搜輯前聞著之簡册以明示所嚮思皇多士有不翕然而一變者乎而走也辱與聞焉以挂名其編首雖學植荒落無以追往哲之蹤而所望于吾人則深矣今而後青襟濟濟熏班馬香而嗣周誥殷盤之響則先生之志遂而亦豈非豫之願也哉黃君名如金閩之莆田人陳君名威字民望與黃舊同官雅尚文事故其就斯舉也甚力云嶽氏家慶圖序嶽君器之家慶圖成以示豫屬為之序引豫因得寓目焉層樓華軒蔭以嘉樹烏紗銀章儀觀偉然而坐乎其中者尊翁光澤君也翟冠霞衣儼乎如賔而相向者夫人趙氏也器之及其子洪玄巾藍袍拱而立于左其弟用之明之率其子洋涫輩奉酒與肴趨而入于右僮奴欣欣各供乃事若將為君與夫人壽者而二老人齊榮並美安坐而享之人間之樂其有踰於此者乎聖人以壽歸仁者而語其體曰靜推其所喜好曰山光澤君之名仁人之所好也而自號以艮堂則其志可知矣少以春秋舉進士纍不第而志弗遷及宰光澤改廣昌誠心待民庭無二令而兩邑之民皆安之荐丁家艱遂卧弗起杜門却掃處㕓市若山林則其人又可知矣艮而止也靜而有常也仁之事壽之基也則其與夫人齊榮並美坐乎一堂而享子孫之奉夫豈其過者抑器之積學而文其子姪又多秀穎行將躡亨衢迹芳塵以君所未盡發者而施之於時則夫迓天休而延寵光以為君與夫人壽又有大于今日者方是時宜有高文洪筆發揮其事而何止豫言雖然為嶽氏慶其自今始也光澤君今年六十八以六月草日生趙夫人年六十七以七月十有三日生而諸子以君生辰并為夫人壽云鈴閣春深詩序吾郡守喻侯子乾以成化壬辰二月二十有五日懸弧矢於蜀之內江後二十有五年當𢎞治丙辰以明經登上第出宰湖南還朝為省郎為御史揚厯中外又十有五年而當正德辛未剖魚符來守吾郡方是時侯年甫四十神清而明氣壯而鋭若鏡之出匣鸞刀之發鉶而博大溫良視物之在前無敢有或易者始至承大歉後公私匱乏天復亢旱侯致其精誠禱而得雨歲乃大熟流亡來歸征稅畢出閭里熙然復有樂生之意而喣育撫摩侯之勤亦至矣郡之耄倪樂歲之康感侯之仁抃舞謳吟未有以發也而適聞侯初度之在兹辰則相與歡曰斯不足以言乎於是教授江西彭君鍊教諭蘄水張君頌而下率其諸生倡于學宫風于邦人而鈴閣春深之詩作矣古之君子任天下之重處崇高之位功在於社稷澤被于生民詩人歌之不及其他而惟祝以壽蓋祿位與名皆君子之所宜有惟壽則其於道也久而及于物者深其傳于後者逺雖君子於是無庸心焉而人之情固以是為至也侯之年方壯而未艾千里之任未足以盡其才郡閣雖深嚴要非侯之久居也諸君以壽祝侯而必目以是意豈異于古哉四時之氣惟春最和故在天為元而在人則為仁二月四陽氣之中和之至也而侯生於是博大而溫良元之德仁之量也而侯以之本其生以觀其所履則夫迓天休延寵光由一方而天下以至于無窮如古詩人之頌又何足異者且夫坐鈴閣之下當春深之候庶事理而民和訟庭空而無譁于以延賔僚稱壽觴咏清香畫戟之篇賡臺萊杞李之章農歌逺聞絲竹間作今日之會非盛德其何以來之彭君以詩序屬豫豫亦抃舞謳吟中之一人而未有以發者為即其首簡書之使觀于是者知詩人之深旨非徒以壽言也棠溪春意詩序棠溪春意詩一册凡若干首松之人士賦以為二守王侯贈同賦者劉君文瑞謂豫未有言且職史官宜為序棠溪者本西蜀之水名府之别館有水焉環其東南實類之前守眉山黃公平顧而樂之曰是吾家溪也因取以名之且以名其館所謂棠溪書院者是也書院為府之倅二職清軍者之所居有山石亭臺之勝當春之和花卉競發禽蟲下上林影波光交映互徹入其中熙然忘歸不知其為城郭官府也諸君之名詩意其在此乎則自有書院以來至于今經幾春自眉山至于侯居此者幾人矣昔無述而今有作且以為侯贈詩人之意其殆可思乎名區勝地自有宇宙則有之而景與心會者十不一二江山人所樂也或對之而隕涕花鳥人所恱也或感之而增悲谷風之和舒遲日之暄麗朱門之與蓬戶一也吾松自古稱富饒郡而近數年來旱潦相仍飢饉並作殍流之氓逃亡之室所在相望而侯之始至適當其時清心以檢身約已以繩下凡可以椓吾民者絲毫無所容焉而又跋履郊㕓出入阡陌為之築隄防疏壅滯以備患于未然蓋庚午辛未之間侯之無寧居者幾半歲而田事一新天亦悔禍歲乃大熟雖侯之謙虛退弗敢承而四境之內飽而嬉暖而遊覩霖淫而弗恐者其中固瞭然矣故前乎此之棠溪未嘗無春也而若罔聞見今日之棠溪春非異于昔也而歌咏興焉彼一卉木一禽蟲之類果足以盡諸君之意哉一卉木一禽蟲不足以盡意而諸君之意實于此發之則是詩也乃碑而韻者而可視以為流連光景之作也初侯既畢田事即董漕入都至彭城得旨而復今當得戒行新舊兩漕為粟數十萬鼠竊未靖衆皆為難之而侯挺然就途曽不畏阻蓋心乎為公故隨事而有立如此率是而行將所至皆春而何止棠溪也侯名卿字維賢陜西咸寧人成化丙午貢士云吳氏雙慶圖詩序新安吳棟卿既卒業太學歸省其父存和母孺人鄭氏於其家將圖所以為之悅者過吳門造其友文君徴明而告焉徴明欣然拂絹素為作雙慶之圖且歌以揚之諸君從而繼之吳素多文士徴明又其最也翰墨之精丹青之妙絶出一時而棟卿悅親之心於是乎著矣棟卿舉于鄉豫時在場屋有一日之雅焉因持以示豫乞為序豫曰然子之所以悅其親若是而已乎吾嘗覩子之家乘矣子家運幹公早學晚仕澤止一鄉東臯翁染指科名終隱弗售同知路判君惠澤在人而仕亦弗顯所以積之者深矣文禎以來畜德靡耀至于存和敦朴儉勤稱良于鄉而又得孺人以為之助所以培之者亦不薄矣而直于吾子焉發之然則子之身其所負何如也而所以恱親若是而已乎雖然吾聖人之訓以揚名顯親為孝之終事而子雲氏推孝子之心以日之不足而愛之人之情亦孰不欲務其大者顧時之未至吾亦難以預期而隙中之駒且不為吾親而少憩也則隨其分而致吾情焉亦豈非君子之所與者存和君今年五十四鄭孺人今年六十中鵠之鄉龜溪之原良田足以給賔祭華屋足以備燕休清池茂林足以笑傲而遊衍也而又有佳子弟如棟卿者歸自京華奉觴膝下展新圖於高堂詠諸君之雅篇曰此皆某平日之交遊也則所以樂其心怡恱其志豈有待于外哉棟卿學富而才良他日之功名殆未可量與夫瞻飛雲而太息過峻坂而興憂則其所得視今日為孰多而孝子之心寧為彼而遺此邪然則棟卿其無以前言而自沮哉松江府志序豫往歲憂居前守令都御史宜春劉侯琬嘗屬以志事會豫北上不果正德己巳豫復以憂歸明年庚午御史弋陽謝君琛按部來松問府之故病其遺闕嗣守臨川陳侯威復舉以屬豫冬始即事而侯以春去豫意其終弗果也會今守內江喻侯時繼至力主成之府始為縣時有雲間志既為府屬嘉興見嘉禾志直𨽻省後有松江郡志有續志入國朝有松江志有雲間通志通志者會諸志而成書者也雲間志歷歲久逺今已無全書其餘雖存而後生之得見已鮮通志所取又間有脫訛更後數十年遺文墜迹將無復討尋矣故今並取諸本參互考證會以成編而不敢略焉通志以後則續之事見他書而諸志所未及者補入之其間卷第之先後類目之分合事辭之易置取合倫例與便檢閲蓋稍異往編而大率皆其故也至於推原變始考見得失因事寓規間亦有之而罔敢以意參焉嗚呼郡之志猶國之史也昔人有成論矣史不為天下萬世而私于一人是之謂曲筆志不為一鄉與後世亦豈逃士論之公今兹纂輯蓋歉焉惟淺狹挂漏貽誚于大方是懼日月滋久參質為艱而梓刻成矣敢述所懷布諸簡首後有作者即其具文加之黼藻以成一郡之書豈惟寡學之幸亦前後諸公所以屬望之心也志為卷三十二為目三十一目之下又有目焉凡十有七卷始終暨圖目為版九百十有六居之郡閣備散逸也同事諸生與郡之僚屬贊襄於是者並列名左方壬申冬十月初吉賀陳都指揮序七年夏官軍敗羣盜于山東又敗之于河南其得脫者入於江將窺三吳於時陳君汝玉以都指揮僉事備倭駐金山聞變提兵出江上而官軍亦踵至君協規同力殱之狼山八月師還士友畢賀張君拱辰離席而言曰君兹行有可賀者二而功賞不與焉昔君先祖父朴菴公自金吾調溫州其官指揮使也其後以討賊功升僉浙閫事領曹京師坐謫復起以功名終君之初官亦指揮使也既而以材武稱亦選僉浙閫而破賊江上功亦無忝焉朴菴之謫也居金山數歲吾松之人多識之君之來儒雅練達松人謂真朴菴孫而又有今日之事朴菴雖沒而其道可謂益光矣斯可賀者一也夫君之功固朴菴有以啓之也而朴菴之道至君而益光君能繼朴菴而光其道矣而君之事又未止于斯也繼君而起者人有不拭目而觀之邪斯可賀者二也乃相與賦光前啓後詩以為君賀而屬豫引其端朴菴在浙江識太守張公瀞之于未遇其詩太守實序之在金山與東海張公遊最習唱酬甚富其起於謫也平江伯陳公實薦之汝玉之初官已為縉紳所推許閣老木齋謝公尤器之其薦以備倭則大司馬東山劉公皆一代之偉人也傳曰達視其所舉又曰觀逺臣以其所主朴菴之祖孫豫於是有以知之矣拱辰之請序也楊太學美之實偕來二君皆松之俊也是又足以徴之矣而豫於此且有説焉乃不辭而併告之曰霍去病以胸奴未滅而不顧其家馬援當南征據鞍顧盼以示可用疆埸之多虞固忠臣之所扼腕也今北河雖靖而鄖襄饒睦之間事猶有可憂者君於此能無意乎拱辰謂君之事不止於斯也而豫亦以為然其啓後其光前且有大焉而所未知者君之誠有意乎否也二君歸其為我問之正月十五日序海天晴晝詩序去年春吾郡守喻侯壽四十一邦人士之能言者賦鈴閣春深詩以賀豫既為之序矣是月既望邑博士王君文昌與其同寅廖君軼張君朝儀合謀舉故事更賦詩曰海天晴晝而復以序屬豫曰豫故自吾學升且侯所善也不可以復辭于時賦者方操觚豫未得而遍觀也獨取其名篇之義而繹之以為羣玉之先驅夫海侯壤地之所漸也地之瀕海者多風而沮洳下濕少暘而多雨在吾鄉為甚春夏之交則又其甚也海天當春而遇夫晴晝則其風日之妍麗景象之和淑人情物意舒泰怡懌蓋有非言語之所形容而丹青之所能狀者侯之生辰既惟其時而自履任以來隂沴消匿陽和宣暢年榖屢豐而今歲之春凄風不興零雨應節雨必以夜曽無崇朝鄉人父老皆相慶以為此樂歲之徴治平之象也則諸君之賦詩而寄興于此者豈空言哉前日之詩曰鈴閣春深本侯之所居而言也今日之詩曰海天晴晝本侯之所御而言也坐鈴閣之深春撫海天之晴景時平而百物熙人和而頌聲作侯于斯時觀天人之感孚思休徴之所自寧不亦莞然而一笑邪曩之序固謂侯方壯而未艾千里之任不足以盡其才鈴閣雖深嚴非侯之久居也信斯言也則海天之晴晝雖甚佳麗豈侯之所能長有哉豫也方將有北轅徘徊鄉邦欲行而復止者彌月因得及侯之生辰而為序是詩又恐侯之果不久于斯而震風凌雨有以敗吾稼而撼豫廬以為南望之憂也故其於是也尤眷顧而不能已云雖然師尹日也卿士月也所處崇則其所徴召也益大侯方自此而羽儀于天朝其為晴晝也將遍于天下而豈獨海邦哉風木興思詩序人之情莫不欲終養其親而親之年勢不能與子同久亦莫不欲厚其親之養而人之富貴恆不於壯年劬苦於孩提而不見其成長膝前之窘狹而憂裕于永感之餘此古今之通恨而臯魚所以泣哭而死者風木之言千載流涕豫少而讀之未嘗不為之廢卷而况于今日也陽曲張侯尚德既喪其二親而來令吾邑追思不已形諸誦言邑縉紳聞而為之詩以泄其哀悲名之曰風木興思而以屬豫序嗚呼豫尚忍序是詩哉雖然不可以豫故而拂侯之情以重其悲也蓋侯之先人容庵公惇敏慈孝厚宗族而惠比鄰其言行皆可為鄉邦表式而侯母湯孺人篤于教子脫簪珥為侯買書繼母賈孺人撫侯兄弟若已出而以嚴飾愛督其弛而戒其盈有丈夫所不及者湯既早亡而賈與容菴及侯之成名相繼淪逝雖膝前之奉未至於窘狹而南來風景其有觸於中者多矣此臯魚之嘆所由興而諸君之詩所由以作與雖然吾又有聞焉君子于親之存也致力於孝而移以事吾君於親之沒也致力於忠而推以榮吾親蓋知其不可兩全而求自致於其一此固聖人之所許而人之親亦以是望其子也張侯誠篤豈弟而為政有經將來所至殆未可量則所以孝其親者有大焉而豈徒為魚之悲也哉豫不忍序是詩而重傷侯之志遲回數月而終不能文思永感之人所以求盡其心者無以易此也於是乎言蓋外以為侯慰而私亦以自解云北堂永日詩序孟子曰君子有三樂而王天下不與存焉歷數之則以父母俱存兄弟無故為之首夫父母之俱存兄弟之無故閭里之人類有之而何為其擬於有天下者之樂也天地間豐厚淳全之氣其聚也有時而以其全畀人亦造物者之所甚靳窮簷蔀屋之間骨肉團聚終其身不知以為福功名之蓋世富貴之鼎來人望而艷之矣而劬勞終鮮之感或交棘于其中據當時之咺赫而無論其他誠有如前之云者茍即其所安而使於窮簷蔀屋之人兩易其所處吾恐其有此欲焉而彼難之者矣充是心也則雖王天下亦何以加此哉吾嘗即是而觀天下之人當永感之餘與居具慶之下者其心之甘苦何啻糵蘗於是焉不幸之中有一日之歡可偏承於膝下則其遑遑汲汲宜又何如而為之黨者可無以助之邪鄉進士吳生子南喪其父一間翁獨奉其母黃孺人以居今年壽七十夏六月十七為設帨之辰子男痛一間之不可作而幸孺人之康寧也將乞詩縉紳及是辰稱慶于堂下以豫當北上不及與兹會也豫請為之文夫子南所謂有一日之歡可偏承於膝下者雖其視具慶有間焉而抱痛終天之人欲以易子南之一日其又何可得邪故諸君聞子南請竸為之操筆而豫于此雖甚戚而不忍辭焉造物者之於福澤固靳以其全畀人而於善人亦未嘗不加之意一間之為人博大深厚宜有遐福而不永其年孺人之賢由僮𨽻而上恩感誠孚無間言者而孀居以來幾二十年扶植其家門經紀其內外劬苦辛勤亦云至矣乃獲見其子之成名以享有今日則天於孺人亦不可謂無意者子南質性醇美類其先人而又輔之以問學發之以文辭揚名顯親可計日待今兹之舉乃其遑遑汲汲之至情求自致于一日者惜豫哀苦之餘觸事悽愴雖強為之説而終無以助發其歡聲也雖然以豫之悽愴而幸其猶有及焉則所以承歡恨日之不足而何假豫言哉詩之目曰北堂者孺人之所治曰永日以識其時而因以為祝也送曹西山詩序富林曹氏以詩書冠冕望于吾鄉而九峯定菴兩先生及吾十峯司憲名尤著西山君定菴之弟而十峯之兄也早承厥考後村翁之教讀書力本不售于時而敦朴謹靜無世俗澆淺浮靡之習鄉人皆愛敬之今年秋來視司憲于京邸四方之人士與司憲遊者目君之為人亦無不敬且愛之於其還竸為詩以贈豫得侍定菴最久與十峯遊最習且辱同升其於君非直四方之人士傾蓋于一時者比也故為引其端歸舟在門羣從咸集敘暄涼無恙外為我謝定翁鴻冥碧霄醯雞蠛蠓起滅甕盎有能撰杖屨相從于九山煙靄間不知能許之乎否也汾水飛雲圖詩序汾水飛雲圖一幅詩若干首朝之縉紳為都諫張君汝霖思其尊人汾陂翁及其毋韓而作也望飛雲而思親起于唐狄公仁傑而後之詩人賦人子之思親者以之梁公仕并州而親在河陽張君仕京華而親在汾水并與汾皆在今山西於古皆晉國則賦張君之思親而取梁公之事尤近也汾陂翁敏悟特達蜚英庠序間視一第真土芥可俯拾耳志弗獲遂而以銓授縣曹居汶上七年有惠愛當途方器任之而汝霖學成舉于鄉遂幡然來歸老汾陂之上于今餘十年其有以自樂矣汝霖擢科名官禁闥居清履要以古道自持天下之人想聞其風采而推汾陂翁之善教上亦為錫翁命為吏科左給事中配韓為孺人並顯榮矣然而晨昏之養十餘年間汝霖之所以自致者終闕如也而今年翁壽且七十朋尊之享又弗獲躬焉此飛雲之感所以益切而諸公之賦詠所由以發歟豫鄉友王君景昭於君為同年數稱君之賢豫蓋慕焉而未獲與之遊諸公之有作豫亦未及而景昭以君來視豫且屬豫序之琳琅珠貝炳耀後先吁其盛矣而豫何以加之且詩之盛莫過于唐梁公之事史書之後世稱之而在當時若沈宋燕許諸君尤所謂以詩名者風雲月露嘲咏殆遍而公之事無述焉豈不聞之邪將有言而弗傳也而君于此既得之又使豫序之序不序不足為重輕而詩之傳必矣則夫升金臺而想橫汾與登太行而望河陽者後之人將不以並稱哉情之感發于一時而名之傳乃並于先哲汝霖之壽翁有出于翰藻丹青之外者矣諸君之為此頌也而有規寓焉豫故繹而申之固將以梁公而望君也武舉録序正德九年春上既親䇿進士于廷遂詔有司試武舉士夏四月太子少保兵部尚書臣陸完等具條格以聞蓋三年春上所定也越壬寅試騎射乙巳試步射完等蒞之戊申試文三道則命侍讀學士臣清中允臣詠主焉既乃與都給事中臣陽春臣金郎中臣果臣文祥等參互考校取射之及格與文之中程者六十人録其氏名又擇其文之優者六篇刻之以獻以傳示於天下武舉之文至是凡再録蓋真與文科並矣臣切惟我國家奄有四海幾百五十年高皇帝汛掃寰區定鼎凝命文皇帝驅駕英豪揮斥羣孽天下大定尊用儒術表章六經海內風動而講武練兵曽不少廢列聖五朝一德相承以至于我孝皇仁涵義濡十有八年羣生休和不見兵革於乎盛矣皇上繼之以英武之資撫盈成之運治極而熾隂妖孽牙潢池竊兵氐羌窺間雖捷書日奏而邊警猶嚴斯亦古之賢王拔足拊髀揖酈生而想頗牧之時也然則上之所以甫畢文科即詔選武而公卿大臣所以奔走而承事者豈徒尚彌文修故事為治飾美觀而已哉諸君之登名者非世胄之英即良家之彥平居無事固嘗鳴劍抵掌馳志伊吾而况在今日以其雄毅果敢之姿文之以禮樂詩書之懿加之以感恩思報之心以赴千載功名之會則其戮力效忠宜又當何如邪清書生也未嘗知兵既濫司校理則於諸君有一日之故命題發䇿蓋嘗寄微意于其間欲其采覽前聞求古賢將之用心與國家所以登延之意入則利國出則使民為明天子保億萬年全盛之治諸君亦既知之矣其果能加之意乎用敢于撤棘之晨申以為終篇告惟諸君其念之哉知是舉者尚書臣完左侍郎臣珂同知則太子太傅成國公臣輔太傅定國公臣光祚太保會昌侯臣銘太傅兼太子太傅新寧伯臣祐廣寧伯臣佶右侍郎臣玉監試則御史臣奎臣縉提調以下凡執事並列名左方夫人朱氏六十壽序少師西涯公之配封一品夫人朱氏今年壽六十嗣子尚寶司丞兆蕃從子中書舍人兆延將以其生辰稱慶堂下夫人之壻尚寶少卿崔君世興得善繪者為瑶臺仙子圖以示于同門擬作詩助蕃延為壽而以其事屬清曰子宜書往歲公壽六十時諸生在門者有蓬山永晝詩流聞四方傳以為一時盛事時清以家居不與也今八年而夫人壽亦登兹清又適在門而崔君重有命焉其敢以不文辭清惟自古王公大人任天下之重而能專意國家克樹立其勳業流聲光于無窮者其中必有賢妃淑媛協德同心以為之輔佐而魚軒象服珮玉鳴環侈彤管之書而通長樂之籍者亦必其人有以稱乎是而天始畀之西涯公碩德重望光輔兩朝為國元老功業在社稷聲名在天下而清約簡索不改平生此自公之高致而夫人家世六侯貴富兩極乃能釋去紛麗躬履儉節與公相表裏四十年來俯育仰承恩洽禮際所以成一家之政者不知視桓少君為孰多至于思滿戒盈以退為進贊公之決以逸公老而增其令名則自東郭生妻老萊婦之後知其不數人也以昔凖今詢事考類則天之所以厚夫人者夫寧有窮已哉且夫六月長夏朱明麗空百物嘉美日之初六彭鏗降誕之辰也而夫人實懸帨焉得氣之盛與數之長又孰有過于此者夫然則夫纍錫重封崇極九命榮華尊寵安享百年皆夫人所宜固有而豈蓽門蓬巷匹士窶妻幸富貴於一朝玩隙光于俄頃者可同日語哉尚寶中書懷撫鞠之深愛顧祿秩之自來所以悅其心娛樂其志固有不間于晨夕者而今日衣冠滿庭歌頌間作凡皆為二君來也夫人之心寧不於此而一樂邪神仙之有無不可質信而崑崙瑶圃荒忽緬邈亦難以形似求之若夫人之盛德而獲壽中書尚寶與崔君之致孝而承歡可以式閨門而厚風教者則不可以無述也敢再拜而書之不知我公見之亦將為一莞然否也西城雅會詩序冬孟十日吾郡守喻侯夜過豫西軒司憲十峯曹君繼至因共小酌時菊花盛開十峯舉燭臨之愛玩不置曰古人以燭照海棠未聞照菊此風致不可無述也首倡為近體詩四韻索豫和之又明日會十峯宅後出四韻豫亦和之其後周侍御伯明盧侍御師邵施侍御聘之輩聞之亦皆有作題之曰西城雅會十峯屬豫書其端自兵興數年所在多事衣冠遊賞之趣雖京師不免落莫喻侯蒞吾松當凶荒疾癘之餘補葺撫摩盡瘁畢力不三年漸復承平之舊其來考績也吾人之見之者皆欣欣焉而侯文雅豈弟喜清約而厭紛奢人亦樂以親之賞菊之會本自吾家非有京洛園池之美清談賦詩非有梨園伎樂之盛而一時人情物態歡鬯怡懌略於此見之舉一方以觀天下則是詩也不可以其寂寥數章而以為無所繫也遂書以歸之十峯之兄定菴翁間居林下最善吟侯歸以示之或以豫言為然以倡于鄉人其將復有作也豫安得與十峯倚而歌之太傅新寧伯七十壽序昔我高皇帝應運龍飛長淮以南泗濠滁廬數千里間豪傑並興景附雲從共濟洪烈以至于文皇因其遺材入正大統天下既定疇功顯庸錫號祚土伯侯公王圭組蟬聨而其子孫又多忠孝敬慎克荷厥勳以當于天心百五十年繼繼承承莫或替圮昔漢高起豐沛定天下同符我朝元功之封鐡劵丹書藏之盟府事亦相類然其後不一再傳或絶或微聲消迹沈唐之太宗雪恥除凶房杜英衛之功為最而其後嗣類皆不肖踣其氏名以視我明寧不亦少愧哉太傅兼太子太傅雲溪談公其先故滁人也高曽二祖有功洪武永樂間世胙新寧爵第三等公髫年承廕歷事五朝幾六十年中間持節將命握符統兵出入兩京更踐四府委任之隆重寵眷之優渥自太師英公而下莫或班焉若在往年邊徼犯順命將徂征每當公受任冦輒逺遁蓋兵嚴而不出者三人尤以為異而公文雅謙退恂恂若書生初不知爵位之崇高威望之隆赫也然則朝廷之所以重公而公之享有祿位保其功勳皆理所宜有而豈漢唐之世倐興而忽滅者所得擬哉公今年壽七十春二月九日實公嶽降之辰公侯而下咸集其第舉觴稱慶而介陽武侯薛公屬豫為之辭豫承乏講官經筵之事公實知之不可謂無一日之素而元臣碩輔壽考康寧又非一人一家之慶也故為之推本而言之方今海內雖平而犬羊狐鼠之羣猶有跳梁于疆場之外者彈壓折衝繄公是賴石渠金馬之勳且將有敘麒麟之勳而贊凌煙之像聳我明威德於無前者而區區日月之祈又不足為公道也公名祐字元助雲溪其别號云南村歸興詩序南村歸興詩者送劉先生文瑞而作南村其所居而因以自號者也先生自京歸南村者屢矣其始被薦來當𢎞治癸丑謁告省其親諸君賦詩送之豫時為之序不言歸興者望其即來也丙辰再至而先生親已老因以疾歸蓋將終其身矣而諸君之望其來者猶未已也及是親既終多勸之行而周氏甥男從母入京師先生念其幼也為護視以來而功名之念泊如矣既至訪諸故人外閉門却掃日走價索諸君詩曰吾待是以行不者吾無事于此也曹君孚若因創為此題以明先生之志題之下又為十題自京師以至鄉國皆摘其山川風景古今人物事之可紀者各賦一詩以發先生之興豫亦為絶句十章其餘或專賦一題或全用曹韻不數日而皆成先生復俾豫序蓋豫至是三送先生歸而為之序者再矣先生篤學慎行宜有以自見于時亦既名薦章參選部矣趦趄前却竟不以終身之榮易一日之養人皆為之惜而未嘗有一介于中今之來其精神猶壯茂也而逃名藏聲日思速去雖其壻御史君不能留而所為眷眷者獨在於文墨翰藻之間也先生之為人於是可見而其歸也殆若風鵬雲鵠出埃壒而翔于紫冥豈復可攬而羈哉嗟乎先生行矣豫何時飄然得從君後塵相與杖屨南村中數平生之遊厯以及今日之事望上林臺殿於煙霏縹眇間且相詫曰吾二人其從天而下也既為之序遂以所賦詩系之左方壽筵列詠序朝之縉紳為兵科給事中王君明遇壽其父栗齋先生賦詩十篇篇各一題題各一事皆櫽括先生之履歷與明遇之意為之其曰楚天一鶚者先生成化庚子薦湖南湖南楚地先生自此入中朝凌雲厲空始于一舉志之也既而上春官連不利孝皇初政始推擇為中書舍人侍雍王于京邸天人之對闊焉故繼之以瀛海遺珠惜之也中書舍人之職今略變于古而官清地近實異羣僚薇省之吟花螭坳之載筆猶故典也雍開國于衡沅湘嶽麓屈正平賈誼之所周旋南軒考亭兩夫子過化之地皆有轍迹焉擬賦懷賢正衡遊事也雍國除上進先生為德王傅德封濟南密邇洙泗魯殿之詩書孔堂之絲竹則山東事也先生今年壽六十一諸子孫侍行者八人明遇獨官闕下不得預稱觴之列詩為是作故以斑衣青瑣之説終焉倡始于侍御周君伯明題則豫所共擬伯明以其首屬豫而分其餘諸君題雖異事而託以為翁壽一也故總明之曰壽筵列詠伯明又以諸君識先生晚或于其出處未詳焉而明遇嘗從豫遊短章寂寥未見其親于衆也請疏其所以揭之卷端嗟乎先生起賢科官禁從歷事賢王居贊翊之地子孫滿前而鳳林遺羽又有如明遇者聨飛繼美又未可量焉非厚德何以致此詩之頌先生者九而惜之者一不知其一正先生所以貽後人而有今日也先生聞之其將囅然而一笑乎東江家藏集卷十九
