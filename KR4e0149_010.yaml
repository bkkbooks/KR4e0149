body:
  text: 東江家藏集卷十中集六明顧清撰北遊稿詩一百三十四首送史景賢同知考績甲子二月君侯北州英淳直自天豫青雲二十載安駕何容與朅來東吳郡已復三刈黍龐統足方展休徴名日舉于焉朝天行萬里看鳯翥堯門開九重舜目周萬宇才良合髙位疲瘵念慈父舟行望不盡目斷斜陽渚月桂秋香送劉生還宜春應舉月桂生月宫一月一開落逢秋氣彌盛芬馥遍寥廓世人望影空裴􅏆劉郎自是神仙才兄弟相携月中去正值秋風花爛開嫦娥玉手親折贈雙枝香滿黃金臺姚平夫挽詩完節非今日清心自昔年由來孤竹操不逐豔陽遷旅殯煩僚友歸裝富簡編尚餘潛德在合並魯男傳故友人胡以祥為豫言先生弱冠寓郡城有夜奔之者正色諭之曰汝夫出而為此吾家故有妻庸可爾其人慙而去自此改節先生在江西憲幕以清謹為諸公所重及卒皆悼以詩二泉邵公為之志極其稱許蓋其源本有自來矣而以祥之言人或未之知也因表而出之華聽竹挽詩好在延祥竹秋風日日情幽人不復到虛節為誰清幹蠱名無愧貽謀事有成鄉邦聽輿論合附孝門銘次韻王用常下第寫懷漫説龍蟠與蠖伸亨衢何遽不為迍才如賈誼寧終斥美若陳平豈慣貧岐路只於忙裏錯頭顱須識本來真眼前掬水翻荷地一笑相看剩幾人掬水翻荷少同學時事也近為兒姪輩屈澄夫先生於小園東曙有詩次韻二首久知礬弟憶梅兄又見新篇月露呈虛館可能留國士舊遊端喜襲香名騷壇此日初申令棋社何人敢訂盟澄夫棋品甚髙儘有殘膏被來裔未應飄泊歎浮生澄夫和章有此意安車久不到岩阿水部無人復姓何秋浦白雲天際逺夕陽紅樹屋邊多筆精又展郇公帖才鈍愁聞郢客歌眼底桐枝未盈把幾時親見十尋過初至藝軒宅夜坐聨句良夜城南舊草堂十年重繼此燈光東曙文章翰苑聲華重懶散林泉鬢髮蒼澄夫庭樹看於前日大酒杯偏向故人長清出門翹首梅花月又見天心轉一陽東曙次髙進之韻讀書思力行挾策幾凝想紛紛事酬對顧影數離像譬彼旱歲橰久矣困俯仰知言何敢云有愧鍾期賞數日不過東園澄夫先生有月桂詩見示且歸功於封殖之厚次韻奉答時臘月朔也看花久不到墻東不道寒叢也自紅培殖可能符善頌故應嘉氣與君同子南兄弟聨取科名此豫所素期而果不繆者計偕北上酌酒賦詩皆平居遊處言語精神之實不復以文而故人情厚者當自慨然也短屋疏簾野水邊幾宵燈火共周旋聨飛本擬看三鳯寄子明書云云吉夢先教協兩犍嘗夢子南子儀衣襴乘牛並出承天門逺道風塵初旅食清朝簮冕是家傳臨岐不盡平生意山海當年有喻篇新蔡張孝子以乙丑嵗壽七十其子什二守松江松人為瀛海竒觀圖以贈為賦長句海山桃花千嵗紅海日下照珠玲瓏諸山卓立金芙蓉直上正值浮離宫飛霞紫氣流無窮縞衣孤騫背青空下視六合塵溟濛塵區逼隘鳥觸籠井蛙甕雞紛蠛蠓劃然翹首駭所逢欲往從之渺難蹤先生七十顔如童前身乃是浮休翁别來海波幾桑蓬舊遊歷歷宛目中七還九轉非吾功至行自與神明通丹臺峩峩銀闕重姓名已𨽻東皇公他年飇輪許相從還駕此鶴來江東孝子名某隨其子什二在官舍見家人市布疑其賤訪之得實什歸跪于庭數之曰汝居官如此吾不能食而食也明日遂束裝歸題蕭指揮便面雲海東南道路長海山雲樹共蒼蒼扁舟何日尋蕭史一望蓬萊入渺茫望雲思親圖白雲飛空往復還行人道上坐長歎親庭偶與雲路值雲飛寧與人相關梁公去來幾千載撫卷為君增歎慨天涯望雲傷客心膝前一刻千黃金往在京師趙君希德有南遊之約四月草五風雨中忽相見於東樓留兩月别去將由金陵視其姪錦衣君而歸賦此為贈極目燕雲望海鴻江樓一笑雨兼風行邊戲語三年約夢裏清歡兩月同歸棹細穿汀草緑别尊新剝水菱紅京華南北多親舊為説音書近懶通杏東為覔董仙家春山滿杏花朝陽三畝地返照一林霞厚德初鄉里幽棲幾嵗華長生容我問應不在丹砂松岩孤松何亭亭孤生岩之阿俯視千仞溪仰瞻鬱嵳峩嵳峩不可攀勞心其如何空谷無餘音伐檀有遺歌惟應負苓子千載重來過傍鷗亭江南水鄉多白鷗水神封作煙波侯主人作亭江水上却傍鷗鳥為鄰州鷗飛有時渡江去小亭終日臨江住亭兮傍鷗鷗傍亭君其問諸忘機生同年宋良佐巡按得代以書留别賦此寄贈黃葉柴門憶駐鞍瓜期屈指又秋殘玉尊不及沙頭餞明月長留海上寒十載青雲逐後塵冰霜此日見陽春書生别有迂談在擬託陽關贈故人百年天下是金甌根柢東南此四州同日震驚非小異九月十三日使君何以慰宸憂畝稅丁庸自祖宗巧名新意日重重歸班第一章封奏民力東南久已窮祇服竒裝巧日增百金財可一縑成葦簾布緣黃絁被時為封章逹聖明上供細布紅者百餘兩黃紫亦八十兩以下聖人初政日方升獨立臺端仗老成一道歌謡聽不盡須知四海望升平里生楊和為令尹張侯寫百禽從鳯圖雲間一峯名鳯凰峯形宛類鳯飛翔鳯飛百鳥爭趨蹌林巒澗谷皆文章德輝一閟幾千霜空有遺迹留青蒼賢明令君起番易胸襟五色雲錦香尚書雙履出尚方雲飛飄然來帝鄉和風甘雨相扶將物無疵癘年榖穰疲癃鼓舞歌循良有如鳯凰集髙岡百禽從之鳴鏘鏘乃知往迹未為祥楊生妙手邊與王景昭若水生綃數幅寫朝陽搶榆喧啾俯復昂菲紅閃翠雜丹黃九苞凝立和以莊鷹鸇梟鶻雕鶚鶬外若矯亢中已降雲中阿閣金榜長曉日照耀騰金光一飛下視堪輿方舊巢依然朱栱傍即都歸聖協宫商坐見四海登虞唐聖人南面垂衣裳一峯回首惟有春雲十里鬱鬱封甘棠送李原復僉憲嶺南君昔還家我為客客邸論詩坐連夕酒壺棋局間嘲詼眼底十年猶歷歷君今為客我留家南雲望望渺天涯鍾情已懷兒女戀回首况對江梅花梅花的的映空碧君到南中我應北南與北轉暌違梅花心事更誰知嵗寒冰雪金臺下猶可因風寄一枝味梅圖羊酪蓴羮各有宜崇桃積季漫多姿嵗寒一種真滋味只許龍山處士知丙寅春胡大聲自桐廬守參政湖藩過松話舊誦豫送通守殷君詩因用韻賦以識别人物西江第一流八年麾蓋滯東州新恩寵亞三湘鎮逺道爭迎五兩舟春宴喜聞京國語雲帆髙望渚宫收公餘為有江湖思還采蘋花寄舊遊曕雲圖昔年白雲飛親在髙堂思我歸今日白雲飛親在重泉空泪垂雲飛天邊無定所到處瞻雲泪如雨重泉冥冥閟長夜雲光不到泉臺下如令孝子勿思親應是青天斷却雲壽錢玉澗玉澗水清且深流不息窮古今山頭雨歇百谷聚白虹一道來沈沈澗傍老人眼雙碧手弄澗泉坐白石泉流到海幾清淺明年花甲從頭轉釀澗水作春醅采澗芹薦壽杯沐浴飲食無凶災此中自可度千嵗何必跨鶴遊蓬萊經鋤别業昔年劬學帶經鋤萬卷新開壠上居沈浸何妨問晴雨經綸聊復試災畬晚風簷隙垂秧馬殘月忩間落蠧魚莘野彭丘誰近逺詩成轉覺愛吾廬林塘曉霽海日初照天蒼涼逺村近村浮淺黃垂楊兩岸不見水中間一道開天光遊蜂薨薨髙下飛乳燕拂水翻烏衣老農携鋤放田水平陂簇簇秧針肥五月晦日同汪教授集傅教諭鼎顧東曙戚舜和劉文瑞俞民威遊黃耳祠歸用席間聨句韻却寄諸公紅桃夾竹記初來重到槐陰滿緑苔城郭幾畨風雨過山林依舊佛燈開莫論往事催霜鬢且續新吟逭酒杯壁間有詩譏二陸而民威勸客甚勤最可白雲知我意瞰窗臨水久徘徊琴泉泠泠石上泉衎衎松下琴泉流合琴奏為君寫清心天風岩際來舞亂長松陰舍琴面流泉風水有餘音悠然遂忘去華月上青林簡華峯教諭乞蓮栽園亭無竹使人俗池館無蓮也寂寥夢入鏡湖當六月接天青蓋擁紅橈行人秋早長安去中夏分蓮不太忙但有碧䇶傳别酒任他紅裏倚新粧郡齋三詠次金二守仲仁韻文筆峯興聖寺塔也髙壓重城郡圃東分明一筆倚青空雲蒸不作曇花雨神運遙生月殿風此日育王重錫號向來毛穎謝論功李藩未試南山判儻可提携入漢宫水簾空無海祲雜江氛一片湘簾映楚雲不捲幾年長裊裊平鋪終日自沄沄康王谷口珠千斛龍女機中線五紋更愛晚涼新月上玉鈎雙與畫簷分花幄亭下闌干曲曲通淺紅深紫鬭帡幪低迷似欲留歌扇縟麗深疑蠧女工濃漬一畨髙閣雨生香不斷畫簾風繩牀最愛清晨坐滿耳薨薨聽蜜翁郡博汪先生約觀蓮病目不及赴賦此奉謝兼簡邑博傅先生龍淵負苓二徵士濯纓亭下水如羅二十年前倚檻歌前教援魯先生種蓮亭下甚盛春服久荒沂上路荷花仍發鏡川波飛觴自笑成孤坐放棹誰能許再過見説華峯紅十丈有人携酒候煙蘿池蓮著一花用前韻報諸公約花開就賞即所乞於華峯者不知風葉展青羅愁斷南湖水調歌漢女有情先委佩洛妃無伴獨淩波峯頭玉井難為配畫裏金屏不啻過少故也已洗青尊酌芳露要看文斾倚雲蘿華峯蓮開用前韻見招奉答越女紅粧蓋緑羅薰風長憶扣舷歌却從五緯聨珠地蓮栽于泮池其外小池五環之術家謂之五星聚奎湧出雙峯湛玉波此日憑闌增慷慨當年挾册幾經過洄淵落木無窮意敢謂喬松擇女羅金仲仁母太孺人壽翟茀初乘自粉闈朱幡繼寵又蘭枝中州禮訓嫺觹珮南國鮮芳入鼎滋七十再逢添算日三千長記采桃時賔筵向晚笙歌沸猶恨嫦娥出海遲八月十八日生庭鶴再雛送劉太守參政陜西瑶臺雙白鶴飛來棲我庭棲我庭嵗一伏兩雛生一雛死兩悲鳴松陰宛轉巢復成巢成復引兩雛行丹砂猶隱頂白雪已垂翎成都未識趙公馬緱嶺那聞王子笙成都緱嶺知何處忽報主人留鶴去主人去去登岩廊鶴亦雙翎日夜長他年欲覔庭下迹千仞遙同威鳯翔拙隱時方貴巧辨我口訥如壺時方務馳騁我足攣如拘豈無當世心老此田園居方鑿不受枘直釣難為漁以兹甘靜退庶以全吾初分井藝黍稷引繩樹松梧蓄酒為賓燕明燈課兒書此外百無事悠然弄玄珠山水足清晏園林堪畫圖逍遙遂百嵗從人嗤守株頥浩辨公寄蓴菜瓜菹有别久不見渴心生塵之語因以為韻作絶句八首寄謝三年望東林幾日又當别盈盈谷水波一葦誰共折溪蓴牽紫絲念子良已久不在秋風前不在秋風後寒瓜削成菹入眼猶自緑借問長安兒此味還知不澤國有幽人城中稀復見曾觀論史書吾黨有靦面郡修志欲私有左右公極論其不可龍宫帶明湖倒影疑可掇何當酌清泠一洗塵中渴祗園數峯碧不易布地金誰續菱溪記為公傳此心寺有竒石郡守欲購以貽要人公執不許曰僧貧寺不貧也公欲空萬有誰哉記三生結習知未斷斯文獨鍾情長谷水千頃青天月一輪有塵飛不到何處却生塵臘月一日與文瑞訪定庵于北山别後奉寄平林回步草堂深二十年前此日心塵土自能迂俗駕雲山曾不礙幽尋孤標共指中流鎮髙詠猶聞正始音珍重寒江夜深别滿衣星彩動華簮從北山泛吳淞往蘇州夜泊千墩文瑞出陳司訓子進所藏吳小仙邯鄲圖索題窮冬逺遊空江夜話亦人間一夢也為書絶句風雨官舟蠟炬殘吳淞江上説邯鄲人間到處誰非夢只有盧生入畫看江中閣淺次金緩齋韻浦口停帆换小舟故人家近不須愁竹林隱約分岐路禾廩髙低見有秋路傍有叢竹蕭森可愛從此分道入先生家門內稻積參差僅通行徑千古心期嗟擊磬百年功業類藏鉤吳江一道看如帶可是先生志未休緩齋有三江水學新書題華文逺所藏五松圖湖頭看木翠團欒總合丹青畫裏看冠劔昻然五君子嵗寒長得倚闌干嘉興道中懷昨遊有作先寄文瑞仍約訪宗孝御史樓船徐度鼓逄逄憶别追遊俯碧窗幾日壺觴併殘嵗連宵風雨卧空江雲邊暗數青山九竹裏誰憐白鶴雙家有二鶴其一方病明日城東訪曹植錦袍嬴得醉春釭宿江上時文瑞常虞盜至故云怡庵先生致政歸喜而有作璧水江都繼有聲鄉人尤羡此歸榮九重雲裏恩袍爛三十年前弟子迎松菊喜歡依舊主溪山次第入間行夜來光節堂前月更比尋常一倍明丁卯北行定庵以詩贈次韻奉謝䇿名那復敢懷安却上離亭強笑歡三釡正憐蓬户暖九重深恐玉樓寒還聞奭旦陪周主屢報夔龍補舜官北極一星光日盛知公終夕倚雲看定庵用東坡過清虛堂韻重贈奉和江頭鳧鷖踏晴沙江岸黃蜂喧早衙行人倚棹不忍發紅旗罥落櫻桃花十年京華足鄉夢麻絰被體方還家沈悲結痛無與訴夜啼愧殺城頭鴉紬書有詔不得住部符趣修實録彤管中夜飛金葩憶君戀土腸萬結短髮幾對殘燈爬明晨復當拜公别何異渴吻思龍茶贈言珍重燦珠玉不知駑馬空鞭撾端明退居鄉俗美安石不起蒼生嗟祝公眉壽強飲食慎勿髙想淩青霞姚德夫晚翠詩共惜春紅好誰看晚翠深澗邊長鬱鬱霜後獨森森穠冶非吾事幽貞會此心山中有園綺垂白更相尋題陸承祖扇有後引放翁歸日鬢初星幾從琴尊上小亭芳草不知人已去春來依舊自青青葵誠陸先生罷登州還葺東園為遊適之所豫家食時陪杖屨數矣在京師夢遊園中作詩以弔寤而忘其前二句先生之子承祖送豫行因足成之書其扇以識别承祖其思繼先生之業哉丁卯二月十日松南書屋為章先生賦公瑾之孫吳松自昔詩書國得似君家亦未多緗帙牙籖數椽屋百年相繼住煙蘿中舍仙遊不可招依然舊隱傍江臯雲礽見説多才俊有日天風起鳯毛嬰醫王舜規有母服持榮壽堂卷索題書此以弔初日杲杲射北堂流輝弄影照明璫堂前蘭玉芬以芳青霞織帔鬢有霜含飴映日坐堂隍海桃實成花又發蓬萊水清塵汚襪啼烏聲乾山月闕東望銀臺路明滅天下同心淚成血别先塋松杉鬱鬱帶重岡榆柳陰陰繞曲塘曾有至人留寶讖敢期孫子濫朝章先祖嘗云宣德中有日者至先塋留記曰三十年後當出一讀書子食祿于朝汝生適應之宜勉學以成其讖人間日月三年速地下泉源百世長願竭癡頑了公事年年負土上玄堂孫文博雪溪卷溪流抱村自幽絶竒絶更著三冬雪玉沙銀浦爛不收瑶草琪花連夜發主人畫船携酒爐漁舠傍舷來賣魚借問五更朝路客何如貂袖擁冰鬚二月朔文瑞天民携酒為豫發程泊舟跨塘橋賦此蘭舟衝雨出江城别魯朝周兩緒縈黃柳萬家愁裏濕碧雲千里醉時橫更生好學時方蹇宋玉多才賦未成安得相携便同去五更聨馬聽雞鳴吳江夜泊寄長兒天彛八首飛蓋橋邊月漾沙順流東去即儂家若為得共舟人語轉過船頭向早霞髙堂雙鬢已如絲此日何堪更逺離寬我百憂惟汝在莫令思我在家時髙樓朝日啓簾櫳兩叔相望百步中我不在家渠即父莫令踈逺墜門風佳兒如玉眼如珠臨别牽衣淚滿裾愛惜護持勤教誨書香一脈正關渠鄉鄰自昔有賢愚小忿間言悉棄除惟有自修堪禦侮親賢戒暴逺讒夫家人小過莫輕笞渠在渠家亦是兒賞罰有條知痛癢自然親附不暌離門户晨昏慎啓關家庭內外切防間深更出飲清朝卧此是人家百弊端木有根株水有源祖先祠墓合親尊豈徒追報崇彛典亦要流傳教子孫楓橋與文瑞天民别兼簡鄉里諸公重洗紅螺捲翠簾闔閭城外雨毶毶青山舊識如東道畫楫相將類左驂旅食幾年仍薊北離懷千種又江南前途漸逺須分手更欲留連待酒酣渡江朝食大江南午泊大江北江流號天塹我行才只尺江路日以逺客舟何時轉美人青雲中望望愁嵗晚過揚州訪吳汝玉見其子某云葬踰年矣一慟賦此汝玉博學髙才尚氣不下物初教公安升南安通守未上卒君墓已宿草我猶思見君相望一江水真隔萬山雲直誼今誰似髙談可再聞阿咸才甚美應足振遺芬揚州水關作三過揚州十五年中間日月似流泉平山花竹隋宫柳又落東風一夢邊黃家閘閣淺寄吕梁劉水部天祺吕梁天下險我行今已三旱氣爍汴泗上源日以亷懸流飛沫不復舊但見兩涯亂石熊虎交巉巖水衡使者今劉彛人力到處天工回漕綱萬艘連夜發談笑對客仍尊罍官居花竹尢清絶别後夢魂猶髣佛北河連夕空繫舟悔不為君三日留君以前路無水留豫再三皮溝閘閣淺都水曹元孝郎中以書來迓自云困於沽頭走筆戲簡五日度兩閘得水如得珠蠖行不數里已復困泥塗升髙望留城人云其下尤淺忽得上沽魚謂言渴聚面奈此川路紆陽侯自云爾轍鮒當何如北河非西江綱粟有天厨附驥尚千里攀龍矧吾徒但恐洪流沛分手復趦趄硯瓦溝魯橋南畔拂塵衣仰止東山思欲飛前去宫墻應甚近硯溝新水墨花肥世恩國聲二郎中留飲南旺分司夜以小舟送抵北閘即事有賦嚴鼓聲中萬柝喧連檣影裏度歸船緣艫宛轉疑穿巷時漕舟重泊兩岸豫屈曲行其間天黑舷髙宛然深巷中也叢炬傳呼若耀蟬雲海幾人真契合騷壇五嵗此留連癸亥與二君别微吟更比拋磚陋滿握璠璵想嗣篇安山閘遣悶泊舟安山下愛此嘉樹陰登崖望河曲連檣矗如林有􅘗前致詞兹惟民蠧蟫徵丁動千計索雇贏百金郡小嵗仍儉誅求力難任稱貸倚富室羊羔日浸淫出白金一兩不數日取千錢情知剜心苦且免肌骨侵日午水滿閘棹夫兀如喑快船賂不足不行公私舟並為阻滯淹留已自困復此傷豫心青天如有知披雲露遙岑排空各獻秀為我清煩襟塵區自擾擾物外長愔愔安得向此中逍遙委朝簪安山待閘憩大柳下見蜣蜋轉丸及窟穴薶藏之狀甚悉村童語其故詞甚鄙而近於人事戲以韻語記之蜣蜋摶土丸其智竟莫測中包實糞穢外裹疑橡栗後推前復挽圜轉何捷疾端如趂嚴程又似衒巧術趨窪真一㵼過隘亦屢兀中途遇強暴奮鬬幾撑突其類有奪之者拒鬬甚力歸來不少暇坎土啓藏室既以首為畚復以股為橛爬沙兼負戴下上幾顛越室成擁丸下劣隘四無隙周旋巧斡運每動輒有入須臾丸盡隱謂爾功已畢潛身復旁搜坯壤時臲卼村童惡劇戲寸筳時一搰室開丸反流驚救走連蹶雙趨共撫抱有類拱珠礫前功已盡棄餘念猶未歇想其推挽去行復事鑽穴物生均有智小大理難一蠶絲利萬世蝥網為口實蜂房及蟻冢致用等軒闥爾丸獨何為久念理未徹村童前致詞此實神所訹轉丸輸鬼藏功滿蛻凡骨飛騰作風蟬清響噦雲月營營茍為此蜣計誠已劣丸也神所須得無穢明烈物性爾豈知神姦我能别紛紛詎為信瑣瑣焉足説聊戲答村童鼓響官舟發臨清候閘自辰踰未都水閉門而鎮守中人餞其同官于河下舟出清源萬馬奔斜陽艤棹自清晨主人謝客關河閉慙愧金璫貝帶人發臨清一日至鄭家口汶水欲盡衛水來兩水夾舟喧萬雷經旬守閘僮僕困千里順流心眼開長風飀飀若繩引曲岸宛宛疑天回月明倚棹鄭家口夢在谷亭呼酒杯谷亭閘住五日武城縣城三面臨水甚荒落而街衢綽楔相望孤城赤立倚官河隔水人家亦未多怪得連坊表科第宣尼曾此聽絃歌德州倉廳與陳深淵先生夜話有跋從來迂濶笑吾儒果是真儒亦未迂邂逅平原話新事一畨惆悵掩殘書山東撫臣以禁酒致人自盡事覺去官屬吏有除名謫戍者知府趙廷實等前代官自賣酒故有私禁今無此令蓋已收其稅聽民自便矣無官釀而禁私酤是絶物也而限以必行難矣撫臣朱姓時所謂道學者楊青驛懷原復僉憲先寄原魯千里漳河欲盡頭美人曾此駐蘭舟癸亥春豫以憂南還原復北上圖南暫息雲中羽拱北重瞻海上樓眉宇幾時消鄙吝江湖到處長離憂皇華會有嵩呼事先遣雙魚報早秋直沽即事漳水東流接海天尋常魚蟹不論錢橫空一網如雲密玉食還曾到御前讀魏武則天事用石樓太史韻亂來天意長姦雄一語深投月旦公豈謂三袁盡河北更教諸葛起隆中煙消赤壁沉雄俊樹冷西陵怨女童不及人狼祖餘知化牛猶得占江東阿師留髮拜昭儀絳縷初封不記誰海內漸看歸聖母榻前空自屬佳兒天徵鳥夢垂雙翼鬼作人妖有四眉早與文皇作男子乾坤更是一畨竒記夢中句有跋張生長安居日聽車音響他年乘斑輪車音想非想六月十二日夢涯翁草書此絶見惠是夕三兒夢逐熊得之明日九兒生因名夢熊謂當有成而卒夭死考試應天泊龍江和宫諭傅先生韻山川依舊畫圖開客况多應晚色催孤月近人隨浪湧落霞如鶩度江來清遊幸不疏連璧盛事還聞頌有萊却傍紫垣占寶氣直從牛斗貫三台銅鼓行樓船行銅鼓鳴和以橫笛間丁寧空江深夜天宇澄稀聲要眇雜鏗吰隱如仙樂度青冥貴人中坐憺無營流星捷報前幾程徵丁索饋百里驚兒童喜聞銅鼓音不知銅鼓傷豫心毬杖行擊毬本戎戲毬杖取南中雲帆下河曲專使董成功此物本輕細連艘竟何庸春秋富當寧典學希商宗蕩心聖有戒傳聞豈雷同舟行不可問為爾心忡忡十月朔還至通州雨三日不止雨滴篷忩浪打舷聽風聽水不成眠家人相憶心千里肯信連宵潞渚邊得家書報長孫應陽入小學孫兒生質頗清明只在收心養性成看罷平安二更盡耳邊如聽讀書聲戊辰子南下第歸為書其扇橫雲山前小赤壁長記扁舟晚泊來生族祖北山參政居山前畫景偶似山風吹人難久住明年候子黃金臺憶家園有序端午日雨忩獨坐顧前庭草木蔥蒨悵然有鄉國之懷因追記家園卉木花果各賦一詩其間或故有而今亡或昔無而今有栽培位置歷歷在目前魚積薪之歎廢興存歿之感略於此具焉存之使後人觀之無忘其初云爾石榴丙申二月移自祖居比他花最先植初止一本今數十幹矣三十年前手自移眼看一本作千枝翠翹紅萼東墻下幾為貧交入夢思五柳丁酉嵗植於屋束水濵今三十二年矣蒼然五樹積煙霞數里遙看是我家後進只今千百輩草堂誰識舊生涯海棠在石榴之東辛亥死於水嘗為賦詩潮紅香頰翠襟披流落頻傷未遇時草載斷魂招不得繫情多賦八篇詩梅在榴與海棠之間著花數年嘗有詩今榴在而梅亡久矣海棠西畔石榴東的的寒花映晚空舊迹漸淪忘不得蒼苔翻恨落英紅柿核種數年成陰著子矣暴風折其頂後厄於水遂枯忩西一陳緑雲濃眼見萌芽到拂空成實不教霜後薦只因多雨更多風此月十七二兒天敘亡日也杏甲子春得張氏園園中雜花頗多此其一也花時逺望若錦山實大而美紅杏初開錦作山别來花實漸闌珊春風似為人離别還是春風不斷間牡丹其一張氏故物其一新栽初僅數朵次年漸盛丁卯凡四十餘三月東園花壓闌種花人去我來看不須爛漫開千朵惜取芳根伴嵗寒紫荆二本皆張氏物百幹相扶共一根紛紛紅蟻綴枝繁春風不用歌行葦但遣封培付子孫銀杏初為盆景成化壬辰中使取花石張氏㒒移栽草叢中得免今在園東南垣外髙數仞矣鴨腳當年自一時瓦盆雕砌影毰毸黃封不遇頭綱使爭得淩雲百尺姿櫻桃舊有二株並子南所遺凡六本豫行時花爛然花發園亭記别離憶花又過别離時赤瑛盤上筠籠裏各自傷心各自知蒲萄張氏故物京師寓舍亦有之晚涼坐對忽不知南北之遼逺也髙架新梢緑刺簷坐來幽意滿江南不知華月清池上誰共涼陰酌晚酣李余山移栽山崦移來玉一叢竹林深映小桃紅别來消息知何似依舊無言對曉風竹蔡廷章宋天民分種乙丑二月也嵗中發筍二年而成林畚土薶根旋作畦數竿蕭瑟映疏籬緑雲涼月西窗晚尋我林間舊刻詩芙蓉姚直夫分種兩叢髙下映波紅疏柳池邊落照中無限江南搖落意燕山幾日又西風緑蕚梅得之張景徹當年著子不將幢節駐羊家幾伴西樓坐月斜零落瑶華應不恨緑陰青子在忩紗緋桃張氏故物穠烈如火園中春時絶景也後蠧而折今所有乃重發者一株穠烈破春寒曾是劉郎刮眼看今日前身誰復記赤霞空煉九還丹盆松俞民威所致園客請加蟠結豫不許將植之東園以極其勢神龍不畜蹄涔水威鳯寧棲枳棘叢試起槖駝論種樹此公何得在盆中芭蕉靈苗體性本清虛風葉猶堪醉裏書危石幽闌畫樓畔撩人歸思半因渠黃楊古云遇閏減寸實不然但極難長耳丁卯此木新芽幾二寸乃知誤事不獨禹錫嘉話也人言閏月厄黃楊此語分明太激昻得與婆娑同晚嵗任他蕭艾過人長紫薇陸承祖家物平原宅裏看移根百日髙花不負恩綸閣西頭見新月分明清影近黃昏雙桂丁卯三月種是秋盛開吳國春深試手栽燕山秋晚報花開靈椿老大無材假奕葉芬芳為爾培蟠槐似欲淩空且屈蟠夾門雙影碧團團油幢不合書生建爭得薰風日倚闌柏屏屈葉回柯巧蔽虧畫簷三面碧參差琉璃隔坐非吾有冰雪相看正爾期蓮縣學泮池分種華頂虛傳十丈紅方塘只在小橋東天機雲錦應無賴爛漫西風夕照中蔬圃緑嫩青酣井字畦柳塘東畔竹林西阿兒暴富人應妬嵗晚平添百甕虀稻田樓前屋西皆是倚闌平立黃雲緑浪舉在目中儂家世業本耕農逺客思鄉却自儂柳外平疇夜來夢萬行新緑舞薰風卧病重雲積九夏永晝恆涔涔溽暑不可耐沈痾復見侵隱几西忩下悠然懷故林繁紅已結實穠緑正敷陰涼風振水竹忩闥有餘音欲往川陸阻居然勞我心病起將朝寄盧宗尹思君不可見我病君忽來相逢執手間未藥心已開刀圭入我口晴風掃陰霾病發不我會君來豈豫媒乃知平生交冥契神所該清秋肺氣蘇櫛髮臨花臺行當跨鞍出嗚佩朝蓬萊却尋廣成子一笑空同回作詩先報君此報非瑶瑰魯司成振之將乞終養夢公服秉笏乘青羊而馳及命下乃八月乙未十五日餞於宗易太史西園即席有贈夢裏青羊且信疑今朝南楚定歸期先生六館人師上聖代千秋孝理時朱橘正堪霜後薦錦衣行見膝前嬉三公一日誰輕重莫問重來鬢有絲送劉公勳太學兼簡尊翁聘君文儀進士海門寒月三江水天闕晴雲五鳯樓别路此時頻目極兩鄉千里各神遊詩書不斷通家好尊酒難澆壯士憂往見周郎話相憶北風歸思滿滄洲題公勳水仙扇面到家花正發别路夢先知月落西湖上何人共賦詩十一月望月食既歷戌亥子三時乃復日食又月食兩年三見之丁卯正月朔日食十月望月食天心果仁愛吾道合清夷悵望雲間路蒼茫夜半時懷君復思土愁亂不成詩東江家藏集卷十
