body:
  text: 東江家藏集卷十五中集十一明顧清撰北游稿詩六十首庚辰正月過海子橋望西山晴雪爛然湖橋栁色已津津回首西山潑爛銀天意自知寒不久併將竒麗作新春敬亭見和山行有李杜齊能之句雖主押韻而亦非所當也因歌奉答拜寫近懷梧檟不雜中林蒸詩人以來稱杜陵公才本髙心獨下退與元白圖中興山行一篇如見我捫蘿踏雪幾凜兢時從雅淡出竒麗少年斂手不得矜三陽改歲萬物泰和氣上與游雲凝清河沙河栁色動近山已有游人登南飛六驥想回首足底不見隂山冰甘泉荷槖事已逺洛橋軔車材弗勝破除寂寞賴公等往往郵筒侵夜燈朝來雪篇更雄富無復珠貝論升朋五湖煙艇未許上灞橋驢子還堪乘已聞羔韭畢春祀佇見柴燎中天升平安夜火報不絶似有車騎來增增蘭臺執簡公未老長楊奏賦吾猶能掃妖滅怪止一筆取青嫓白應千層眼前却有兩物惱中山狡兔剡溪藤春雪敬亭用前韻再答西山落日雲蒸蒸漫衍澗谷彌岡陵曉窗夢破聞掃雪失喜一笑披衣興天街大有隔歲伴羸馬前日猶凌兢常言三白兆豐稔民病亟矣天須矜從風初學栁絮舞綴樹旋作梅花凝素娥晨朝紛下女玉龍夜戰迷先登瓦罏煙焰坐不暖起視膽瓶膠作冰前年冬溫人苦疾往歲雨多苗弗勝新春得此喜可說光景十倍鼇山燈忘懷一任鴻寄跡耐久正愛霜為朋淮西剡曲總佳話萬騎孰與扁舟乘愁來呼酒徑一醉斟酌不計斗與升長安薪炭已如玉又報米價江南增是日有鄉人至開門髙臥吾豈敢手挽溝壑嗟無能登樓望山一舒嘯銀屏玉案髙崚層何當致我此中去看煮雪茗燒枯藤十二日㑹東亭三江舉杜韻各賦瞢騰十日春光裏又到東亭把酒時餘寒勒雨强作雪東風蕩栁欲成絲是日大雪而不寒氣序暄凉催旦暮路岐南北有歡悲尊前且莫思閒事滿眼鶯花總要詩生日三江石潭攜酒見過且以詩補夀六十次韻為謝生辰何幸偶羣龍一笑吾翁若亦翁為涉歲年知冷暖懶從蓍歷問窮通能詩未許澄江朓愛客何妨北海融看取向來歌舞地玉梅零亂綵雲空前十日收諸權幸家歌兒舞女載道丹砂未就鼎中龍黃歷頻催鏡裏翁韋曲園林三月夢蓬山舟楫幾年通燈花入夜偏能喜鬢雪逢春可得融為問此時公不醉百壺留取待誰空鄉年友程御史良用子然隨計來見喜君之有後而惜其年之不永也詩以弔之相逢問訊一悲凉回首江雲宰木長千古交期只文字百年心事有冰霜身因許國終羇旅君歿於浙東行臺天以餘忠付兩郎髙臥九原無復恨此生曽不愧冠裳送甌濱謁陵用三江韻時方南征奉禮晨趨左掖朝鳴鑾回首屬車遙神靈灞滻瞻如在氛祲江淮坐已消迎燕暖風初應律壓塵輕雨不崇朝光明更有西陵月偏照宗臣奠桂椒夀韓司徒貫道洪洞老仙初八十曽見垂紳立大廷風雲一變嗟人世林壑三秋即幔亭黃髮正宜松菊伴紫霄相續鳳凰翎公諸子皆在仕途欲知後進瞻依切長傍弧南候景星四月十三日同時敏送仲玉景和歸途有感作漠漠輕雲淡淡風御溝溶漾落花紅一畨離别中年後千里河山夕照中垂角故人霜兩鬢時敏景和皆童稚交今皆老矣關心岐路草連空歸來稚子迎門笑何日親交送阿翁時求歸未得酒熟招時敏及諸貢士飲用其韻青杏林間臘酒開緑蘋江外故人來客身無病心無事有約相過不用催定菴夀詩明年詩社合更年八十九回秋月圓紅燭猶能映緗卷烏紗曽不愧青天三更海鶴通仙夢公去年夢人抱一鶴貽之明日豫寄詩適至八曲鱸魚上錦筵獨拜尊前知有日客星今列五湖偏已得冊封差待駕回發命故云走筆和時敏客中寫懷擾擾蚊虻倦撲緣欲將朝槿待椿年清江白石風塵外鳳閣龍樓日月邊騕裊名駒爭駿捷修羅天女漫雄妍落花芳草天涯遍回首千門一悵然出郊小隊黃衫簇絳燈春來幾度出郊行桃花結子楊花盡只有䕷蕪滿路生五月朔大雨新霽瑤空湛然西山翠色可挹雷雨千峰過乾坤萬里清天街一回望無限古今情和時敏病中寫懷端午日作紅芳滿地緑隂殘風雨中宵送曉寒有客靜邊時得句幾人忙裏欲辭官且斟內苑菖蒲緑休憶炎州荔子丹君先任閩中看得此身同逆旅不妨隨處託交歡明日看牲回作塵沙不動午風輕時頻日大風閶闔西垣小隊行白日正當龍尾道青山故繞鳳凰城舊看牲夕往宵還虞郊玉帛羣靈格漢帝旌旗四海平安得升中告成事萬人歌舞入瑤京席仁同黎一卿許伯誠三御史出巡與之酌别新雨長安不動塵聮翩驛騎向江雲更生舊業留天祿三君皆以庶吉士除桓典清風肅惠文鏡裏秋毫知歷歷壁間幽蠧漫紛紛還朝别有嘉猷獻四牡皇華是昔聞綸褒晉錫卷賦者甚盛劉紫巖學士序之要豫同作文武聲名簡帝衷璽書頻歲䇿戎功不留片壘風塵際衛兵邊帥皆南征北伐逺塞亦異事也盡屈羣猷指掌中事皆專斷同列仰成而已壯士偃戈眠細栁詞人操翰擬彤弓南征别有殊恩在早晚鑾輿入漢宮和伯明大理舟中見寄時考滿南還岐路長亭復短亭斜陽望盡草猶青忽驚錦字雲中下如見蘭舟栁外停西省綵衣人似玉乃子于岐在刑部北堂眉夀鬢初星鄰盟定許重來續夢裏時時接鳳翎時敏將赴宜春以詩留别次韻為贈南北舟車日往還朝簪無奈鏡中斑一杯復此送君去三徑何年共我閒長谷煙波增悵望仰山雲木待躋攀春風坐裏從容地不似韓公始抗顔時敏嘗教長沙建陽改今任王子儀將赴南京中府都事與乃兄子貞中舍來别賦此兼簡成國朱公少傅優游緑野春郎君連步上青雲螭坳簪筆瞻天近戎幕依蓮惜鴈分慶歷朝廷方偃武琅琊子弟並能文中軍况有詩書帥橫槊風流未足云楊從龍鄭采東二給事鉤考邊儲臨别有贈計省憂時紆廟略夕郎承詔出邊城八州分野占星氣一路風雲擁使旌經國理財當世務登車攬轡古人情微吟不盡臨岐贈佇想嘉猷答聖明送倪郎中本端守南雄越江才子南宮彥二十年來又作州正德初京官不用餘姚人君以庶吉士出知太倉州畫㦸去衝梅嶺雪青藜還夢玉堂秋邦人喜得文章守蠻客應無匭篚憂心識晚成須逺到不勝離思繞滄洲八月六日㑹燕新守孔君時久雨忽霽喜而有述經旬苦雨隔宵晴童子張筵有笑聲渤海正須龔遂去德星今傍五茸明銀缸照席花頻剪采玉飛觴令始行留取甘棠他日賦一杯先與慶西成松江比歲不登數日來聞秋田甚盛有懷味苓賦詩未就閏八月草三夜夢與誦之有所更定而不甚明了寤而足成西亭橋下路逶迤中有幽人雙鬢絲長年讀易懶出戶逢人把酒亦吟詩山田十畝自云足車蓋滿城渾不知何當便了閒居賦為說推敲夢裏時夀石為楊閣老賦左掖連蓬島南山直上林具瞻隆一代夀域啓來今參井垂光厚岷峨結秀深精英應霄漢呼吸有晴隂紫閣淩遙跂丹梯極峻臨為雲霈膏潤作柱定﨑􅋂夕霧濡文豹朝陽集瑞禽芝蘭春掩映松柏晚蕭森入晝星分彩登歌玉振音朋來嵩華並禮絶省臺欽不轉惟恆性長存是古心永宜邦國殿未受雪霜侵功業岐陽鼓文章泗水金終期薦韶軫一奏午風吟為前人賦存耕邠風無逸兩青箱幾葉留傳到此堂祖號心耕父留耕人在江湖夢霖雨心將稼穡比羮牆三峰秀石宜髙廩九月黃花映晚香擬祝遐齡自公有新圖留取記時康送汪德聲御史按閩中無諸舊國考亭鄉柱史乘軺代省方三山雲物歸攬結八州風紀待恢張掃除蕪翳要霜雪濡喣槁瘁宜春陽公餘别有天下喜兩袖清風朝北堂有感了知非是不能忘六十年來夢幾場掩却殘書坐深夜一燈依舊短檠光厚齊閣老夀詩凱旋後作瀛洲仙步接黃扉兼總鈞衡贊化機名德共推今日重夀齡無愧古人稀朋尊欲趂梅邊舉櫜鞬新經海上歸一曲南山和常武餘音遙傍五雲飛敬亭和賞菊聮句至十月未已次韻奉謔且為芍藥尋盟二首開緘奕奕見風神百過賡酬意轉新栗里黃花偏耐晚謝庭紅藥已含春追攀未覺亭臺敻題品時應翰墨親指屈東風寧幾日只愁無地著吟身間梅依竹幾叢叢曽伴淵明醉屋東秀質自然天力與芳香不逐歲華窮琴尊勝㑹留清賞旗鼓騷壇合順風走遍鳳城車馬地幾人髙興與公同淑人大祥奠柩前用乙亥韻忽忽流光又此辰此中何意復經春君應地下憐諸幼頻年有嬰孺之戚我合愁中過六旬五鼎不消明鏡恨一燈翻憶布衣貧東風得與同歸便自斸青松䕃兩墳同穴之約戲和石潭嘗酒有引茅柴陳卷擬立案矣而催札不已聊爾破白亦欲為糟牀吐氣星運表祥而七步三緘之說皆不可不復也不惜糟牀劈作柴已呼兒子旋安排只愁新瓮能幾榼遂有髙軒駐兩階永夜燭光鄰壁駭他年談苑幾人偕細君不學劉伶婦晚出雙魚更自佳石潭釀秫八斗而壓敗豫家酒牀無遺力矣雙魚紀實亦趂韻也城西門掩夕陽柴剝啄尋常不用排况是新篘方滿屋何妨曳履日登階愁來白髮欺簪短老去黃花有竹偕既醉莫嫌詩晚就行年不似丙丁佳來詩謂酒好由於運好而豫以詩好亦由之丙寅丁卯君將來運也無問登龍與叩柴酒魔詩祟要人排不衝京兆行春馬便踏先生繫馬階桂屑搗殘猶自辣雪兒歌後許誰偕君近納寵逃虛避俗吾何敢正若君言也復佳三江詩約嘗酒次韻落落晨星榜下人芬芬麴米帝京春從教徐邈論賢聖自識陳登有主賓霜菊未消金蝶粉畫松如舞玉龍鱗紀實語留連要看先生醉醉草淋漓逼晉真三江醉乃作詩至草書則大醉矣竹亭清節為胡大聲司寇賦問君竹亭何處所言在龍山之陽荆江之滸君分務荆州始作此于公署江水渺渺山青青水邊種竹中作亭山風時來奏竽籟江月下照凝霜冰當時作亭亦漫爾人誦公清名日起皇孫題榜鬱嵳峩亭扁荆邸書清風幾處表行窩武夷山前溪水碧越王城上海雲多秋臺月冷霜華重心繞南雲不成夢起來揮翰走新圖要我題詩作清閧竹亭竹亭今若何自公來後幾人過鴻爪雪泥增悵望石闌苔徑想婆娑君不見召南茇舍終煙草惟有甘棠一曲千古被絃歌春圃為醫士范鳳賦爾家文正窮居日願為良醫惜不得天章一日面重瞳四海春風歌慶厯善救不遺天地功一圃雖小春風同圃也有窮春不窮往為爾祖閎家風頒厯後謁陵過清河望僧廬有懷蔡東軒郡尉曽同襆被宿招提行役匆匆未有詩歲月幾新官厯樣人家依舊小茅茨成仙合自蕭郎分撫景偏多宋玉悲行過石橋猶駐馬此情應與故人知涼水河東望亂山深處小崢嶸匹馬曽經月下行古戍風煙通曲巷野人籬落帶寒坰百年幾處頻遺跡他日何人此問名回首夕陽晴更好碧煙橫帶永安城戊寅送梓宮夜半傳發循小山北行先入陵﨑嶇逼仄皆平日未嘗到處蓋行殿臨河故紆曲以避之也飲酒三首憂來無端際雨雪仍霧昏家人饋我食有酒忽盈尊午食未嘗飲酒是日偶有之此物本非惡此時情更欣一舉不計觴頽然成暝醺生材古云難長養良亦勤夭夭中林植幾時到干雲一朝困野火誰念空我園棄置莫與置沈思空煩寃已矣當告誰悲哉無復論烈火玉不變衝波山不遷人生亦何易俯首就拘攣昔稱朝陽鳳今為腐鼠鳶所喪知幾何所希尚茫然愁來不能飲舉觴酹蒼天王業思傳後蒸黎固無愆願生豈弟人為時長才賢生世苦不永逺期惟百齡勢位亦奚須要以吾志行志意茍不立區區復誰營蠖屈禮輿皂熊蹲視冠纓陪側有傔從方間有靈明氓也各有心此理豫所懵問之諒未可酒到且復傾辛巳元日和未齊立春有感餘寒弩力盡千鈞晴日簫聲已弄春即有落英粘舞袖未須啼鳥勸游人江東父老談張翰谷口風煙望子真試向叉梁看綵勝一畨攢剪一畨新恩封豸繡為盧師邵父恆齊夀神羊一角駿且靈心識枉直知姦貞因之遂有觸邪名楚人作冠秦漢仍至今臺府表儀刑盧郎鐵面飛霜冰儼然象服當明廷豺狼屏息虎遁形彼狐鼠者敢咿嚶帝曰汝賢誰爾成往貽爾親豫爾榮匪豫之榮繄爾情鸞書入山猿鶴驚林芳谷秀紛來迎吳絲緻密綵縷精五雲灼爍千花明新年七十鬢未星夜燈密字還如蠅泮宮吹笙歌鹿鳴石湖梅花連洞庭行來無礙出入輕肩輿扁舟惟所勝郎君出使擁文旌吳船萬里上青城朋尊獻夀舞前楹庭前堂上總歡聲他年犀玉麟袍頳還想豸角髙崢嶸生辰飲酒用吳與賢韻時有所感走筆亂書不計其無倫次也青燈照案猶前夕病眼看朱頓成碧風塵浩蕩愁如海如此年華尚為客今日何日心神開喜有新詩佐歡伯吟君瑤篇酌我大白陳王藻思過八斗劉伶酒腸僅一石長途漫漫竟何止直恐蝸殼黏髙壁瑤臺何許空悵望黃竹白雲同一拍尋思百歲等石火秪有塵編耐紬繹長安春深冰雪盡和氣如雲盎阡陌樓卿飽飫五侯鯖賈傅尚虛宣室席人情自昔無終盡天道由來有損益彭鏗至老無千歲趙璧雖竒不盈尺但得四海同仁夀爛醉康衢歌帝澤淑人遷柩至祖送還書感八首日日青山勸我歸明朝為爾定歸期宵殘展轉不成寐却悔當年下釣磯尋常白髮憐豫老今日青山獨爾歸腸斷不堪臨别處還將好語慰孤兒此路同君兩度歸歸時長是淚沾衣癸亥己巳皆以喪歸如今不减當時淚濕盡麻衣君不知路轉河橋客欲辭黯然東望一沾衣來時記得停輿處茅屋垂楊映酒旗癸酉入京至深溝僕抱幼子錦郎及雲孫于路左淑人暫憩村家顧之悽然有不知何日同歸之歡既至而錦亡淑人竟及此故尤不能為情云三十年前二十時小窗燈火對鞶絲如今此意從誰語頭白傷心只自知長安初到憶搬家幼女嬌兒共一車死别生離三十載老懷爭遣不成麻京華桂玉兩關心粗得心閒病已侵伴我一生成底事誥鸞空印紫泥深長途極目四千里往事傷心五十年淑人歸我以成化乙未正到不禁凄斷處一聲哀鴈過樓前清明日遣三兒奠李文正公墓時上疏乞歸未報三年不拜先生墓一滴尤傷此日心古道曲村猶厯厯舊松新檜想森森周旋未敢遺言墜閲厯空嗟往跡深願乞明靈表衷素早教藜葛返初林齊居日暮浮雲盡瑤空湛虛明北辰儼中居列宿環四營攙搶既不動彗孛亦潛精朗月行中街垂輝徹洞冥感此念疇昔忽如初夢醒泠然遂忘寐整冠候雞鳴層軒䕃嘉樹素月流青空珠光激翠羽綺麗難為容起步下中庭徘徊西復東童子訝我然竊語窺忩櫳焦枯望霖雨隆藴思泠風倏魚濠梁上豈識蒙莊翁駕至保定志喜星流百騎擁前茅傳說君王到渭橋靈雨隔宵清輦路好風和日揚鸞翹謳歌久屬三靈擬冠劒行趨五夜朝願祝羣公同一德共扶堯日麗層霄東江家藏集卷十五中集
