body:
  text: 東江家藏集卷十四中集十明顧清撰北游稿詩一百首丁丑元旦雜書百里宿舂糧千里三月裹三飱適蒼莽既返腹猶果雲鵬快九萬斥鷃搶榆可𤣥間函萬類厖巨雜纖瑣王公與輿皂意適無爾我季孫周公富參也肘雙裸當其商聲歌萬物等瓜蓏飛鼯笑鳩拙蚿亦憐鱉跛鶴長斷斯悲鳬短續詎妥為謝守株翁君計良未左東曙寄答去歲生辰和韻之作若不以豫言為然者再疊奉酬一年歸計又成賖却望春城感物華海鴈忽來雲外信江梅應發檻前花人將勳業期安石我自風流憶孟嘉終擬一笻尋老伴商量晴雨問桑麻次韻用常有懷見寄兼送三兒失舉還京因以自歎之作二首茅屋藜燈對雨然小橋西畔竹籬邊天涯莫道渾忘却久矣西齊一榻懸休從場屋論功名晚達何須讓早成八十前頭看梁皓白袍元是一書生李谷泉七十虛皇臺殿五雲邊有客閒居七十年仙籍遡源來苦縣家山回首是琴川神驂野鶴時過海手植簷松欲造天昨夜瑤壇霜月下焚香猶誦蕊珠篇甲戌郊祀齊居落齒有作正月十二日再落一齒用前韻亦齊居也癡人老猶童覽鏡思妍媚摘白整冠巾謂老真可諱不知齒牙脫還復可留滯憶昨爾初生玉白銛鋒利相從能幾何竟作鉛刀廢得非本根撥無乃言語纍初危冀猶安凜凜憂爾墜及兹兩決絶忽若還重寄投非東窗梭去作下坂驥從兹慎語笑至理得深契二月草日貢院中作今日不樂是何辰千花萬花明上春洞庭明月湘江水望望風帆思故人豫三入禮闈𢎞治丙辰己未充同考是歲濫竽考試陸希哲下第注臨江推官與之酌别婉孌峰頭片玉明餘光千古落東城才名泮水誇年少宦業雲衢屬老成五色共知經眼誤一尊還許對花傾向來萬事皆蕉鹿聽取西江訟理聲先師友蘭張先生祠堂落成其子公佩來告將别賦此祠在斜涇之陽超果寺之西南廡即舊之學舍今主僧道俊所作也蕭寺同游五十年京華一笑兩茫然流光如此可復幾朋輩到今誰更賢舊業齊房聞再整新祠蘋藻亦粗涓臨岐不盡追攀意總在斜灣落照邊送周成德知養利州壬子同年古嵩山下一城安井落參差畫裏看黎庶幾年占得歲朱幡此日快憑闌才名豈必慙諸子忠信由來重百蠻合浦明珠連穴乳大書行見石崖刋中元謁陵三江以詩送次韻留别時連雨初霽逗晚鄰鐘忽報晴已拚三日踏泥行攀髯空復隨鵷侶奏賦誰當擬墨卿紅日仰瞻三殿敻浮雲莫遣四山生奉辭却恐題詩誤把筆頻教候啓明郊行涉淖屢瀕危殆晚憩鮑監南齊用前韻久晴思雨雨思晴晴日依然是雨行屢涉泥塗愧輿皂敢誇軒蓋後公卿良苗近甸髙低滿王氣諸陵日夜生細聽白頭宮監語劫灰何必問昆明擬謁泰陵不果還宿僧房再用前韻斜日長林散晚晴羣公西上我東行空瞻洛汭歌神禹無復甘泉扈長卿石馬風煙悲古道玉衣絺繪儼平生愁眠更覺宵天永滴盡銅龍未肯明又絶句甘雨和風十九年羣生長養不知天丁未即阼至乙丑正十九年橋山厥有神靈衛莫問風沙與水泉題三江所藏呂紀畫鷹千峰無雲秋氣髙獨樹倚壑風蕭騷蘿蔦翳薈青黃交飛泉觸石迸山腰奔流十里怒未消絶壁仰視愁猿猱黑鷹孤鶱不受絛砉爾下集疑衝飇雉驚兔走鼪狐嘷老羆崛强倚窟巢呀喙睒目為矜驕兩雄自古忌相遭欲動不動心俱勞丹山有鳥文九苞梧棲竹食韻簫韶朝陽獨立萬羽朝吾欲良工運彩毫恰有十幅鵝溪綃洊溪宮諭省覲歸賦詩末就而别八月七日禮部南齊獨坐悵然有懷足成奉寄鐵笛風前早識君先生舉竒童時有鐵笛詩還從石室見多聞圭璋世與連城價鸞鳳天成五色文春酒玉尊催獻夀夜筵紅燭感離羣停雲又入西堂夢不道仙凡路已分芙蓉書舍為甌濱宗伯賦開元寺裏芙蓉樹曽見先生學易年好語盛傳三䇿後髙花獨出九秋前先生領薦之歲此花以五月盛開溪山賸有餘芳在霄漢應多别夢牽欲識舊題無恙否碧紗深護翠蛟纒先生善草聖故云定菴八十六歲詩橫塘髙宴復今年八十六回秋月圓霜柏轉深雲裏色醯雞空老瓮中天夢隨白鶴周三島坐想清風拂四筵平格自應天所眷夀昌端的為誰偏有懷約齊先生用前韻奉寄學海馳聲四十年歸來霜月幾回圓春暉寸草俱無恨先生以母老六十致仕軒冕山林共一天鄉論古今西洛社夀觴先後北山筵題詩轉益蓴鱸思久矣諸公樂事偏膳部主事林貞孚告歸為令祖泉山翁夀我初從仕來京國泉翁六旬頭尚黑明年翁夀八十五聞道康强只如昔蓬瀛嚴邃璧水清玉衡金鑰重兩京豈直文章師後進實有勳華流汗青海天諸山玉削成重崖疊嶂通仙靈髙雲可望不可即時見一鶴橫青冥西風八月鴈南翔孫子錦衣稱夀觴九重似有非熊夢還擁蒲輪朝上方胡仲申録囚過家索詩為尊翁七十七夀又是江鄉一度秋依然霽色滿江樓去歲夀詩曰海天秋霽緱仙幾約吹笙㑹漢使真成衣錦遊棊局酒杯滋有味黃花翠竹不關愁橫塘八曲傳詩例次第還應置兩郵莊舜舉自京學出教平原豫隨計時嘗止宿其地客途風景宛在目中懷昔感今斐然有作德州南下路茫茫猶記征車駐夕陽草載宦程霜鬢改九秋離思海雲長川原近帶齊封古芹藻遙分魯頖香梁桷歲寒顓有待未須回首問鱸香惟中太史出示先憲副所得東吳夏卿墨竹為題絶句太常寫竹時相向四君子竹二竿與兩君為四懸之白玉堂葉葉清風起松江判府史君瑭廉靖愛民民亦愛之董漕還便道省親賦以為夀洛川老人古耆英七十九年生太平室中孟光年稍長雲冠鶴袂長裙青斑衣五采雙鷺明五年從宦江南行王程有暇許歸覲千里周道迂雙旌江南之政惠以清民歌甘棠歌所生河陽板輿止偏侍亦有具慶無榮名洛川之樂無與京我作新詩遙寄聲願言百歲齊不老看取棠隂江外成伯疇宮諭登第豫同考春闈今年又得其子彥式魁省試伯疇可謂不亡而豫亦與有榮矣彥式告歸逆婦俯仰慨然賦此為贈兩入南宮二十年慣看鵬鶚上雲天一經不忝𤣥成後片玉還留大宋先彥式兄以諒未第瀛海木天虛夜直彩屏紅燭待春筵經綸事業今方始未學相如駟馬旋憶李文正公次崔世興符臺韻碧山投老始成遊總為昭陵土一抔片語不留身後計一生長抱域中憂人非金石誰千古世有神仙定十洲欲識姓名傳逺近遙天星斗大江流又見青山雪後童公前歲席間贈詩句也神游何處躡星虹無金可鑄春風象有筆難形化雨功洛社衣冠觴咏裏孔庭詩禮笑言中追尋不覺成今古猶對遺編望小同百川至海圖為太常楊典簿題座主冶齊先生之壻百川起西北浩浩東南馳東馳日夜不一息共指滄溟同所歸崑崙與蓬丘相望萬里何崔嵬泯然一氣交灌注餘波直浸扶桑枝扶桑曉日流虹光正照君家清平逸老之髙堂堂前嘉樹儼成行紅蘭紫蕙共芬芳十年京國勞夢寐一日海上塵襟凉翻思年少馳騁日却似川流初濫觴川流學海竟到海君意更比川流長百年才半未為老浮天浴日何可量勸君一巵祝君夀康蓬萊清淺我不見海籌十屋畢竟成荒唐但願清平老人百歲長無事與君終日擊壤歌康莊寄王世祿指揮君來袖裏有雙魚蔡衡仲編修有書君去匆匆不辦書憶别正當梅發候相逢長記鴈飛初淮隂功業人非逺郤克詩書味有餘雲路諸公盡青眼爭教甓社久遺珠君父某公讀書好文毛三江宗伯陳東沂司馬皆與之游次韻顧德章冬夜失雞望斷城南尺五天赤冠金距故昂然江鷗日落猶能舞塞馬風髙不受牽飛入五坊應賜錦夢回三市已登筵明年許我山中去爛煮黃肥醉謫仙葵軒為陳錦衣彥良賦有後引長安四月花滿城葵花獨自向陽傾赫曦當午輝四溟垂輝弄影照君庭庭下千花團繡楹紛如玉節間紅旌儀鸞退直花下行日華相蕩錦衣明日也有時經洞冥此花向日無隂晴秋風花謝子還成明年向日還層層我來看君花正榮徘徊軒砌有餘情作歌為爾傳嘉名君不見金張七葉空富貴惟有葵心一㸃可與金石垂千齡彥良雖官要近恂恂若書生逆瑾時逮捕大臣于江南同行者資貨狼藉而君獨蕭然大臣後得白君適卧病以百金助藥餌不受士以此多之君𢎞治間嗣職至今猶百户云臘日雪次彭幸菴去歲午門燕歸韻瞭然天意不須猜向日同雲曉未開瑞木又飛前度葉金莖不賜去年杯愁心欲遍天涯草逺信誰傳隴上梅極目賀蘭山下路幾時風雨淨氛埃車駕方北巡故望邊塵之熄三疊東曙麻字韻酒熟牀頭不用賖美人何處誦南華千門欲動王孫草三徑猶存處士花有白菊自九月初花至冬半猶鮮茂林壑幾時還窈窕乾坤今日本清嘉閒來㑹得環中意未遣愁心作亂麻看牲回聞賜迎駕衣喜而有作紫壇黃道直如絃玉宇清宵月正圓北向星辰環斗極南來騎火燭天田先農壇與郊壇對禮從滌濯嚴先戒官忝寅清愧昔賢獨喜回鑾消息近錦袍明日賜樓前送李龍臣分教吉安故人選作儒官去還自當年一布衣老矣詩書方有味舊來朋輩覺全稀經綸已識從心始功業誰論與願違努力西江文物地竚瞻鳴鳳起朝暉黃坡儲君視其弟麗中於翰林河冰既開索詩為别時戊寅正月也黃溪溪上一坡斜茅屋青林映白沙摩詰輞川空見畫文卿華谷舊通家儲泳字文卿號華谷元詩人也懷人夢繞西堂草為客春深上苑花容易北來容易去看君何必泛仙槎即事和三江塵沙日日起春隂縱有紅芳未許尋正爾眼前憐蛺蝶雙飛無地不園林張元瑞司寇乞歸覲不許命有司存問諸公皆賀以詩豫亦同作紅纓白羝雙作牽緑尊縹醴黃封全尚書傳詔太守宣車騎雜遝隘里㕓天子敬老還貪賢安陽未得晝錦旋髙堂齊夀百福駢錫爾難老加蕃延老臣再拜舞堂前臣身踵頂恩皆天天念臣息臣預憐餘生何以效塵涓聖朝孝理萬國平叶山林無事日髙眠但飲春酒歌堯年月溪行送楊士宜黃龍浦南明月溪溪水帶月流清輝明珠百斛自天瀉白虹一道無聲馳涵清育秀無與泄君家草堂偏得之百年流澤潛灌注森然玉樹生階墀伯也早躡青雲梯接武仲季連孫枝孫枝晚出秀而整敻立青瑣增門楣河陽白雲忽在念回首却望溪堂歸是時青春三月暮溪栁緑暗飛黃鸝入門喜色可想見萱枝玉珮扶重闈留司禹鈞面丹渥君父仲玉主南京吏部事西川孟博垂金緋君伯父也池邊芳草林下竹三年不見情依依人間至樂亦有幾如君况是青陽時都門送君酌君酒感我雙鬢秋蓬飛君不見谷陽城南瑁湖上垂楊一徑通幽棲五年夢想不可到極目松梓空煙霏諸孫長大兒子老相將不辨某與誰盛年一去難再得好事入手無濡遲酒闌君去我獨立遙見江路飛紅旗石齊為閣老楊公賦萬書插架簾几清朝回燕坐百慮澄是為石齊公所名公意本自羲皇經人生有欲隨顛冥惟介乃立靜乃貞介焉如石靜以確一字可以終身行先生讀易五十載神明久在筌蹄外細看華榜揭修楹正似武公歌懿戒巖廊特立表縉紳嵩髙峻極華嶽尊三神不隨巨鼇抃一柱獨止洪河奔十年黃閣佐萬幾矢口應筆皆天機昭回何止飾萬物大有甘潤蘇癃疲名髙位重心轉下時復青山夢回駕向來一去四海嗟况此焦枯正炎夏介于石斷可知公今豈是丘園時平泉往事可一笑仇池雪浪空崔嵬須公輔佐太平了還賦此石歌公歸東亭用三江韻髙亭屹立省堂東碧瓦朱闌面面同花日靜熏暘谷暖竹風清散楚臺雄無多簿領晝如歲有赫文光夜起虹題字主人今北海玉尊從此不教空過海子橋張氏舊居作水邊楊栁映樓臺樓上紅忩面面開風景不殊人事别夕陽沙岸首頻回絲瓜棚成次三江韻絲瓜生而蔓蔓緣棚著花棚成蔓斯衍蔓逺實轉加松檜喜巖峻蘋萍樂卑窪巢禽與穴蟻各自寧其家東亭富闌楯豈乏援與笆先生