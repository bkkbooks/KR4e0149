庭閒青雲驥足當千里紅日龍樓在九關好竭明清贊欽恤對花翹首望君還元夕未齊席上次趙類菴韻合有新詩記此朝好天良㑹故人招千門華月春如盎三日東風凍已消銀瓮酒香分錦荔綵屏燈影亂虹橋只應不及雙龍輦飛上鼇山聽鳳簫時駕在宣府僕永感人也今歲生辰又值亡妻百日顧文宿兄弟求王宗顔詩寄新酒及仙山松鶴圗為夀以前三日至覽之愴然遂用其韻白髮蕭然懶孝先黃庭讀遍不成仙懷人舉目三星在撫事傷心五鼎全幸有好詩傳美酒轉添愁思入新年何如置我西湖上一醉田家錦樹筵嘗為文宿兄弟賦荆樹同春詩初度前一日有感君年六十我為夀六十明朝誰夀儂歲月不知人事併兒童剛道酒杯重牛眠未了山頭事蝶化難追夢裏蹤惟有舊時明鏡在一畨惆悵掩芙蓉送顧舟卿便道省親用别張豫卿韻出郭依稀見海山君家元在海山間梁鴻德耀賢相配谷口襄陽老更閒紅樹拂雲明翠節黃花隱戶隔松關此中便是神仙宅何必靈砂訪大還送陳子文昔年倚櫂清江浦兩岸丁丁沸斤斧漕舟歲計動逾萬此地尋常當七五年深法久人情玩弊孔紛紛勞葺補君今捧檄向淮壖正是青雲初著鞭相逢數語盡肯綮平生經濟豈徒然唐家善漕稱劉晏第一造舟推廟算綱條寬衍物力紓費止一時人永便今人何必非古人今代文襄晏後身連雲大厦須營構試手江邊聊看君齊居覽菽園雜記有感呈三江東觀紬書共幾篇南宮題草又三年風流未敢忘前輩名姓多應愧後賢記稱諸司奏事不能堅執有不可多取自上裁遂致權移左右雲裏泰階星近逺天涯岐路草芊綿夜來夢好君知否一櫂扁舟野水邊次韻三江賜玉有述團雲瑩潤截肪齊親見承恩出禁閨不比蘭支泛觹佩直從銀賞到金犀三江及第賜銀為洗馬賜金二品服犀餘輝畢竟還瀛嶼珍貢遙應度合黎九十武公方德進循牆無事首頻低吾鄉先輩勇退急流者二人憲副定菴先生今八十八憲僉一齊先生今八十四豫既數為定翁賦詩而憲僉不及非闕典歟何生行賦此以謝不敏且為他日鄉邦故事云金沙西涘白雲東定菴居細林山金沙灘在其下一齊家松城東鶴髮蕭然兩夀翁月旦並髙諸子論衣冠相望古人風雪中松柏寒逾徑露下芙蓉晚更紅一曲長生何日聽詩成翹首向飛鴻過崔茂仁都尉東齊適其子鳳徵生日壁有仙人騎鶴圖三江為題絶句豫亦同作平陽宅裏看圖畫想見王孫育秀年應是玉真親抱送還騎一鶴上寥天讀涯翁來鶴樓詩有感用前韻江樓南下水茫茫逺客歸心鶴共翔丁令不來華表柱左卿今老白雲鄉斑衣舊竹應千個緑髮新松定幾行獨倚危闌送孤目海雲真與暮天長沈石田畫為敬所閣老題桐樹江頭夏日長沈沈水色映山光幽人倚立桐隂裏消受閒邊一味涼經綸事重國恩深心憶青山未許尋忽見石田新畫障一時髙興滿雲林神仙上界猶官府清世閒行有幾人了却鹽梅霖雨事還公林下水邊身保寧何重器嘗通守松江以福建鹽課提舉致仕其子鑒鏊入太學頻辱惠音且存問吾鄉故舊甚悉感其雅情賦此奉寄錦屏山北閬州城心識君家到未能萬里有情傳尺素一時回首共青冥雲階接武人如玉江寺尋春酒似澠若問吳鄉舊游伴夢回東望曉天星東亭之東有叢竹竹外有松望之翳如也三江移竹於北牆而分其半植之南軒各賦一詩因次其韻東牆飛來兩青松北牆新篁隂更濃主人有意物兩遂鳳自鳳兮龍自龍五月一雨醉湘筠江北江南路不分月明夜半鳳雙語主人髣佛東亭君也適軒寫懷和水村冢宰達人任真性於世鮮求餘山林與城市所在靡縶拘孔明南陽日棲止一草廬及當將相權藝桑不千株走也林壑士塵途失東隅方將䇿駑蹇而與飛黃俱長夏平津館文酒共清娛投之金玉章重以來禽書一吟消暑溽再玩忘時虞方有兵事飛雲當我前不去兩踟蹰緬懷清池曲水華應遍舒餘歡似許續將子問何如先是小集軒中有蓮開重㑹之約送玉峯少宰之南都兼簡東川太宰用三江韻滿屋圖書散未收西風日夜趣仙舟回看玉署希同輩君久次翰林却望金陵感昔游鵬翼共知前路逺菊花應及到時秋東川坐裏從容語霖雨于今合九州車駕親征江右命濯菴行北邊再用前韻寄贈荷槖甘泉陋長卿前驅聲裏鐵山輕濯菴登途笳鼓振作甚盛皇威廟略咸無外北伐南征並有名秦塞百城兵似月周原千里稻如京歸來合奏平邊頌不寫陽關惜别情送柴德美給事赴南京光祿寺少卿凉飇動城闕時序忽以遒駕言適郊墅曠漭增離憂離憂將奈何賴有酒盈舟俯傾一杯渌仰視髙雲流物色既如此君行安可留轂下有遺直江東非逺游鄉園自密邇山水復清幽願保金玉音以應同聲求蔡東軒都尉六十八有詩自夀次韻為賀十月草四日也身與瑤姬並得仙蘭枝同秀玉同堅車輪幾從三山駕鞶帨曽分八繭綿沁水林園今孰盛晉卿文采世爭傳小春明日長生燕遙聽鸞簫又隔年去歲公開燕召客豫以事不赴竹軒為黃處士題其孫英讀書善星命山翁滿山都種竹竹裏開軒面面山何處更容塵土入有時遙送嶺雲還詩書偃仰遂百歲霄漢飛騰任九關報道春風消息好孫枝又長籜龍斑冬至謁陵次三江送行韻初陽映雪暖欲蒸千門瑞氣通諸陵朝廷報本嚴奠掃秩禮逺自前王興秋霜春雨意慘慘奩香篚帛心兢兢髙皇統天祀萬世奮自壠畝揮㦸矜兩都並建始文祖鼎命重為諸孫凝傳聞橋山初啓邑鸞輿玉趾幾降登小臣何幸得將事敢論暑雨仍寒冰經塗百里淨如掃輿夫踴躍誇力勝回龍小憩才半道瞬息已覩洪仁燈入門弛擔隨所適東寮西館各有朋山僧頻見頭亦白為我載演牛車乘寒光淩亂入窗户起視海月摩空升瑤宮銀闕自萬古雖有晦蝕無虧增嫦娥悄立如有恨欲斬桂樹嗟誰能齊居元不礙酬詠公詩險語何層層磨崖擬刻永昭頌挽斷千仞寒溪藤歸途再次韻燎烓長煙升槱蒸百官星擁橋山陵鸞車龍馭想戾止𤣥雲鬱勃中天興六飛南巡知近逺為感歲時還惕兢江淮民力惟國本先皇子育多愍矜烏號空抱鼎湖月血淚幾與山泉凝翻思年少上陵日隔城望山飛欲登來時不愁沙河漲歸路曽踏章村冰壬戌冬至祀畢樂忘學士邀游冷泉莊夜失道與今熊峯宗伯循西山行過南北章村凡三四涉水年華不留心獨在踞鞍十里已弗勝出山望城喜月上騎火夾道如春燈化人樓殿鎖寥寂金碧斬新無與朋茫茫緣業誰為考無乃劫運相憑乘再吟嘉贈擬賡屬一韻費酒幾盈升我才白髮梳漸短君思川流來日增聊將歲月紀行役敢與斤堊論工能塵途紛擾又三日岡壠下上應千層明年再到知健否歸問老韓尋赤藤道中大風揚塵戲為四語清河飲劉錦衣莊因足成之西風吹塵日何之濁河東注無歸時崑崙常髙海常下萬古不解癡人疑蜉蝣生盡一日樂孟嘗死有千年悲此言堪笑亦有悟酒到但飲無多辭道逢喪車有感鐃丁丁鼓冬冬挽且歌哭以從短簫間歌起悲風歌者㑹有哭哭者㑹有終白日西下黃河東此歌此哭寧終窮惟有柩中人一去萬古長瞢瞢次韻答申天錫都閫憶在嚴城聽霜角青綾坐擁燈花落將軍裔本申包胥部曲勇過王鎮惡腰間龍紋七寶刀壯氣直與燕山髙誓將沙漠靖狐鼠肯為班行論鴈羔詩來遣我懷南浦一片旌旗送笳鼓儒生為將今幾人解與三軍道酸苦天錫武舉第一人時守備天夀山次韻望居庸連山限夷夏中斷出竒雄絶地蟠金鎖橫天結翠幪塵沙飛不到羊馬貢還通今日班司馬誰銘瀚海功亡宜人生日有感用乙亥歲韻象服遺容故儼然繐帷尊酒又殘年臘月草四日也灞陵共隱嗟豫晚宜人數勸豫歸北郭安貧藉爾賢千里關河愁跋涉一封雲壠待歸全擬以開歲令三兒扶櫬歸鹿車本約山中賦翻作東城薤露篇東江家藏集卷十四中集
