body:
  text: 東江家藏集卷二初集二明顧清撰山中稿詩七十一首陪藝軒觀海宿村家紀事四首三月吳江上垂楊作意青兩堤煙冉冉一路雨冥冥客况今初識舟行未可停漁翁不愁懼獨立釣前汀雲合天如羃江翻浪若飛衆山當晝隱孤樹入煙微舟楫危前路庭闈感昨非不知天早晚時見牧童歸暝入空江路茫茫問所投電光時掣劔雨勢欲翻舟鴻雁鳴何及蛟龍怒未休前村有燈火漸近復生愁中流失舟楫一瓠千黃金風雨江村暮野人懷顧深霑濡免僮僕歡㑹洽朋簪惜哉漂母意當者非淮隂是日過黃浦即雨暮抵村家雨稍歇主人出迎豫辭之而主意甚勤既登岸雨作如注明日舟中水沒足使無此人狼狽可知矣主人范姓忘其名辛亥復至海上訪之其人已歿家亦蕩析久矣蓋困於煮海也為之憮然水仙扇面瑤池不見董雙成清夢依依繞玉京歲晚相逢洛川路一江寒碧月空明絶句雲暗西山雨欲來好風先到讀書堆幽人正熟羲黃夢亂揭牀頭書卷開庚子秋日書感槐花如雨落秋金睡起憑闌思不禁滿地緑隂容我懶一篇長句向誰吟馬因捷步翻成蹶水到無聲始是深世事相逢已如此此生何必漫勞心是歲提學廣信婁克讓先生以豫輩從巡按選入學抑不豫鄉試曰入學不由正途出門便差也送沈惟馨赴舉和陳剛中韻朝陽有鳴鳯髙岡有梧桐男兒生盛時肯負氣吞虹君不見飯牛者長歌白石齊東野堯傳舜繼雖不逢奮起猶能奠青社又不見和氏璧胚胎本是山中石鐫磨一日遇良工遂與鎮圭登紫極絲衣采采青於藍江邉握手皆停驂便登萬里道肯戀一夕談長風巨浪在足底蓴絲菰米焉足甘送子出九山山鳥鳴間關官亭楊柳不用攀笑指孤鶚青雲間送子涉澱湖畫槳搖清波鳯山回首何嵯峨袖中雄劔鳴蛟鼉雍雍鳴鳯菶菶梧桐一川秋水兩腋清風輟耕鹿門隴獻賦長楊宫干羽舞兩階日月明重瞳雲梯一回首擾擾多沙蟲嗟我此行不得相從兮但虛窗靜夜夢想秦淮四壁之高峰秋風好消息早寄南飛鴻沈惟馨之赴舉也豫既有詩和陳剛中韻送之矣今再寄七律一首鳯凰臺下簇雕鞍臺上雲封十二闌日炫龍光鍾阜曉空蟠虎氣石城寒凌風有夢排天闕鞭石何由泛海瀾吹徹紫簫天似水月明猶想獨乘鸞題竹兔頴凉分月魄鳯毛寒濕松烟日暮白雲飛盡一天秋色蒼然枯木睡禽皇仁覃八荒虞網解三靣小鳥深山中獨宿不驚眄詠二喬得真字韻銅雀金陵總未真六朝花月幾經春闌干誤喜逢傾國却是丹青卷裏人北壇齊宿初月明逺樹繁星麗髙空清壇矗紫垣周道蟠青虹地勝宅壬坎木秀扶杉松惟時八月初萬象呈秋容長原鎖寒碧乾樹明新紅嘉穀卧連野敗稂枯作叢歲功奄銍艾吉日臨著雍時祀不敢後冠蓋來童童微名繫官府將送煩僕僮追隨縉紳後周旋尊爼中仰瞻霄漢間神光煜昭融駿奔既肅穆對越何昻顒官備物有紀夜寂天無風清樂發絲竹嚴令聞鼓鐘籩豆紛夙飣醢菹簇時供長煙起葦炬畫燭輝雕籠霓幢隱雙鳯雲軿留六龍和熙洽幽𤣥蜚蠁聞蒼穹由來誠敬孚不在儀品豐吾聞古王都右社而左宗宗以明祖德社以昭神功民非土與榖生養安所從所以古至今嚴祀無終窮吾侯素勤理祀事尤寅恭飲食神既嗜茀嘏宜來崇君看秋野間萬寶如崇墉百室㑹盈止醴醪各迎逢閭閻禮讓行囹圄莓苔封神功不可忘允侯誠所通作詩紀盛事竊效康衢童破鏡篇有鄰婦再適而還省其前姑者感而賦此破鏡寧終破不願重入奩斷絃寧終斷不願鸞膠粘人生一生惟一死此身豈可輕相許因循一語涉狐疑死向重泉作羞鬼所以古志士跬步不敢輕譬逢三岐路熟問乃敢行屹立萬仭岡决眥孤風生乾坤落落一身逺風塵混混雙眸明古人已去不可作末世吁嗟輕唯諾昨日仇讐今友朋朝哭泣兮暮歡謔凉風蕭蕭吹客衣蒼茫歲晚孤鴻飛梅花夾道慵舉首涕泪滿襟懷昔時我願天地間萬事皆從願有始必有終不作風花片陶然百歲中永絶癡兒面君不聞蔡琰胡笳十八拍千載英雄泪如霰征婦詞銀燈花落夜遲遲最憶燈前笑語時哀樂易遷驚逝水關山無路怨娥眉風沙漠漠人何在星漢迢迢鵲亦疑見說天山弓未掛敢將清泪浪沾頥村居雜興六首屋東小隄長半里疏柳成行䕃秋水無風時復一葉飛有風終夜鳴不已庭前薔薇好枝葉初秋落殘冬更發雖無顔色媚西風甘與貞松待霜雪石榴經霜紅滿枝前年三月移根時珠囊玉醴纎手擘幽人為爾驚棲遲盆池養蓮期看花兩年不發吁堪嗟浮萍葉死水痕長微波蹙蹙跳魚蝦梅花吾儕之故人寂寞短籬今五春遲喚南鄰錦囊客月明為返羅浮魂靈均沈湘陶令死籬下寒香久無主江邊一笑倚清秋爛漫西風幾今古秋夕露坐作𤣥天大無匹要亦有窮處不知窮處外曠莽復何寓茫然仰太虛嗒爾消萬慮規規塵網中齷齪焉足諭登夏時茂澄碧覽翠二樓澄碧髙樓三泖東闌干如畫倚江空風傳鶴語灘聲靜潮挾龍腥海氣通萬象盡沉雲影底八窗都在月明中拋書便作南昌夢秋水長天一色同越水吳山指顧中虛簷百尺臥元龍都將宇宙清明氣散入江湖礧磈胸天末鳥飛雲淡淡海門烟散樹重重若為借得湘妃瑟鼓向江南十二峰寒夜晚雲欲雪寒糢糊微月遞明光有無枯桑林頭北風急山鬼呌嘯林鴉呼此時柴門寂如磬借問夫子何為乎一盞油燈照虛壁夢在洙泗談黃虞夜半燈盡作寒雞聲啾啾隂墻明殘雪推窗月當户始聞二鼓歇殘編有至味黿鼎芬在列夜闌燭復盡此意誰共說嚴風逼兩袖攬衾更騷屑雪中對客茅屋無風已自寒客來飛雪滿遙山相看只合圍爐坐欲去誰能放棹還梅萼映空增悵望松枝低檻故闌珊平生陶穀多才雋愁絶佳人一笑間除夜更無柏酒共桃符一卷離騷伴竹爐短褐有情憐歲月敝冠無恙笑頭顱白波東逝傷心逺青鳥西飛入望孤久臥滄江慣愁思不將明日問榮枯辛丑春夜聞雨破屋寒多怯夜眠驟聞鳴雨更欣然已拚窗下琴書濕暗喜庭前草木鮮簷澑不齊時㸃㸃燈花無謂故娟娟清時美景雙惆悵臥聽淋浪百慮煎遣興門掩青蘿月窗含緑樹煙咿吾閒白晝寂寞任長年荒野無窮日滄江不盡天傷春復懷友悵望一凄然緑重墻頭柳紅欹谷口桃燕輕翻水捷鸛暖入雲髙好景宜佳句殘尊有濁醪故人滄海上相憶釣金鼇雨不止細雨久不止江臯泥漸深出門妨散步隱几獨長吟柳重墻頭壓苔添石靣侵煙雲方滿眼花鳥莫關心春日將適郊外忽暴風阻行二月六日天氣惡捲地黑風吹倒人却看花柳俱無色忽訝江山不似春高臥野人滋懶散欲飛燕子自逡巡東園有約不如意須待來朝理釣綸寫懷美酒新豐市輕車洛下城星霜悲聚散寒暑遞枯榮彤管三千字青冥十萬程遼天來去雁華屋短長檠烟栁風中亂溪雲席上橫西山朝有氣北斗夜無聲病得休文瘦貧看季子輕幾年嗟敝褐此日笑長纓茅屋依江靜林花近眼明芊綿隨緑草悵望聽流鶯畫虎將焉用屠龍竟未成扁舟徒漾漾春水故盈盈尚覺乾坤大空餘夢寐清一枝原樹鵲百丈海天鯨落月愁何奈滄洲歲屢更途窮滋懶鈍時屈藉幽貞雅鄭難同調梟鸞本異鳴永懷萍泛泛敢謂鐡錚錚遇竹時題句逢鷗且問盟茂先如可作雄劔在延平春日雜興東風一夢過南園吳水吳山興杳然經雨落花還似錦弄風柳絮不成綿林猿夜嘯空哀月江鳥晴飛欲傅天處處蘭橈移白晝邉生終日枕書眠羣山西北翠如煙三女荒岡草樹連瑤井鶴鳴凡幾歲碧潭龍去不知年潮平滬瀆城頭月花落雲間洞裏天千古廢興如昨日幾回窗下掩殘編泛觀今古不勝哀又向江邊步緑苔曾見楚兵回柏舉誰教越女上蘇臺君臣得失餘文史羅綺繁華遍草萊最恨鴟夷五湖去胥濤空湧浙江雷千雉孤城枕碧流晴天望逺自生愁金羈絡繹花邊馬玉霧葱蘢柳外樓何處健兒誇仗劍時中人汪直方開邉幾年漁父獨垂鈎白鷗飛入蒼烟裏目斷斜陽送去舟環溪十詠得蓴菜秋風吹嫩碧溪蓴春韭寒菘别置倫入手細牽青不斷盈筐滿貯緑仍勻許同玉膾成雙美未數金盤饌八珍多渴長卿愁內熱謝他清淡養天真錦衣歸釣圖天上歸來錦作袍吳江春水泛蒲萄傍人未識扁舟意猶道先生學釣鼇八月十五夜月色好如此欲吟誰起豫鈎簾望南極散履下前除潤氣連滄海浮光混太虛曠然心境㑹端坐念𤣥初秋興和藝軒韻海嶠千峰插漢齊每因松竹問幽棲江山舉目成圖畫天地從人作品題身隱不妨隨鹿豕門閒應得長蒿藜何須緑野功成後始是黃梁夢破時伏雨闌風日未休越山吳水共悠悠鸞書不返瑤臺暮雁陳爭回碧樹秋敝褐有情依客子斷碑無主怨王侯平生宋玉多悲感擬脫青衫趂白鷗碧海縈回天際還海山青翠束連環銅城北望三干里金斗西橫百二關落月有時聞畫角夕陽何處倚危闌清江面面芙蓉滿安得凌波却暫攀冬至書懷是歲九月初連雨腐稼明年壬寅大饑米石至千二百錢隂盡陽復回年華遞相促明燈坐深夜長歎拊髀肉憶昨童丱初未念寒與燠依依鄰舍兒游嬉日相逐九齡事書史稍解知撿束十三文義通孜孜務磨琢維時心尚孩寒暴略相續逡巡鄰弱冠人事有顛踣舊業竟蕭條凄然泣松竹繫名庠序間晨暮恆碌碌夙心雖未改奈此塵囂瀆翻思少日誤閒暇安可復今年值霪雨積潦彌旬朔荒居迫沮洳下牀水沒足魚行僅兩月悶絶每思哭侵冬始安居卒歲已無穀匆匆日復日不覺流光速朝來日長至推枕乃驚􅌓清晨隨冠冕州衙拜黃屋於惟萬乘尊至德春同育顧兹嵗小歉聖心已煩蹙恭聞遣明詔四出洗寃獄人和天乃應生意豈長鞠惟應西江水不及轍中涸歸來茅屋底寂寞對僮僕仰看天意愁雨雪交相屬侵陵及蘭蕙摧壓倒松菊海宫東南天一望雲彌目傍村八九家悄若住空谷往來迹已斷况乃相賀祝物情厭荒落天亦恨幽獨閉門日易暮忽已見燈燭所思渺雲漢誰與論心曲須㬰雨聲歇窗隙風簌簌夜久寒轉嚴指直不敢觸寒爐撥殘灰邈矣拱先躅因思古達士涉世多翻覆譬之百鍊金歷久乃精熟蹇豫沙礦姿敢爾恨幽辱顧此年歲長便便止空腹烟雲方滿眼何時見清旭維東有滄海浩漫侵坤軸其上通星辰其下連河瀆吾將駕靈查一訪巫咸卜海棠四首濯錦江頭富貴花何年流落海天涯玉人二八空閨裏歲歲因君感物華屑玉塗坯艷一叢內園開處錦屏幪何人錯認楊妃醉泪濕春風憶夢中日暖風暄人意慵海棠正向此時紅誰云花好能消恨花恨於人更不同香頰潮紅軃翠襦絳唇微吐滴胭脂游絲不動日停午斜倚東風若有思通波塘泛舟沈惟馨王大用錢時斂聯句時斂與謙舊字舟出五里塘迢迢去路長水花紅近眼烟柳緑成行茅屋依山小汀蘭拂棹香時時見漁父擊楫下滄浪夢登連閣甚髙敞前繞羣山松影披拂簷下真異境也賦詩八句而記其半漫識于此髙閣凌虛拂紫霄四簷軒敞接連鼇千巖對起龍蛇窟兩足親登鳯鳥巢相先生具慶堂堯日仁風遍萊庭瑞氣重康强惟德召和樂自天鍾甲第花迎户高堂雪覆松伯鸞才不衒德耀禮偏恭穆穆金蘭契娟娟玉樹容紘綖催夜績杖屨閲春農景入榆林晚甘回蔗境穠鞶纓晨濟濟笙鼓日雍雍偕老無遺恨傳芳有亢宗已全三釡養行遂五花封委曲吳江水微茫泰岱峰題詩遙獻壽春色兩融融醉書車不避太行坂舟不辭灎澦堆男兒生不履窮途一生肝膽何由開君不見東魯緼袍子君不見南海伏波老二旬九食未為病白頭意氣日矯矯英雄未遇龍蟠泥他日何緣悔曩時逝將白石礪吾齒饑來快嚼南山芝巢雲為倪舉人賦越山山人迹大竒卜居直與浮雲齊誅茅不畏虎爭穴拓地逺教龍擇棲初來尚嫌巾履濕住久更覺青天低飛旌卷斾互明滅松窗石榻同凄迷時時蒸翠落書幌往往空青霑杖藜山人前年不出山丹崖緑壑時攀躋半笻橫絶隴頭路一犁耕破芝田泥今日山人振衣起飛雲萬里隨東西翻騰百川雨九土變化豈復知端倪雲兮能舒復能卷世間萬事如蓬轉巖崖霄漢各有時男兒那得長偃蹇作歌贈君殊短短功成舊巢莫相逺嘗瓜得麻字旋拔霜刀剖玉瓜清甘入口四筵誇憑君莫問渠家世見說青門又種麻待月軒為錢塘沈廷璧賦高軒峨峨臨水開虛簷四敞無纎埃主人為此興不淺要待嫦娥天際來晴空落日清如洗逺水微茫翠烟起清簟疏櫳半捲簾思入滄溟幾千里滄溟迢迢天漢東玉蟾戲水龍王宫清輝只尺不可覩幽情爛熳迷雲空有時掀髯琢詩句烏鵲啁啾隔烟樹長吟呼起白鳯來恨不同飛碧霄去有時慿闌吹洞簫簫聲幽咽驚濳蛟倦來夢入水精殿寒光百道飛銀瑤香殘燭冷催更鼓遐想蒼茫極今古牛渚金陵夜夜天風流百世俱塵土感時撫事情依依東望蓬萊意轉迷繞闌風露不知冷隔水松篁應慘凄錢塘亦是三江地風景尋常接宵寐撫卷知君信可人不覺神飛渡江澨我歌待月篇月應解我意不用闌干苦凝睇少遲銀橋天際起與爾同舞霓裳隊久雨江上癡雲接地低閉門終日看凄迷東園有約無由到想見春泥沒馬蹄癸卯立春日寄陸時敏五載藍袍觸暗塵梅花風起又新春漫憐司馬長多病自說萊蕪已慣貧經雪松篁猶在眼弄晴禽鳥漸宜人風光此日催詩夢已入芳洲采緑蘋初赴舉時賦七律一首留别諸公適時敏以詩來即用其韻同時濟濟盡英才况復清朝景運開幸與諸公作先路敢期三䇿便掄魁秦淮山好天開畫揚子江深地走雷應到高秋明月夜思君直上鳯凰臺奉餞郡守稷山王侯得鳯字南薰不入虞絃弄兩岐每詑漁陽誦豈知三年東海頭黍稻連雲繭如瓮皇華問俗已知本丹扆思賢每勞夢雙旌此去誰能留矯首梧岡聽鳴鳯初舉不第却回書所歷濳魚不出槮棲鳥不出林不因風雷便豈識天地之大江湖深天風颯颯吹黃槐江船擊鼓凌晨開便為萬里客豈復兒女猜雲帆悠悠渡三泖已覺從來雙眼小瞥然一瞬出澱湖使我塵襟豁如掃將軍祠前芳草多隂廊古瓦封苔窠英雄恨殺白衣櫓千載此地還來過陳湖北來勢尤大氣象渾疑在天外波光黯慘迷西東驚雷噴雪吹腥風同舟十人半失色我疑此處藏蛟龍湖西一帶風初靜呼酒開筵共相慶推蓬又覺眼豁然黃天獨墅天相連向來顛沛幾不免到此始知應自憐出門只尺已如此况乃天涯千萬里何處池塘楊柳青誰家門巷炊烟起依稀漸覺風景佳前頭已是姑蘇臺夫差句踐兩寂寞倡謳市語喧如雷揚帆徑逐東風便不盡平生游覽願扁舟信宿過望亭錫山如畫遙相迎道傍深刻十三字千載不磨賢令名有石大書無錫縣知縣永嘉項公愛民父母凡十三字毗陵郭裏舟初住榆葉零零雜風雨綀衾獨擁不成眠是夕方知有羈旅丹陽自昔稱畏途我實初行兼病軀蹇驢登登不能止緣崖歷谷何縈紆日斜憩足句容道尊酒聊將潤枯槁當壚可是臨卭人茜裳廉纎不動塵人言巫山在平地對靣已隔黃姑津風塵浩蕩催征馬西望金陵去如寫片雲飛來我已愁頃刻滂沱遍原野道邊茅廬大比拳俯首急入如窮猿蒼皇已識異鄉味帡幪始知大厦恩行行見說宸居近趣馬加鞭氣重奮此時天公亦開晴氛埃滌盡穹宇清中和橋上初登覽目極遙天發深感江山如此不早來幾向此生虛壈坎鍾山如龍雲際來石城雙闕中天開固知傳聞不虛假神祖規模真壯哉長衢蕩蕩平於砥井畫棋分各條理接棟連甍如灌雲去馬來軒若流水聲華文物競奢豪公子王孫處處遭佳人總為王幼玉將軍不數霍嫖姚東山明月西江水盡日尋游看不已細柳深藏朱雀橋飛花暗滿長干里自從失腳下青冥往跡回看如敗枰束書羞詠月中桂鼓棹還為江上行長江三靣山如壁環拱金陵護宸極古稱天塹信非虛自是荒淫足亡國波平風穩帆檣健倐忽金山當我靣竒形秀色畫莫工信知天巧非人功平生夢想不可到足慰此行樵悴容南徐自古雄豪地到此令人益竒氣惜無許渾千首詩洗我胸中不平事舟行半日下丹陽新豐美酒又聞香同行半是同來伴相對不言空感傷搴篷徑指吳門路一片歸心亂雲霧江山不學蘇秦家風景蒼蒼只如故故園到日天已寒江楓落葉秋斑斑青尊提擕湛緑醑故人為我開歡顔西風落日吹芳菊共挹寒香散幽獨困窮拂鬱豈徒爾况我霜毫未應秃君不見芙蓉花生江臯秋風未至寧蕭條又不見千里駒服鹽車霜蹄一蹶氣轉加丈夫結束自有地肯學兒女空愁嗟風簾日暮展書讀炳炳丹青照人目臨淵羡魚知已非呼童靜掩林間屋讀莊子有感落日平林烟霧生西風茅屋短檠明書生已惜三千字狂客猶誇九萬程蠻觸干戈神獨領蜉蝣日月夢濳驚舊游亦有芝蘭契冰雪何人與問盟少年行驅車上太行前有九折坂回車下平原畢竟無人挽升高望同行去去日已逺及今努力尚可追西山白日下來時甲辰九月五日迎司馬蘭亭過蔡廷章宿岸側野花香拂棹竹間細水暗通船塵中已覺俱成夢幽處真疑别有天紅斂江村寒映日翠浮沙市晚生烟平生不為耽幽興容易那能到輞川清霜未降楓先赤紫蟹初嘗菊半黃終嵗只聞田舍樂一時頓覺市朝忙清晨雁䳱盈前浦落日牛羊滿近岡為問東臯有餘地便應從此作鄰莊感興六首青皇播羣品百鳥和聲音秋風一夜起繞屋寒蛩吟四時有代謝何况古與今懷哉劉文苑高臥紫山岑鳯凰長丹穴不識烏與鳶飛飛度中州關山鬱芉綿文翰一震耀百喙起紛然崑崙有瑶樹𤣥洲多玉田下有醴泉流上有蔚藍天誰能復記慮一去三千年兀兀深夜坐迢迢千古思棄我萬鎰寶坐此一飯羈前瞻日既逺內顧心還悲蘭荆不同長緑髮坐成絲彥明古烈士誰哉繼餘輝投鼠且忌器愛牛搏其虻事固有大體一怒安可慿所以古聖哲逺覽窮千齡豈無一决勇而獨務含宏斯人不可作彼夫竟慿陵椿夀期萬歲龜齡亦千秋傷哉蜉蝣蟲朝生夕不留君子與衆人其道亦相侔計日不計年吾生將安投不寐起中夜鈎簾坐前楹傍見松桂影仰看江月生銀河正無翳萬里亘天橫晶光動左右四闥晃虛明中懷正如此安得謝塵纓悅清為盧永清賦豈無離羣意翛然野鶴姿好山時拄頰幽澗或忘饑心賞丹青㑹神融翰墨知年來漸成癖無計得中醫永清故家子忠實廉謹室無儋石而百金之託人不疑之善裝縹嗜文字得人一詩不啻拱璧人以是樂豫之𢎞治乙丑歲卒且卒豫使人視之屬以悅清詩文置棺中餘無他言其好尚可知已古松年來耆舊多零落如此長松見亦稀徑直不隨冰雪困馨香宜得鳯鸞依流脂化魄皆堪斸墜子成林又合圍好在主人封殖厚清遊留待子房歸玉扇墜歌有序古者中國男女通用團扇團扇之制不便於懷藏故以組貫物于其柄遇執事則以為重而懸之帶間謂之扇墜好事者或刻玉石為人物蟲魚之形而因以為玩及摺扇行此制遂廢雖時或流落人間而用之者鮮矣豫嘗謂天下之變相尋於無窮而大率每變日趨於巧此亦其一也怡柑陸先生嘗畜一墨玉雙魚扇墜繫之摺扇出以索題當辨髦廢棄之餘而獨加賞愛其諸有所感乎因為作短歌以貽之于以見一物之廢興可以占世道之變而世之不諧于俗者又自别有賞音也天星夜墜烏玉渠靈光化作雙鯉魚目光夾日搖明珠昆岡八月秋氣孤萬夫入水羣龍逋𤣥鬐一躍升天衢金索貫頥來獻俘清風先生坐冰壺掀髯一笑留坐隅被以組綬恩禮殊金閨窈窕連黃樞爾我相倚出入俱自從倭風入中區飄然棄豫瓦礫如時移世變日下趨何意更逢君子徒亦知所好非所須意氣相感終不渝河東昔感中廄駒我歌雙魚雙涕濡古人中人今豈無時哉不遇索莫俯首棲寒廬題梅花仙子圗盛子昭畫舊藏陸怡柑所正德庚午歸豫家烟林烏啼天未霜落月漏雲金鏡光美人獨宿九華殿天風吹動金琅璫瑤階露重侵羅襪凍合梅梢不成雪翩然飛下西湖頭獨傍寒香倚愁絶寒香鬱鬱愁冲冲冰魂蕩漾迷西東星眸欲流滴秋水霓裳不動縈天風天風颯颯鳴璚玖欲去踟蹰更回首武塘仙人五彩毫偷眼方朔窺金桃凌晨寫出一時景清寒入面風蕭騷蒼苔粼粼白石净空青暗滴隂崖冷石畔叢篁低拂雲雲外疏桐落金井翠禽一聲河漢橫遼天回首思冥冥雲樓霧閣渺何許冷蕊疏枝空翠屏美人只今遊太清武塘遺跡亦晨星悵望龍城夢中路寒綃慘淡來精靈滿江紅乙巳元宵雲月澄鮮重城夜啓滿目繁華正江南春早紅燈初試簾影千門搖粉黛香塵十里隨羅綺論今宵何止刻千金堪遊戲歡未巳愁還繼暗想今年遙憐往歲四時相代如流水上林春色三千里望鰲山鳯輦是何年心搖曵東江家藏集卷二
