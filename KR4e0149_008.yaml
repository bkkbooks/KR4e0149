body:
  text: 東江家藏集卷八中集四明顧清撰北游稿詩一百二十二首戊午元日候朝和冬至韻塵途役役苦迎將五色誰從補舜裳坐擁槐枝候明發憂端不數漏聲長謁文山祠次同游諸公韻東風一夢過錢塘直自元豐兆靖康終嵗諸公講和戰到頭赤手樹綱常生前骨肉山河碎身後輝光日月長新廟城南更雄麗公忠遺種詎荒涼時新作三忠祠於崇文門外祀諸葛武侯嶽武穆及公又用杜韻碧殿長松鎖十尋晚雲將雪助蕭森貂蟬不改崖山制公封信國時帝在崖山金石疑聞孔壁音祠在府學文廟西南去星潮嗟往事北來祠廟豈公心春風一掬唐衢淚幾為先生濕短襟人日鄉里㑹歸曹良金秋官寄示詠懷新句明日齊所奉答薄寒催酒鬭新年猶是郊齊一日前事往舊游真作夢詩來險韻恰逢咽鶯調歌舌方求友栁著官黃欲試綿子建平生最蕭灑壯懷寧許豆秸然來詩句意若有不懌然者十四日雪後朝回史館作紫宸晴雪映蓬萊獨出東廂候鎖開學士履聲雲裏下君王鑾駕月中回爭先皓鶴羞初日失喜遙林見早梅坐聽角門宣喚急却思授簡懼非才同年齊院中朝振同戴御史元之宿僧舍憲清南夫有詩嘲之往返良苦豫最後作為之解圍清曉詩筒入遞頻夜窗虛榻看橫陳賈餘競欲收三捷戒狃豫方息兩民掖竹本因枝帶葉胡盧豈必畫非真朝振有紙畫胡盧之句西堂三日伊蒲饌且共瞿曇講幻身以燈圓餉陸太僕三五新正憶故園屑雲糜玉閙春盤小奴解作江南意逺客都忘歲暮寒梅欲鬭圓忙著子雪如爭巧故成團玉崖太僕真清吏莫認明珠按劒看同年劉直之父母雙壽東望蓬萊極海雲仙籌滿屋舊曽聞老餘驄馬留桓典歸卧青山共少君華髮笑看明鏡在綵絲猶憶畫簾分高堂嵗晚長生燕還折梅花映寶薰紀夢寄文宿諸友客舍春來覺夢多黃衫連夕報登科七星散落雲中斗獨鶴高乘樹杪柯元夕夢七鬼齊立各擎一斗云天星墜以此承之又夢坐大樹下一巨鶴來巢其上須㬰而成捷足故人俱緑鬢關心鄉社渺滄波從今不作停雲望傾耳雷門聽凱歌送汪進之令永嘉馬上相逢識未真論交已是十年人風雲聚散驚浮世霄漢飛騰有健身奉日豈應忘近主鳴琴聊欲試親民東風百里溫州路誰看桃花滿縣春賦得瀛海奎光送馬良佐先生之南院仙家蒼茫雲海東海光上與星辰通昭回萬象森布列靈景獨應圖書宫宫中明星十有六一一紫焰舒長虹珠宫貝闕相蕩漾頃刻萬狀難為容羣仙無事亦來往鸞鶴隱見空明中翩然一鶴下南斗流輝萬丈驚蛟龍蛟龍驚遁海天淨惟有匹練懸高空紫宫東南縱遐眺晴霞五色交青紅天孫停梭赤霄上指㸃毫末分纎穠帝傍絲綸要經緯旋軫不待星躔終石渠延閣五雲繞紫泥黃紙三更封懸知不學卯金子餘光反借青藜公題萱桂圖送徐理之父子白頭人對綵衣裳本自無憂不待忘誰寫萱花傍叢桂要看雛鳳挹天香蔣國器往歲南歸豫苦頭風不得送賦詩有記取他年說今日冷雲疏雨出都門之句今再至而歸豫亦病中天復隂雨俯仰今昔為之慨然五載京華兩賦歸客心都似宦情微天應有意還留舌雨亦何心慣濕衣長路不須懷近事國器此來多可感者舊題渾已䜟先幾小崑山下農田早為想秋風蟹稻肥徐子容祖母壽八十三春湖映空光一碧春日烘雲成五色金堂仙人燕王母雲影波光亂瑶席麟洲别來幾清淺蘭葉萱枝翠如翦笑輪花甲問東風八十三年供一莞楊花撲簾春晝遲鸞笙幻眇朱絃稀瑶環涓秀瑜珥潤戲舞繞膝爭含飴就中一孫俊而奇珊瑚玉樹含春暉擔簦上國未能去幾日目斷孤雲飛西風八月仙桂黃手攜鶚書還故鄉仙人一笑開北堂重簾復幔皆天香男兒悅親寧碌碌作詩獻壽還拭目子容讀書京師求此寄壽是秋果高薦詩云有䜟殆不虛也三月草一日書事只合清江坐釣磯等閒誰遣著朝衣緑陰門巷青繩路心逐南雲一片飛小閣垂簾相對紅窄衫低帽一叢叢歸來有語那能記坐倚東風憶夢中時初教內書館鄒時鳴父母雙壽玉陛風光動綵裙鵲聲先已報江魚時鳴奉使便道過家鸞回兩檢新封敕龍卧三湘舊隱居喜氣併添凝望裏賓筵相壓小春餘無因得與升堂拜長傍紅雲想使車家僮摘槐芽小奴攜筐緑掩苒斜日歸自東鄰家青精未試仙子訣泠淘的見詩翁誇人間正味竟何在天地育物真無涯紫蓴青荇更不惡高秋誰泛三江槎送王約赴河間縣丞平原西北古瀛洲長記征車半日留山接全燕從地起河分二水帶城流千年王澤詩書古永日丞㕔竹樹幽好去王郎更清白龍門一局未應休挽蘇廷玉到處江湖識此翁幾番傾廩惠疲癃靈巖山下一片石歎息高蹤已夢中何處士賞靜亭萬里松州限蜀川風流幕府重當年籌邊屢上金城略退食還歌菉竹篇意外雲山爭自媚環中風月許誰傳瀼西茅屋長鄰近相望孤鴻落照邊送可晚吳翁十里山塘接虎丘隱翁家近白蘋洲偶來暫别延陵廟欲去還同孺子舟先生與徐司空同來今復同去雲裏綵衣高捧日雨中黃菊苦思秋經年正有庭闈念為酌離觴悔逺游送謝司倉寧知信宜邑乃在古高州地接朱鳶近天連碧海浮官倉餘火米土俗罷綿裘莫作炎蒸慮男兒重逺游書饒貢士友愛堂卷江雨紅垂荆樹花草堂千里夢京華無人為續池塘句長向春風憶謝家風雨長安旅食孤夜窗燈火說江湖紅塵下馬東城路來看饒家友愛圖送夏良惠君從澄江來還望澄江去澄江渺千里孰是君歸處連連波上山厯厯沙邊樹長安多親知青雲在指顧一行拂塵衣高意竟莫禦淩江望農烟憩石呼晚渡芳阡笑兒童佳木散徒御問訊釣魚竿汀洲未云暮送宋惟德分教池州池陽風物似長沙第一名山是九華輸與能詩宋文學芙蓉影裏岸烏紗送王汝昭考績還南樂鳴玉薰風下紫清日華流采照君明重來一鶚秋期近暫去雙鳬曉翼輕封域未踰關輔地别離無奈故人情歸輪入境應頻駐一路棠隂父老迎送汪縣丞還吳興吳綿百篋練千箱歲占東南第一綱不似朱家貢花石九重龍衮要文章洞庭烟浪接吳興使者歸舟畫裏行浮玉山前萬松底好詩多為別來生題李徵伯扇新雨蕉葉大雲根生晝陰只此可永日何必絃鳴琴題趙希文所藏王孟仁小景柳絲如烟散晴風小桃野樹交青紅芳洲細草何丰茸緑波逺與青天同遙山西入空濛中扁舟兀坐誰氏翁物色似是天隨公驚麏駭鹿不可蹤此日此意殊從容自從挾書朝帝宫十年夢寐勞江東長橋飛蓋連垂虹尚想烟雨推孤篷偶然一笑豈易逢丹青信有縮地功燕山六月苦藴隆開軒對此情無窮誰歟往者吾其從送盛世䖍兼簡嚴以德紅雲千里隔江關容易看君獨往還留得錦箋無恙在不教空到小吳山東河日日望蘭舟逺客新年已倦游為憶相逢話京邸紅菱白藕正清秋書吳通判焚黃卷通判名皓台州人以旴𣅿尹升任淮甸風煙接海門甘棠隨處緑隂蕃人傳舊德歌三異帝有新恩賁九原華表月明蒼樹合寶函春動彩雲翻鄉人應悔籯金誤衰草荒墳泣斷猿送楊啓祥楊生畫蘭近無敵揮筆使金如使墨𤣥繒紺楮隨所遇入手光風燦朝日湘江南北幾千里收拾都歸筆鋒裏閒來天上弄秋光落筆便得天顔喜有時片紙出人間傳看一日遍九㕓五侯七貴爭莫致時復揮翰騷人前西風八月吹錦衣生時為錦衣鎮撫掉手還向江南歸汀洲蘼蕪寒更緑木葉時傍孤帆飛回首思君何處切南薰殿裏午風微送徐中行南京工部瘦石亭前倚曉風十分凉意小橋東雨餘楊柳秋仍緑露下芙蓉晚更紅情至怕聞千里别㑹疏猶喜一尊同留都宫苑稀程作高詠還應不負公八月六日周北野宅尊鄉㑹雨不能赴先是豫招客亦值大雨秋雨亦無賴偏欺我與君每當開燕日故作滿城雲未說初春旱何如後夜聞一般尤足恨紅濕從伶裙孝松為故華亭二尹吳君賦君昔哦松古華亭我方挾書游縣城流風善政尚能憶未省至孝通神明郎君京華報君訃握手道邊雙涕橫潛光隱德有如此如君豈獨堪為丞乾坤茫茫日月速斯人已復從先塋塋前鬱鬱萬松樹總是君手栽培成鄉人重君不忍斥指㸃蒼翠歌儀刑秋霜春雨幾悲愴大篇長句何鏗鍧松兮節操本自貞何幸遇君增令名田家紫荆尚千歲何况美與參騫并我歌孝松君敬聽古來萬化由家庭行將東海甘棠樹并入朱絃流頌聲鄉人徐景暉老而喪子遊京師意象悲甚將别贈此子美卿好學早卒早向丹山識鳳雛十年清夢隔江湖偶來聚首驚霜鬢忽漫長歌缺唾壺春雨南洲君號也生杜若夕陽西崦近桑榆扁舟揮手渡江去從此人間謝畏途東海先生有表弟褚君跛一足先生呼為鷓鴣叟輸賦入京求此詩有叟有叟名鷓鴣壯年意氣亦豪疏豪行不顧一足拘苦吟贏得全身癯有兒不令左右扶獨攜短笻朝帝都縣吏睢盱索官租兒職催科翁代輸輸完婦子得寧居老身健在百不虞西風官亭傾别壺亭樹啞啞啼乳烏似是憂翁步趦趄烏不能言意有餘何不啼向吳城隅宋宫蹴踘圖甲馬營中五色光天將一統付真王後園踏踘寧為戲猶有蕭娘卧榻傍宫體四首次良金韻鳷鵲樓深月到遲倚闌閒弄玉參差侍鬟記得新腔去又向花間教雪兒水殿凉多夢易醒昭陽歌吹隔青冥絳紗還有同來伴奉帚金門候曉星領得銀環奈别何更煩同伴畫雙蛾一般昨夜龍池雨偏有垂楊葉上多瑪瑙階邊蛺蝶花玉闌低轉畫廊斜大家近日親經史不向宫門候小車題畫送夏時臣尹龍游紅葉西風吹客衣江邊行李立多時舟師亦解衢人喜橫櫂中流歌竹枝新安鄭氏四節坊衛亂共氏理周興比干封義節本天授褒揚繫皇風閒披新安志仰企滎陽宗烈烈四女士允為男子雄世運有遷革英風浩無窮高閎麗雲漢大字騰蛟龍在殷比三仁於宋齊五忠世有長樂老此地無經從送少師謙齊先生致政歸義興逢掖登庸玉帶歸近來親見古應稀兩朝舊學傳黃卷一代完名映紫微西洛園池增勝槩東城冠蓋掩前輝門墻賸有摳趨地還許相從認釣磯題畫馬吳興公子人中英文學之外百藝精龍紋鳥跡窮變態落筆萬類無潛形畫家難工在狗馬即物計數皆天成平生所見凡幾本如形在鑑影在燈君家此幅得何處真跡似是來吳興前行三匹駿且獰急鞚恐作蛟龍騰一匹顧類未肯行一匹欲卧垂青纓中間一匹骨如堵四蹄猶帶交河氷紫衫奚官髮鬅鬙胡靴短靿帶紅鞓當年內廏事毛仲幾隨仙仗過華清興亡百變物盡化惟有遺跡留丹青摩挲絹素三歎息毛鬛似覺雄風生君不見千金尚買死後骨此馬此人君勿輕塞上謡十月龍沙百草乾嫖姚乘勝逐呼韓關中更有蕭丞相千里無憂給餉難千頃膏腴紫塞秋健兒耕作貴人收金城遺跡猶堪按只在忠良與國謀題松鶴圖為周太守壽同年時敏之父翩翩雙白鶴飛自瑶臺陰𤣥裳既修整縞袂亦蕭森喬林縱逺步虛壑引清音俯仰各有得逍遙清澗潯達人事當世雅志本雲林懸車不待歲戢羽思高尋何異松間鶴飄颻雲漢心嘉誕賓友集初筵列朋簮鳴絲送㫖酒抗節起高吟白日麗華棟簮犀炫鉤金招要香山翁笑傲白雲岑嵗嵗但如此焉知寒暑侵鄒靜修挽詩好景耆年正合閒背堂花竹面樓山祖風田畫交游裏家法王凝伯仲間塵夢一宵驚汗漫舞衣當日記斕斑君以初度日卒傷心玉井峯頭葉誰共滄洲載月還君有舟名玉井蓮陳清泉挽詩永嘉人止齊之後年九十一有子十一人孫五十四人曽孫三十一人𤣥孫八人短世匆匆春夢同蜉蝣蜾裸空西東眼中夀考已如此膝下子孫誰似公紀德前身太丘長游仙此去雲臺翁清風來往鴈山下應笑白髮悲兒童題姜少卿廷憲墨竹草草臨池墨蕭蕭落葉風高情不可見悵望越江東送程克晦篁墩先生族弟春陽遲遲風奕奕灤河潞河凍俱釋河邊官栁千萬株一一長條麴塵色小車載酒沿堤去目逐行舟不能住攀條弄色臨晚風却憶前年别君處君家奕世廊廟人暫蹶霜蹄何足云南山積書充四庫西洛奧㫖窮三墳山深晝長風日美把卷臨流思千里有書數寄南來鴻慎勿待建鄴西風吹桂子秦一元自通山尹調歸善李文瑞索詩送之青雲早折桂林枝鄂渚鳴琴有去思為愛羅浮峯頂月清光猶得照朱絲陳汝礪憲使自雲南入覲升左方伯朔雲逢入覲南紀送歸藩地昔埋輪舊官今列嶽尊氷霜回晚烈風日散春溫定遣炎州物秋毫識帝恩東圃題陳明之菊期南夫二郎日出東軒積雪融菊芽蘭茁競春工君看石畔叢叢碧已辦西風一丈紅吳汝玉自公安赴㑹試以例格不許吳郎自負知何似一落荆南便十秋夜榻偶然同舉酒春風幾處獨登樓名場接軫分胡越劒氣中宵看斗牛已識行藏非在我江湖何地不優游舊例乙榜教職九年許㑹試丁未以就職者少减至六年丙辰入試者多復奏限實俸兩考汝玉坐此空行後一舉仍丁未例月樓為楊尚絅賦飛蓋橋頭踏月華順流東去是君家曉風依約憑闌處隔浦金盆漾淺沙層軒高棟切雲浮縱有闌干不礙秋誰在隔江歌水調清寒重憶廣庭游題王敬止所藏陳明之菊二首雲根翳金英零露雜芳草憶昨南山行相逢正秋曉王郎東使年金緋照雲海封朝鮮賜金帶白澤衣餘輝賁園芳歲晚猶采采菊名紫袍金帶偶書萬事人間不可期雲中日日候來儀九苞自愛桑榆暖慙愧西風碧樹枝魚腹隱刀猶可測牛頭有角豈難知寒泉渴飲真破甑更向青冥學忍飢李方伯挽詩玉節新移自汴郊緘題千里託神交有懷旱歲為霖雨無地青山酹束茅南楚遺民怨芳草西江歸櫬泣潛蛟諸郎不忝長平裔雲路爭看麗九苞書感山陰青裙姥家有雪色鵝右軍往觀之烹鵝候烟蘿入門訪所聞盤饌紛前羅姥意豈不勤客來其謂何相知古云難即此感人多咄哉悠悠者何必皆操戈九十百里半一簣千仞基少壯必有立晚節乃堪持感彼日暮者眷此青陽時婉孌不自愛瓦裂當告誰袁澄夫顧東曙寄詩各次其韻夜歸連得故人詩二妙誰令聚一時感舊不知吾慷慨論才寧合子棲遲花當春半方堪賞杯到愁來只自持只尺龍潭笑游地扶搖今日望天池生世端如雪上鴻一尊猶記别時同雲山有夢尋常到江水無情日夜東未許文章真我輩尚餘禮樂待諸公他年只恐西亭鶴哀怨西風繐帳空東曙有清世巢由恐未公之句送胡仲光分務清江浦計省郎官白髮新掄才元是玉堂人不將粉黛從時樣儘有風流愧後塵淮海又成千里别山林猶是十年身秋風㑹有離羣思還向清江采白蘋送林光甫分教上猶行盡西江是上猶南來五嶺入雲浮官曹不厭詩書冷風物且為山水留虛市早春梅子大畬田初夏稻花稠公餘我欲煩騎馬一訪張公鐵漢樓張東海守南安重起此樓沙陽徐復禮持曹宗孝書來却歸省親還赴南雍秋試劒嶺西南不斷青七峯羅立鳳岡橫絃歌里俗誇新尹江海奇珍見此生逺信恰隨春鴈至歸心先逐暮雲征扶搖更覺南溟近為想西風六翮輕寄壽何以仁御醫用匏翁韻松間倚几逐隂遷竹裏茶鐺掃葉然老去益知閒有味丹成不恨世無傳君子九傳善醫風塵笑我方為客雲海如君更羡仙翹首碧山叢桂底一尊相屬定何年送談貢士拱之入南雍同年雅祥從子陋巷頻煩枉刺箋入門風格故翩然雲衢繼美看諸父璧水蜚英及壯年師友盡觀南國士平安時報上江船清秋桂子金陵月還比長安一樣圓送丁指揮丁將軍家習武身好文一生讀書思致君君門射䇿不得意俯著兜鍪髮如蝟男兒豈必皆明經叔皮定逺俱成名陰山尚有强梁客聽我秋弓霹靂聲送任希賢分教雲和古栝風煙接四明舊家文學最知名任本奉化人松鄉先生之後承恩尚及青氊在懷土潛驚白髮生春雨菁莪遙送喜秋風棠棣獨關情時怡菴助教太學祗應此後池塘夢長共飛雲繞鳳城題書堂二小畫收却吳蠶八繭絲草蟲連夜促鳴機內家見此誰能解游子江南正憶歸蒹葭倚空未老蓼花被水初紅我覺蜻蜓得意翾飛來往薰風兩峯書屋青山相對起我屋住中間讀書有時倦曳履看青山峯頭雲氣來飛翠入窗戶相逢載酒人却度前岡去攤書石牀上偶坐窗前樹微風山半來松花落無數斜陽度西嶺返照松下石莓苔新雨過灼爍炫金碧湖東海月出山半竹窗虛斜白櫺間壁分明見蠧魚明月照前峯影向北峯落幽人夜啓扉驚去松梢鶴湖頭三尺雨峯頂雲一寸雨止山依然琴書得餘潤自有兩峯來幾人此高卧掩卷問青山岩花向人墮春試鎖院日聞刑部奏舉邵郎中天衢任方面衆許作詩送行已而得福建按察副使剡報初傳自棘闈使星今已向東維一時戲語今成䜟兩月清歡合有詩是嵗三月二日揭曉雲近紫垣明繡豸日臨滄海動朱旗還朝便作三年别未放秋霜㸃鬢絲送徐子容下第歸洞庭長安城中十日雨馬首不見纎塵飛羣峰逺想湖上碧一鶴獨向秋前歸青雲緩步更自穩寶劒頻拭還增輝江頭今夕誰共語船窗落月明絺衣何丘山生日㑹以疾不赴西第南樓迹已塵北軒長夏更宜人丘山兩歲頻徙居年華如此便千古湯餅不須愁衆賓炎日病軀妨躍馬緑隂高栁正欹巾一番又負花前醉遙聽笙歌聒四鄰湘水飛雲客有瀟湘意新圖展白雲天邊幾晴雨坐裏日氛氲聚愛桑陰茂行憐鴈影分新年多喜氣五色變龍紋西苑觀太液蓮圓殿古松及進氷者各記以詩亭亭芙蓉花獨出清沚中青天飛綵雲墮此明鏡空杲日耀華色炯然臨曉風天質豈不麗自無桃李容窈窕靈洲逺逶迤仙苑通永謝蔓草纒寂寞甘自紅層城出雲雨其上多古松但觀鬱蒼蒼莫記植者功衆鳥不敢棲恐是跋地龍回影拂金瓦踈枝吟天風翠華有時來綺繡交玲瓏吾聞泰山植恥受秦人封物巨宜有靈時清多幸逢培植不厭厚乾坤固無窮凌人慎時令初夏進寒氷天闕自曠迥龍樓晨更清金盤未及薦洞户秋風生瑶姬玉筍指仙袂六銖輕持玩更調笑柔纎映紅明豈識單衣子衝寒鑱沍溟王漢英通政母八十銀臺先生髮如漆太君高堂新八十朝回迎客花底揖花枝拂衣紅一色折花奉觴拜膝席君家太君藐姑射太君霑醉朱顔溢鸞笙入房侍兒掖後堂歌聲綵雲隔主人留賓還促席青衣傳語催勸客太君萬壽客無出從此年年作生日記取明朝是重七題顔山人畫送劉可大先生歸五羊山人胸中山萬重傍吞雲夢涵太空落筆天機橫復縱須㬰萬象分纎穠大山盤盤雲與連小山江面如浮煙江長山逺望不極倣佛孤帆疑上天高岩飛流散氷雪轉出深林凡幾折上方臺殿空煙霏下界塵囂此中絶林回路轉地益清垂楊一徑通幽亭先生高坐客不去終日扁舟相對樹平橋淺水帶逺村青林茅屋春氲氲兒孫生長不相識雞犬有時中夜聞山人昔年侍明光填門造請皆侯王熊姿犀角日㸃綴局束不奈冠與裳兹圖曠逸知有以無乃賜金歸去放筆臨瀟湘風流太史同州彥乞歸幾奏金鑾殿離觴載舉索我歌不覺飛蠅汚東絹山人山人今有無江湖落日愁煙蕪玉堂揮翰須健手碧山長嘯非良謨北來倘有陽關意好寫瀛洲春燕圖七月十五日久旱而雨同啓衷給事送林宗清夜窗題詩風雨集想得行人喜欲狂領取官河三尺水連宵通閘放歸航左諫聲華日月邊故人身到九重天山中桂樹今無恙好賦淮南第二篇陸儀賓使還過吳省親蕭史乘鸞去千秋尚綵衣來陪雙闕拜行望五湖歸故老爭先覩高堂謝夕違山迎秋晚翠門映海東暉腰䮍金重絡芙蓉畫兩旗舞疑天上别歌聽月中稀仙醴頻添蟻宫羅疊送緋一尊歡不盡又逐彩雲飛題野莊卷秋風吹庭樹落葉滿空除閒尋野莊句感我丘園居丘園正收穫此日樂有餘親交亦相念奈此川陸迂爾莊復何許言在南浦隅同處百里間原田料相如欲往念未可撫時空鬱紆聊詠寄吾志行哉歸荷鋤送石城李先生祭告闕里簮紱清齊出禁林尼山秋色正蕭森雷風豈有金縢警玉帛深懸黼座心此日羮墻親仰止平生海岱快登臨皇華不用歌離别併入新宫播雅音送湯堯德從事西川好去皇華使相將萬里行氷霜烏府節風物錦官城驛騎春山麗文書夜案清成名在年少鄉社莫牽情九日招天章薊北江東路幾千萬重心事别三年官程算得無多日莫為淵明靳酒錢篁墩先生挽詩理學龍門後文章太史公蜚騰當景運簡注切淵衷載筆皇猷潤傳經帝業崇芬華霑草木名姓熟兒童琬琰鐫磨遍川源滌溉空為霖須海內騎尾忽天東往事浮雲改遺書列屋充掀髯懷指授擲埴歎顓蒙悵望仙衢逺追攀逸駕窮南山秋月夜愁斷白楊風進士熊世芳太僕陸獻臣先生令新建時所造士也奉使過家先生賦詩為其尊人壽要豫同作邂逅春風識鳳雛又隨羣彥送軺車人看白髮迎門日路是青雲發軔初壽酒正宜桑落後舞衣猶帶御香餘只應喜殺洪都尹親見揮金為買書彭景武出守過家索詩為其尊人壽振鐸俱成績懸車不待年青山同洛社紅日在堯天名德存諸老勳庸付後賢庭趨看五馬堂集記三鱣天與齡如鶴人知祖姓籛壽杯醲若露仙果大於拳儼雅吳黌像飄搖蠡浦船吳中學舍有生祠蠡浦公所居也聖恩殊未艾玉帛竚登延與原復飲時章宅夜冒雪歸馬上聯句灞橋詩思玉河東客散重城夜向中原復皓白暗欺雲路月清清寒時拂帽簷風原復十年江外孤篷逺清此夕燈前一盞同原復明發趨朝看晴景水精渾琢大明宫清次日夜酌用前韻明朝塵海各西東莫惜清歡此夜中韻好不妨還用雪清杯深那復畏衝風閲來世事常多感原復語到心期每自同清飛矢奪梟成一笑插花猶憶醉南宫原復瀕時原復敗得梟矢而均插花猶憶醉南宫尊酒三年此㑹同原復嘉績已看書上考醉吟何惜到春風楸枰的厯棊分角壺耳鏗鍧矢躍中清回首不堪凝望眼白雲長滿五湖東原復李叔淵父壽七十八學職致仕受封世味真應染指休太行千畝即菟裘天書有寵紅裁錦春酒無時緑滿甌到處煙霞宜杖屨㑹心花鳥自林丘新年八十相將近更伴莊椿一度秋御醫楊信之故宅在玉河東涯有花竹山石之勝時行借居有作次韻滿城車馬此堂閒招隱真堪賦小山花竹四時春不斷琴書列屋晝常關開尊又喜逢青眼攜手還思弄碧潺僕曽寓其北鄰却怪相期數相忤早朝常隔殿西班兵科立御道西記十一月十九夜夢夜夢飛行萬山頂下視黃河如汲綆二句夢中作仰觀明星萬銀餅青天倒垂碧瑶鼎大冶神光赤霞炯我暫窺之百夫警東北𤣥雲突如猛上衝層霄失參井若華欲舒震方炳人間寂寥萬物瞑送原復臘月朔行將過家為尊甫封君夀闕下恩光動錦袍東行未覺故山遙雲當驛路還停馬酒溢春杯擬頌椒歸日諸園花併發拜時雙鬢雪全消何因暫作稱觴客醉擁藍輿過午橋江西傅生復立其逺祖學士初菴書院於其鄉體齊宗伯先生屬為賦詩前朝學士有聞孫能讀家書習舊聞逺道不辭來上國名山時為訪遺文青氊次第還初觀白馬聯翩向暮雲遙憶精廬清夜永一燈還與列齊分次石樓太史和陳時雨大行劉汝中中舍東圃聯句韻病學安心未有方清齊聊欲寄僧廊簷花細雨思公甚塵海西風為底忙薝蔔定應誰共嗅醍醐遙羡獨先嘗石翁妙語清人骨吟斷東軒一縷香庭樹著雪宛若梅花遣興一首朔風吹庭樹歲晚益蕭疏同雲散微雪披拂下寒虛旖旎輕㸃綴芳華在須㬰感此歲寒物念我田園居豈不信假合憑軒亦欣如冬夜德卿希大徴伯過訪良夜賓友集開尊坐南軒華月照兩楹熾炭回春暄妙語入肯綮雅歌振清溫共言㑹晤難菲惡愧盤飱且復延兹賞明發又塵樊雪中思南夫迥碧樓戲簡迥碧新題幾首成無人曽見雪天清晚來劇有山陰興憶著袁安未敢行時雨用東圃韻寫懷兼惠栁木壺矢束矢形裁出薊方幾陪陳榻署東廊時雨寓行人司爭梟解奪由基巧失笑曽聞玉女忙分遺却隨詩併至試投誰合酒先嘗春風有約應非逺拍瓮新醅夜已香臘月草三日飲德卿宅用涯翁齊居聯句韻良游集南園秉燭向深夜盟尋舊雨餘坐想重茵藉墻隂有殘雪鄰酒方索價西瞻太行峯皓白欺二華兹惟藏春塢豈伊淩風榭洪爐赫彤霞餘香裊檀麝窗明疑若空簷短不留罅吟苦愁後成棊勍鬭先下翻思前夕裏高宴久已罷逺鐘送深更疲僕催早駕顧兹蚓竅鳴試我蠅頭寫得雋豪屢揮沈思首頻亞忽看山月高顧影獨驚詫情兼賓主忘氣已芝蘭化諸公信自賢此夕頗堪訝招要入拘牽窘迫自閒暇詞非石鼎工酒罄金罍瀉明朝逐餘歡此榻寧許借除夕招王德馨客舍長安嵗屢遷屠蘇明日又新年共君只向燈前醉免與兒童計後先送僧還妙嚴已未齊居泰魯山僧舍作鶴城西北古招提十載長安夢不迷我正憑闌送歸目君來卓錫話留題邯鄲枕裏三生速瀛海天南一鴈低幽徑小軒何日到碧流長繞畫廊西再賦夜宿端公房念與永公别青燈淡疏櫺起坐見微月野鶴飛無定籠鷹動遭掣翩然思南翔神爽渺飛越精藍古城隈臺殿高嵽嵲幽房回曲徑只尺人境絶公持桑下意我憶雲門襪他年續清游還放西潭枻東江家藏集卷八
