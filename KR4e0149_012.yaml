body:
  text: 東江家藏集卷十二中集八明顧清撰北遊稿詩一百二十七首甲戌郊壇分獻用三江院長韻天郊分職限西東天路平瞻月在空爟火舉時紛列宿燎煙回處肅泠風百神禮秩山川外時分獻天下神祗萬國春生俎豆中遙聽廣庭金石奏似將無悔謝玄功元夕壺隂石潭會西軒用前韻浮雲海內幾西東此夕塵襟一笑空已放銀花開火樹更邀明月共清風江湖地憶他年逺松柏心知早歲同看取白頭黃太史夜燈方下讀書功同年中老而勤學無如壺隂齋居獨坐寄三江我馬今晨已自東入門燈火夜堂空浮雲不放中天月古木頻號别院風夢繞白樓千里逺時三江居白樓宅坐圍紅燭幾人同春來點檢詩多少扈宿陪祠亦有功崔世興宅奉次涯翁韻酒敵棋朋四坐分不知何處是東君屏間拂石疑生雨畫裏看花半作雲王若水畫梨花杏花甚妙白雪詞章隨筆散涯翁席上作草書紅塵車馬隔牆紛平生六一堂前士到處春風挹令芬送宋舜和參政之桂林兼簡時措憲副伯玉亞參萬玉參天説桂山好風明月送飛鸞官評草載朝端美行色三春畫裏看鄉里故人驚會合遐方稚子亦歌歡公餘為有懷人意東北停雲日倚闌施先生希祿佐永州有善政秩滿借留入為宗人府經歷升知雲南姚安府惜其遲暮而喜逺人之得所依也作三絶句送之青衫白髮換緋金二十年來一日心説與南人應鼓舞零陵城下有棠隂三月都城日日風塵埃不見小桃紅青山滿目看行色一雨朝來秪為公燕山立馬望姚州極目晴雲鳥外浮記取他年傳循吏冰天桂海一時收武舉鎖院對月有懷孫貞甫廣庭風柝轉三更坐擁青綾看月生明月故人江外去一尊誰與餞東城洞庭春宴為徐子容太史母夀用已未送歸省韻林屋山深春晝遲桃花成實栁花飛里門駐節父老喜時奉使過家膝下奉觴遊子歸三洞魚龍聞廣樂兩峯雲日麗晴暉不知宮錦筵前舞何似當年五綵衣劉君克柔以親老思歸適有南京尚寶卿之命喜而索詩申浦風煙接鷺洲符臺鎖鑰近龍樓幾年空作飛雲望此日真成衣錦遊潞渚汶河新得雨白魚紅蟹正當秋都亭極目行塵盡恨不相隨並綵舟六月二十五日大雨次盧師邵御史韻快雨頻來溽暑時老夫乘興正臨池不知馬鬛雲頭瀉頓有鵝羣席下嬉到處轉輸應利涉向來枯稿亦堪悲前此苦旱商岩孰與顔車近恭默方厪九五思雨不止用前韻詩成又是雨來時次第南池望北池來詩有庭戶成池之句屏翳可知隂作沴豐隆真以怒為嬉前夕震宣武坊樓頽垣毁壁時驚坐下澤髙原各自悲向晚薄寒侵病骨玉樓深處不勝思雨止十峰有和篇再疊既雨何如未雨時分明涸轍望天池商羊不作庭中舞河伯誰從海上嬉紅日佇聞祥鳳語涼風還為決明悲三江昔歲親逢此夢裏猶懷痛定思雨勢猛驟正如己巳秋是夕師邵隔牆送酒侑以原韻三疊奉酬久雨偏當酒盡時庭前空羡雨成池美人肯為呼牆送狂客何妨秉燭嬉我輩笑談為故事鄰家舂爨有餘悲簷溝又作飄蕭響明日隂晴且莫思師邵以牆頭過濁醪為韻賦五絶句依次答之學有盧前愧居鄰孟氏芳此夕添嘉話雙尊過短牆積雨限來往空齋真臥遊忩中望佳樹正爾屋西頭時小齋新啓北牖美酒餉不辭古調髙難和莫補牆頭缺且放鴟夷過有酒呼牆送此意殊不惡渠將聖者清冒彼賢人濁惠酒甚清賦詩兼酌酒顧我豈能豪味君辭意美終日醉醇醪師邵復以詩送酒副雙尊之句仍以一壺情所寄四句意能多散於篇內因效建除體次第用之招與十峰同飲一室環潦水壺尊空倚牆情馳北鄰彥所謂天一方寄我五字吟四返意彌長能許衝泥過多哉招杜康七月一日招孚若師邵唐信伯周文儀飲效師邵作一雨時物潤壺瓜皆可烹情知飽食愧所樂在良朋寄迹且仁里四鄰多俊英句讀脫陳朽意氣淩髙冥能來共菲惡多謝樓君卿席間呈諸公一月十日雨不休壺藤瓜蔓生蝸牛情知春旱已無麥所可復望秋田收寄巢燕子濕兩翅四散飛落誰家樓句法清雄盧柱史意氣劇為蒼生憂能言有筆斷有斧多少隂妖憑社丘題扇用敬所韻坐愛水木秀間吟招隱詩童子趣歸去前山月上時清風消暑溽好雨報秋成借問林間老應無白髮生雨後獨酌得王鶴坡秋夜不寐詩有感遂用其韻憶昨震雷雨勢欲傾我牀我牀幸無恙己復頽我牆羈人多懷思異形同肺腸與君隔千里時鶴坡在靜海逺邇俱他鄉霖晦動旬浹何由覿天光晚酌西軒下雙鯉忽墮傍願隨飄風去聮坐舉一觴川流正浩瀚我舟不可方會合知幾時仰視雲天蒼還坐三歎息孰云歸路長丁器之將赴建平誦豫乙丑贈歸之作且問原復動靜俯仰十年不勝故舊天涯之感因用原韻作兩絶句送之吳江歲晚促歸船臨發題詩尚宛然時在雲西道院與原復同餞君十載長安如一夢又攜風月過桐川郎步溪頭繫客船家山回首思依然公餘賸有登臨地見説南湖似剡川七月十六日鄉人會餞兩邑新尹於寓舍既罷不寐旋書所感得三十四韻論其格製不足言詩而朴野懇悃擬諸田夫野老之詞或可備詢訪之一二也吾邦古壯縣馳望自宋唐勝國登使府因之啓上洋官曹雖日崇阡陌仍故疆宋季已窮蹙取民猶甚涼報省稅十一萬實徵八萬實納止三萬餘一壞賈綿州買公田加賦再困朱管張籍沒朱國珍管明朱清張瑄名田按租起稅浸淫到國初乃至十倍強兩稅共百四十萬浮名纍仁政有識空歎傷歲徵每不及半宣祖痛裁損官田遞減三之一經綸更文襄民力既以紓賦入乃有常公家無闕事帑廩有餘藏後來諸君子率由如舊章至今鄉父老稽首周侍郎文襄初以侍郎巡撫後升尚書而民止呼其故官粵從近歲來智者好紛更叶或云時世異古法今難行叶或云廣儲積典守為民殃墉坊一以決狐鼠恣披壤但見私稅增不聞公廩穰己巳及庚午諸倉惟棟梁舊濟農倉米常數十萬近歲一空茍能實蠲稅猶或幸小康功名掩慈惠白紙栽青桑都將煙水區指作禾黍場一字挂經費年年理逋亡從此遂困弊蕭然類窮鄉去夏復霖雨湖田盡滄浪監司不肯奏郡邑徒蒼皇荒租二十萬積雪傅嚴霜君子清廟器牛刀試新芒顧此凋瘵餘宜爾勞運量立國自有本為政自有綱不聞慈母子飢寒啼路傍往迹既非逺後賢蔚相望區區閔人窮寢食熱衷腸願見德化成聮飛入明光還將鏤青管濃墨書循良夀定庵八十三用十峰韻繞宅青山列畫屏磨崖到處可鐫銘神仙上界猶官府塵海中間幾醉醒髙詠雅情追白社逺書精札亂黃庭年來兩負中秋會遙聽笙歌入翠冥和盧師邵中秋馬上作美人宴罷玉京城歸騎垂鞭踏月行風露九霄紛滉漾山河萬里共澄清却思江路經年别直恐冰輪未曉傾安得淩風馭仙驥桂花相倚看吹笙崔世興宅會餞白巖宗伯限韻作北來行李半圖書歸去詩囊滿後車雲海尚留今夕暇絃歌尤愛此堂虛謝公把酒梅應笑絡秀生兒玉不如時白巖初得子回首舊遊心歷歷江風江月正愁豫趙爾錫席上限韻送前人莫遣江樓畫角鳴明朝樓外有人行清尊石鼎連宵話逺道江雲十載情黃菊尚餘金谷酒青山故繞石頭城遙知落日浮仙棹潮送寒流似掌平送吳棟卿謁告歸兼簡黃克明胡希文二太學擬向清江聽棹歌好官無奈病身何思山夢繞沿洄路拜闕恩承浩蕩波靈藥可尋寧憚逺舊書重讀不嫌多胡黃二俊知鄰里想見尋常載酒過錢御醫仁仲父母夀詩錢鏗之孫老不狂讀書賣藥吳市傍賢妻八十古孟光裙襦相對和以莊夜燈密線針如芒膝前佳兒五綵裳手攜刀圭倚明光三年不見心倣徨春風回首吳雲翔盡遣妻孥歸奉觴要我作歌歌夀昌君家恩寵未可量老人之夀亦未央君不見前星掩耀今十霜幾夕紅光流畫堂君工小方脈故云十峰約陪喻府君夜坐明日有詩次韻落葉風軒暮已扃偶從華簡挹蘭馨情深舊雨連今雨興洽花瓶亂酒瓶化俗無心魚在水翀霄有待鶴梳翎醉來更覺盤菹美欲向齊奴問韭萍移燈賞菊和十峰寒叢可似浣溪花也逐銀燈上碧紗滿地月明搖墨暈一襟涼氣拂霜華旋浮緑酒須拚醉遍插烏巾未當奢却恐夜闌人欲睡寵光明日拜公嘉送衍聖公用涯翁爾錫席上韻振鷺歌殘駟馬鳴蓬山燕罷錦衣行西風逺道三秋日落木洄淵萬古情别卷荐賡懷麓韻前旌應過子遊城川流夙昔知安穩極目晴雲到海平盧師邵宅會文太僕宗嚴用鳴字韻童子垂頭蟋蟀鳴詩聮不斷酒頻行青山夢繞來時路黃菊香留晚歲情一斗尚堪呼我屋五言誰可犯君城明朝共約慈恩去為聽驪駒意未平宗嚴先有此約是夕束裝故云小軒山頽輦置涯翁園亭石齋少師繼有太湖之貽翁喜有詩山成次韻奉賀頽然不肯駐荒臺移入名園始快哉竦立正當青嶂近靜觀疑有白雲來池亭緑野添幽致斧鑿龍門想舊裁得與奎章並題品也勝尊酒為渠開翁謝石齋有奎章閣裏千年石飛墮西林水竹間之句辨公以詩謝香次韻却寄有跋澄湖樓閣帶重江雲影天光動八窗髣佛夢中曽一到棹歌驚起白鷗雙青鞋布襪是家常猶欠雲門一瓣香心識廟灣橋下路來時不擬問漁郎誰説詩人鬢未霜芬華久矣謝春芳灰中芋栗能分我只與江湖作漫郎拔足紅塵九十霜雲西自作水仙王他年為續三生話元老東坡本一鄉得詩之夕夢與髙進之乘舟入寺豫欲觀假山一僧導過東廊折而南行遇異獸而寤首章蓋紀實也第不知假山果何在爾紀之以備他日一笑宴别喻府君用定庵韻詩人且莫賦民勞萬事分明繫我曹試看吳鄉幾蛙竈何曽渤海暫牛刀時北州江西多盜賊官評不爽民心古輿論無慙素履髙已是邦人凝望久且拚今夕醉松醪客路深知歲晚勞檄書先已被東曹遺民正望行春馬歸夢猶懸午夜刀黃霸賜金偏得厚于公車蓋轉應髙日斜風力欺人面更盡雙觚玉色醪兒子天彝病起有詩報信用韻答之南州多暖北州寒十月黃花錦作團獨把一枝情萬種見花何似見人難薄晚天風特地寒小忩思汝坐欒團醫方可是全無效却是尋方對病難霜月中天樹影寒繞階風葉走團團此時獨坐心千里誰信來難去更難怒作火炎憂水寒崑岡成炭水成團須知醫學通儒學兩字功夫養性難和陸時敏客中寫懷隔牆車馬漲紅塵睡起東􅖠一欠伸朝謁懶從多病得笑談情有故鄉真汀花岸草牽心逺社燕秋鴻過眼頻莫信洛陽春似錦洛陽元是一般春蜉蝣豈見海成塵尺蠖寧知屈是伸自古風花暫時好由來傀儡幾曽真道途信我從橋便功業從他覽鏡頻幸有一觴堪對舉不須遙羡隔江春諺語江南望見江北好宣城徐士元浮沈州縣二十年始有南臺之選其閲歷多矣將能為國家建久逺之䇿而不詭於玉石朱紫之辨乎故詩以敘别而不及其他美人家在古宣州少日曽同白下遊青眼十年重酒盞緑波千里又官舟江山近識桓生馬風月平分謝眺樓無限離情與鄉思暮天雲樹滿汀洲朱文宿侍御移居東鄰與孚若過訪席間聮句得二韻明日足成莫厭移居客過頻為君深喜得芳鄰孚若詩書二十年前會鄉國三千里外身文宿河水未冰魚正美江船近到酒猶新獨慚蹇劣非公輩還許青雲接後塵清冬夜四清次孚若韻煮茶未有金犀辟夜寒每蒙龍鳳賜宮團玉牒所月有官茶自分玉嶺千尋潤小試春旗一葉單屋裏松濤從地起窗前梅月幾時看飄然便欲淩風去清淺蓬萊水又寬焚香小閣垂簾夜不寒縈空一縷碧團團芳菲似與梅風細縹眇應憐鶴夢單名重水沈催試取火微雲母自添看明朝滿眼金爐畔朝退還攜兩袖寬奕棊楸枰的歷曉星寒熊虎貔貅各就團稍出偏師當一面從教空國戰三單雄雌漢楚危時決黑白商顔靜裏看自是人間有機械先生心事本來寬賦詩灞橋驢子雪衝寒東閣梅花玉作團思入空雲千態變巧爭天女一絲單芬華肯逐當時好真相還應具眼看尚有一篇煩束晢玉缸春酒夜來寬十二月一日寄書天彞有感用煮茶韻一冬今夕始知寒起斫清冰試小團水品無勞問鴻漸火攻聊欲效田單腸間古字搜應遍灰裏仙書默自看好辦百株供歲晚歸期報與客心寬先母忌辰有感用前韻遊子天涯感歲寒夢回清淚欲成團人間空想萱枝茂地下誰憐鴈影單時聞二弟訃衣線密縫猶有在兒孫滿眼若為看三牲列鼎嗟何及慙負皇恩似海寬和白樓祭酒遊獅子山盧龍觀登閲江樓故址二首金猊作山雄踞蹲異境靈蹤不盡論澗戶雨晴浮玉氣石壇春暖長龍根三峯逺勢分襟帶九𣲖長流入吐吞一自陽春傳白下幾回江月夢黃昏名山嶻立大江前聖祖宸遊地儼然宫樹戴雲猶五色澗花回輦欲千年樓臺極目煙中市犀象連艫海外船無限平生登覽意蒼崖須繼白樓鐫談以嘉寄友山墨竹求貞庵詩衆水必返壑萬木終歸根乾龍抱四德維貞乃生元談子魁傑士詩書富鑽刓汗漫四十載及此見本原浪迹混成市深居乃丘園逝將遊化初豈止超籠樊神交友山翁遺墨寶璵璠緘題逺寄我知君未忘言長安日出餘車馬闐朱門清言頌夔契髙步趨炎軒紛紛未渠已兀兀空自煩引領望五茸髙雲碧巑岏衢陌轉紆曲軒忩開晏溫登樓喚雲槎隔巷招南村二君以嘉鄰近文字交也逍遙共水石嘯傲同琴樽以兹遂百歲誰知軒冕尊彭城王肅之自分守疊茂擢湖廣江西參副入掌京營拜中都留守天立三京鞏帝圖濠梁千古漢枌榆河山結秀猶龍氣留守承恩重虎符萬福威名聞草木班超功業在羌胡他年併入雲臺畫爭看貂蟬映美鬚奉和涯翁聞雪枕上作啓户兒童有笑聲一冬無雪雪今晴却思叢竹應薶沒戲剔殘燈與鬭明江上小舟還自泛屋頭春鳥為誰鳴輕雲薄日新題句總是商巖未了情夀王艾坡西湖東畔甕山阿靈草年深緑滿坡林壑為公增媚嫵杖藜終日共婆娑天生夀骨如彭祖人道醫名似華陀聞説新莊更幽勝一尊還許醉煙蘿和施聘之十五日退朝作漢闕朝回地蓬山雪霽天鳳瞻雲外輦雷想殿前鞭緑漾銅池水青浮綺陌煙太平公等在未可讓前賢御溝北岸冰合而南岸水流前此未有送陸時敏分教建安怡柑堂下菊花前把酒攤書四十年感舊不知吾老矣憶歸翻為子欣然吳山越嶠行千里雲谷滄洲賦幾篇往問諸君定相識蒼崖似有姓名鐫往嘗為此邑記修學長安新街成次師邵韻七寶宫城玉斧修斬新天路快同遊平看白日行龍角近覺青山在馬頭禹甸會來凡幾譯康衢歌罷已千秋何當四海均如此水宿雲飛各自由乙亥元日十峯飲師邵東齋出豫家桂餅師邵有詩自牆上遞至次韻奉答寶鈿和露壓金英為趂秋光一日成月殿有人留素影花林無物稱佳名餅有嫦娥蟾兔形天香狀元紅等字攜來不覺鄉關逺吟罷猶令客夢清茗碗酒杯皆可意好將新歲作傳生唐人歲首飲酒名傳生明日師邵有牆上傳詩之作次韻似有虹光射屋頭不知人語夜堂幽呼牆忽得淵明信能賦真同子建流便擬續貂噓凍筆却慙燒蠟變更郵玉堂本與蘭臺近珠璧尋常豈外求師邵舊有詩云買宅誰家近玉堂師邵出意作綸竿于牆上以便遞詩名曰詩釣首倡一篇詞意兼美依韻奉酬巧心文思孰兼長詩釣詩成又幾章千里浮沈謝江路一竿風月共鄰牆君如緣木求魴鯉我正懷磚想珮璜畢竟兩無名利念五湖煙水舊同鄉翰林齋居和十峯聽琴二十四韻王春重禋祀齋居百工休寥寥古槐廳無風亦蕭颼落日衆鳥歸感我林居幽起步視天宇明星一何稠賦形穹壤間豈不誠有由鳴鳳跂阿閣鳬鷖散滄洲雲鵬與斥鷃各自從其儔與子昔少壯挾書隘鄉州坐談輕白璧髙步希丹丘雖懷黍稷愧稊稗亦已秋䇿名二十載實也非吾仇重來歲云暮庶以追前遊卜居幸仁里欵洽皆名流側聞官評美信爾學殖優載觀聽琴作騷選合並收朗吟向清夜何止消百憂惟此清廟器流傳自虞周南風既廣大岐山亦優柔共惟千載意歷歷心與眸箏竽亂人耳此物委道周不逢君子徒竟作空山舟朋遊本沙聚歲月亦川流鍾子既長往雍門今白頭惟有十樣箋可以修龍樓時以吳箋同往西軒夜坐各賦一物孚若得瓷甌師邵牙筯文宿銀􅊦豫得紅燭停停雙紅燭照此清夜闌主人為無寐佳客得盡歡玉蟲落金叉絳蠟縈銅盤願言四座光昭我一寸丹慶成宴上作和伯明侍御郊禋又喜一番成金殿晨開淑氣迎風裏旌旗揚日彩雲中金石應春聲十年正德當熙運萬國傾心仰聖明既醉有詩還索和併將無逸頌升平承天門迎駕和九和殿講燔燎中天報禮成六龍回首萬人迎天應不斷酬豐歲臣也何慚繼頌聲五色畫旗風裏掣九斿雲罕日邊明羣公不用頻瞻望皇路年來似掌平再和九和宴上作紫壇殷薦九功成黃屋初筵百福迎千羽盡消豺虎氣簫韶齊作鳳凰聲條風暗逐龍樓轉遲日偏當黼座明報與萬方須鼓舞泰階連夜十分平次韻伯明謝九和燈圓火蛾市裏珠論斗麵繭筵中芡滿盤猶記薰風初作穟不知春雪解成團圓疑藻井重光漏美在靈砂一粒丹食罷鄉心渺無賴江樓燈月好誰看待隱園為邃庵冢宰賦先生竒才天下聞先生早達非隱淪名園十畝手自闢逺意正在桑榆曛蒼生日夕要霖雨碧山豈得留間人君不見晉公緑野晚始就魏公老圃當秋芬人生適志亦有日彈丸梟炙空勞神隱待園園待隱塵海茫茫幾時盡會須重夢竹間翁煙雨春風謝招引天秩讀書靈濟宫有懷明燈照尊酒舉觴情不怡去爾復幾逺而當懷别離男兒四方志問學乃鎡基弱齡逝已邁盛年方及期離憂與志養輕重理不疑仙宮晝無人况此良夜遲清心照千古澄慮徹萬微豈徒美藻翰立誠其在兹我壯已失學守官愧無為庶幾子復孫努力酬恩私體我對酒意惜汝當春時無令金根子空負城南詩分得鐵面送施聘之南巡使君清冰心其面乃如鐵冰心與鐵面表裏雙映徹鮀朝莫我媚賁育莫我折端如九鼎峙神姦過而滅又如明鏡照百里見妖孽前年按東關邊圉方狡猾聞聲已宵逝况敢􅀈旄節今年復何事豸角指山越朝辭詣闕下風采動班列想當顧盻間狐兔已無穴頽風煽末世瀾倒不可截羣情愛軟媚衆目憎泠洌安得公百輩共把霜臺臬梟除鳳乃至莠盡禾始活君心與君面天為蒼生設往哉慎所向嚬笑有窺竊觀梅奉和涯翁韻雪深江路記橫枝二月京城始見之逺客有情頻借問孤根異土不同時修篁此日方求友穠李當年亦費詩應是晚風偏愛惜故飄香蘂落金巵扶風令孫汝宗檢討季父也扶風有健令戰死略陽城略陽豈無令城破儼冠纓飛章報主帥盡掩張巡名天監日月昭狐兔可逃刑下詔贈官爵推恩及孤􅑱忠憤一以雪義聲若雷霆回看略陽子澌滅無留形生世豈不死所貴死有稱漠北拜蘇武隴西慙李陵我歌扶風令永激晉代英趙恆齋挽詩都御史廷實之父黔江教諭致仕封濟南知府宋宗室也問族王孫貴名家理學宗黔江初振羽稷下晚疏封餘澤流忠孝隆恩賁始終西山春草合無地躡仙蹤聞劉南村將至先寄正喜牀頭新酒熟忽聞江外故人來不知靈鵲誰傳與閙亂簷前日幾回次韻石東滹都憲詠臺中松竹二首傲霜凌雪到參天曽見春花幾度妍光引赤墀朝上日秀分蒼柏晚來煙人疑靈物風雷變我視孤根鐵石堅何待他年歌蔽芾大夫新律自超然撫遍簷松偃蹇枝小忩驚見玉參差却看塵土無容地似與琴尊有素期聲散午風醒客夢影分涼月動吟髭虞庭正議簫韶事莫遣伶倫左右知張麟慶澤堂江水東流入海深水邊華構百年心行人未識君家世看取堂前喬樹林題畫小艇臨江岸綸竿只漫垂無魚亦歸去不到雨來時與南村夜話用周伯明韻兼寄時行江海重來二十春中間人事幾回新朝端我正懷莘老南村忠肅公裔也谷口誰當畫子真吟倚石臺雲繞足醉褰風幔月迎人扁舟便得從君去先過張翰覔紫蓴南村歸興十首上林煙樹思家千里夢戀闕萬重心欲去頻回首煙霏滿上林潞渚風帆岸添山雨闊帆送曉風輕利涉從兹始遙遙思帝京岱嶽瞻雲雲生岱嶽頂秀結魯城隂仰止嗟環轍千秋萬古心呂梁觀水奔流形道體絶壁見神功去去吾休也危途一夢中淮隂弔古綸釣貧難忍王侯貴不終江邊有行客歸興十分濃金焦覽勝自有兩山來幾人此經過青山默無語識人知最多惠泉試茗攜將雙鳳團來試九龍脈臨流啜花磁更憶長安客松陵倚棹倚棹虹橋下涼風吹葛巾家山看漸近魚鳥自相親三泖垂綸扁舟下三泖試拂舊綸竿鱸魚三尺雪飛上水精盤五茸秋穫田園正收穫行李忽在門此樂不可説令人勞夢魂前題次十峯司憲韻有跋錦作坡陀繡作叢四時晨暮鬱蔥蔥梧桐夾道飛丹鳳楊栁平沙散玉驄萬歲峰髙空翠裏廣寒宮起蔚藍中行人擬得相如賦拜賜江南作隱翁南客扁舟欲去時好風真與客心期雲邊已似見鄉社篷底從教卧水師行路一番嗟往事詩篇幾處有新知飛來燕子不相識却上沙頭楊栁枝篷底哦詩正寂寥忽看膚寸起岧嶤回翔未欲淩霄漢津潤先應及楚翹五彩何年歌爛漫九農今日願豐饒河陽舊事還堪省幾度秋霜換斗杓彭城天險亦岷峨南北舟航倍幾多激浪奔流無日夜長年三老費撝訶試看急纜牽危舸何似方塘湛緑波欲趂此行銘劒閣蒼崖先遣百人磨泗亭秋色已荒涼更擬淮隂一瓣香飛鳥未隨弓力盡黃流差比劵言長榮華自古能誰在山水無情默自傷一語到君尤足恨湖頭空負碧霞觴淮有美酒而南村不飲故以戲之又復扁舟過此中向來明月幾弦弓山形依舊兩眉緑江水無塵一鏡空白鳥去邊天欲盡青楓落後歲將終圖經漫有新題字一笑煩君問雪鴻近曽序京口三山志囊裏探春粟粒芳松間敲火石泉香從來乳酪風斯下此日山林意更長定有詩篇記清賞誰從杖屨合分嘗吟成更作東南笑極目龍山入杳茫鴟夷不見五湖舟香徑真成麋鹿遊客夢幾回空歷歷江流千古只悠悠天隨釣處堪終老張翰歸期不待秋記取一時生色畫蘭橈斜倚白蘋洲湖水泖水分濁清漁舟客舟誰重輕陸機張翰舊同里仙鶴鱸魚並有名長笛數聲江月曙青山九點暮雲平一時盡落先生手未信煙波也世情君來三吳占有秋君去正及吳田收簑衣但除雨淅瀝衲襖不怕風蕭颼煙中白鶴呌野水竹間黃耳眠髙丘眼前此地亦可念舊來總屬華亭侯豫既為南村賦歸興十絶句且序之矣六月九日景安席上誦十峯詩歎其雄麗南村起屬豫和之豫醉不知道何語既歸而詩卷至矣度勢不可已勉強為之貂尾蛇跗明有禁戒知君愛厚有不容於不盡也十二日書初伏喜雨次未齋殿講韻老火淩稚金乾坤鬱爐烘田農望時雨十候靡一中商羊踏兩翅玄豹隱塵霿蒼頭揮巨箑却立嗟腕痛此時天公心髣佛為爾動驅雷駕長雲橫海截明蝀初開瓦溝瞥忽作渠溜閧淙淙殊未巳密密欲無空兒嬉集堂坳萬斛試一㔶老夫病不寐還作江海夢青秧間白水碧樹黃鳥哢絺帷涼到骨翻恐墨池凍起來望西山雲氣猶澒洞回翔如有意邀我作詩送須臾朝陽照五彩變龍鳳巖巒數百里眩晃莫摶控輕隂拂髙城餘潤溢朱棟蔬畦及稻壠盎盎流乳湩即看禾連箱已覺虀滿甕坡仙記新亭妙語託深諷驪珠與肪玉至美等兒弄此物方施行我道堪哀慟清風頻戒秋炎令將過仲河流滿諸閘日夜走方貢牀頭幸有酒一笑且從衆夀定庵先生用周伯明韻八十從頭四見春年來詩筆更清新不知後進誰堪繼頓覺仙才自有真逺道風塵頻入夢清時林壑也須人橫塘八曲中秋燕正得銀魚配紫尊悔軒宗伯將赴南都出山水橫幅索題上有敬所詩因次其韻君不見長安列第羅金屏山亭水閣紛縱橫洞門落日煙霧合回轉天地迷隂晴又不見岷江五月蛟龍怒雷奔直下空舲渡千鈞一髮寄黃頭只尺頓殊人鬼路川平山逺畫者誰曠朗一洗豐肥癡塗行室偃各有適此意只許堯民知綸竿未挂珊瑚樹誰識先生會心處行看巨舸濟中流且為江山發新句次韻馬文明光祿和馮子佩雨中觀蓮山花何如水花潔江鄉又作三年别銀潢一𣲖寫秋光緑浪紅雲幾明滅孤標不藉闌檻護皓質豈因泥滓涅江梅衝寒面如玉巖松積歲髯疑鐵清嚴淑麗各有態根性已是多生結銅池碧影落天鏡東軒未到吾能説一泓便有五湖意造物信可兒童竊翠盤跳珠散涼雨夢回曉枕聲未絶恍疑誤入水仙府萬隊紅粧擁旌節鑑湖終期明主賜雲錦只恐天機撤書生儉算亦有計勝賞直與吟詩折以詩寄師邵御史戲書其後新詩寫寄樂天賡斜日虛簷坐晚晴莫道間官無一事揮毫還記唱籌聲翰林孔目無印記月俸出納皆學士親之奉和涯翁西郊觀稼是日得鄉書有感江鄉為别近三年沙水頻侵栁外田多稼喜聞西郭詠清風正想北樓眼家居值水常坐卧小樓深村野老藜羮飰華屋佳人錦瑟筵欲問從來調燮事黃花開滿夕陽天杜古狂夀意二首杜郎胸中富丘壑筆墨到處生煙雲名髙價重愛者衆入眼太半疑非真君家此卷得何易無乃意氣相感此老始肯留心神洞門隂隂六月寒石角下墜臨奔湍湍崖逆上不知幾百里别有琪花瑤草爛漫無由看仙人宴坐長松下風髯飄蕭貌間暇山童拾得紫芝歸笑指蓬萊問靈駕靈駕參差曉未還洞庭林屋有無間風煙不雜人間世雲氣遙通海外山海外相逢今幾秋蟠桃一熟歲行周主人六十正年少更約花開尋舊遊東華老人七十強全家舊住古錢塘湖山繞屋凝清光聖人北狩開明堂雲從金輿飛渡江爾來百年雙闕傍老眼厭見車塵黃心思湖山歸路長髙堂曉日懸蓬桑湖山忽在堂中央瑤臺仙人古衣裳飄蕭鬢髮臨匡牀松風吹花滿山香麻姑逺來稱夀觴身騎白鹿青絲韁仙姬一雙婉清揚金桃玉醴各有將青鸞飄搖雲際翔阿母欲下雲蒼蒼老人再拜承夀昌吾皇夀域開八荒雲飛川泳皆康莊千載白雲還帝鄉何必湖山懷一方嗚呼何必湖山懷一方師邵以南村歸興韻賦鄰好十篇奉答借書君書自充腹猶有臨淵心撫卷惜年少悠然懷故林送酒庭下兩尊緑牆頭一竿輕無詩可充釣積甒空如京君嘗作詩釣牆上故云鵝鳴不學雉登木還同鶴在隂憐材復愛客無那主人心雞唱子聲豈云惡我食慙無功懷哉祖豫州起舞深夜中訂交昔賢重交結在始不在終君看千頃波寧作壺醴醲請益我壯本無似况此歲月過垂槖視稇載其誰得之多鄉語石湖到崑山中帶淞江脈却被幽薊兒呼作三儂客文會芳鄰盛文會老我亦濫巾却憶西亭子寂寞誰與親時施聘之以事下獄兒啼驥子墮地時送喜憑郵竿聞聲想神駿舉足凌九盤君有河間公館聞得子詩詩債舊卷擬立案新題更分門何人為剪紙一返皮陸魂師邵每有詩督和甚急九和侍講嘗題其後曰立案而還之聞者大笑既用以賦詩債復次韻嘲之新篇落筆遞酬賡不放秋天幾日晴時正多雨只有未齋新例好且教風雨暫停聲永感堂為同年王威逺賦時自鄖陽入朝過家上冢客意逢秋自感傷還將此意賦君堂兒童豈識晨昏樂老大空驚歲月忙閭里有人誇晝錦乾坤無地答春陽惟應一點忠貞志青史千秋表義方中秋夜客散步月中庭忽憶陸舜卿南歸乞詩索筆書贈髙飛獨鶴想華亭出海冰輪到曉清林影波光四千里看君一路鏡中行東江家藏集卷十二中集
