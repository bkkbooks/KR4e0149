body:
  text: 東江家藏集卷九中集五明顧清撰北游稿詩一百五十二首庚申齊居和錢世恆僉憲頻年僧室共郊齊引接多慙降等儕詩老漸看過大歷語真時復到無懷好風先夕知清道朗月中天想燎柴明日衢尊又承慶還同既醉舞堯階慶成燕和張南山日髙仙蹕殿東來鵠立簾前候扇開舞隊夾門參馬象衢尊當陛繞雲雷寵承天語親教坐清列卿班獨許陪時鄉人上殿者惟先生連日玉河驚紙貴遍傳新製咏臺萊前題奉次侍讀白先生韻紫蓋前頭擁八鸞日華流彩映天顔升中慶衍三朝㑹供奉筵髙六品班衆樂送觴仙調緩諸番入隊舞衣斑明朝齊和陽春曲誰復周京詠北山和孚若詠雪三首微陽猶伏地中雷寒勒江雲勢未回啁哳漸多籬外雀浮沉頻撥瓮頭醅占年有喜先知麥擬賦無能且用梅曉起江山盡銀海更容神女著蘆灰簾旌不動曉來風一刻瑶花滿太空神用莫窺龍變化幽蹤誰别兔雌雄先生東郭行應遍公子西園興未窮便欲君王借千騎夜驅殘甲出雲中書生裘褐自無兼雪意連旬未解嚴天上爛開羣玉府人間那有却寒簾簷棲白鳯遙分勢闕映蒼龍已沒尖能賦只應輸子建百篇信口不停占再和煮雪雪山二首玉鉉金觴未許拈陶家風致我何嫌雲英一化春無跡乳腳初翻火正炎真樂故應兒女笑清歡那得故人兼陸器之號煮雪時適冇書風窗細啜詩成後何物中邊數蜜甜羣兒癡絶不知寒搏雪中庭作幻觀忽訝海波晨湧地更疑華頂夜憑闌斜侵院竹驚枝短清逼臯禽覺袂單不用孫龍較同異浮生只合此俱看並蒂瓜榴為錢世恆賦錢時未有子瓜蔓逺更碩榴房寒始紅由來重嘉實不必當春風君看小山植朱碧秋重重間出或偶爾俱駢豈人工必有千里駒為君叶維熊如機雲軾轍方駕凌紫虹善頌敢云我深培本緣公他年記父執無忽丹青功元夕匏翁宅次馬宗勉少卿韻瀛海風光自一家衣冠此日共清華奉常彩筆飛千兔學士銀屏簇萬花時初設屏燈看到春城無此盛傳來郢曲拜君嘉賔筵喜氣晨猶在散作東園五色霞再和匏翁韻玉署東來第一㕔元宵燈火燦銀屏青雲幸接諸公武白雪猶疑隔嵗聽江海幾人思舊雨煙霄此地拱繁星寧知起草明光夜别有金蓮徹曉停遣天彛歸省遣汝寧容易髙堂念久違書將錦字寄心傍白雲飛幹譽知吾意承歡羡爾歸有懷言莫盡愁立到斜暉地是承家重年今抱子餘出門初託汝念别正愁豫鄉黨先親舊川途慎起居由來榮故里非必在髙車吾家寒薄味汝頃及親嘗莫以花間日都忘葉上霜容儀師抑抑裘馬戒揚揚自古謙恭子名髙祿壽昌槿花隨日殞松柏入雲髙樹德由先世霑恩到爾曹親賢衣襲麝從惡火消膏看取盤中粟耕耘亦甚勞八年違故里此别更懸心伎倆人看汝承傳始自今羅囊知不帶緗卷亦時尋勿忘臨行語風來竚好音和良金詠雪白戰功成四百年騷壇弧矢到君拈中天屢合鴐鵝陳小帳猶歌阿鵲鹽弄影月娥回縞練散花天女斂柔尖不辭强步同髙韻鴻跡春來幾處添送陳瑞卿還臨清為其子天澤賦驅車戒行邁復此官道周昔來氷雪交今還風日柔青驄繫柳枝好鳥鳴相求冠蓋羅四筵眷言各綢繆感此自難别况懷瓜葛憂清源雄劇地南北當襟喉選代苦不易眷毗良以優暫割骨肉恩且為旬月留長安富車馬遲爾看來游送東平守張元之赴黎平東州棠樹好又剖越南魚地域衡潭盡星文翼軫餘長才須歷試逺俗賀寧居已有侏􅍣子循山候隼旟嘲衛景玉聞說城西射鴈歸水清沙冷鴈高飛將軍不是無長箭為惜春風好羽衣附景玉和勝日西郊縱獵歸兒童爭看馬如飛先生莫笑無長箭元凱何曾貫鐡衣題張通判春江載月圖月出大江平仙舟上國行回帆混天影發棹動春聲逺樹光疑濕虛窗夢與清知君濟川具聊復試初程送李徵伯之曲阜逺游君未曾發軔便東魯平生仰止心一往了千古尼𥅆本通家復此締姻與豈徒升門堂行且窺奧序君才自豪宕雲夢口吞吐兹行信天假為爾闢襟宇冥搜窮日觀曠覽極鼇嶼必有浩蕩辭凌風振珩瑀念君千金軀垂堂有前語聖言本非外吾道足自取歸哉慎勿遲髙堂念風雨又次錢世恩韻問道趨東魯聨輿有稚圭時知德同行侍闈看乍逺吟舝動還齊觀海雲浮地登山月傍梯預知篇翰富雙從錦囊奚訪陳時雨不遇次劉文敷韻童子應門語自真京城投刺多門者例稱不在錦囊何處覔陽春劉郎莫歎空歸去更有斜陽獨生人書所見垂楊十里拂金隄走馬東來不記誰飛虎兩鞬搖玉帶盤雕雙袖蹙金絲馬首東風吹柳絲碧桃紅杏鬭芳菲游人不是金丸客說與流鶯莫亂飛毛閒翁百嵗預壽天子十四載昭陽紀靈辰間翁壽百嵗弧筵啓青春孫子天上歸板輿奉慈親扶携獻春酒盛事傾海濵我明始馭宇元氣㑹九垠歷嵗三十餘六合熙同仁翁實生此時所得固已淳葆真遺世網委順隨化鈞自從結髮來白首如一晨譬彼凌寒松本異凡卉倫動息有至理往來無雜賔閒居談往事聽者疑古人嘗言十六七文皇當北巡金輿映朝日目覩天人真自攀鼎湖龍五拜重光新雖微海田變冠蓋幾湮淪念此勸翁飲無負尊前身南山晚更緑時菊長精神悠然東籬下想見無懷民願得假羽翼杖几承清塵作詩預為壽轉盻鶯花瞵從今嵗一篇積卷如車輪兵部侍郎楊公挽詩名謐乞歸未許更承恩總為朝廷仗老臣帷幄尚紆千里策氷霜已瘁百年身中州清氣還嵩洛後代公言屬縉紳一卷崑山去思録便應談笑離風塵壽劉碧窗同年文敷尊人半欹烏帽引清觴無奈斑衣繞膝長百嵗好懷當此日一年佳節尚重陽黃花近竹深承露緑橘辭林淺帶霜既醉有詩還自慶只應身健詠時康題潞河别意卷兩字功名一劒歌舟航南北亂機梭夕陽沙上流連意只有青山見最多春江漫興人間七貴五侯江湖蒻笠羊裘細雨鴛鴦沙上微風舴艋船頭儂家五湖迤東此意於君更濃一𣲖桃花流水十年馬首西風為杜庠題山水橫幅屋頭衆山森㦸㦸屋下寒溪深見石溪流循山若縈帶别館離亭紛向背茅堂近水景絶幽繞簷萬竹風颼颼主人自得濠上意終日俯檻臨寒流東寮把酒呼促席隔屋糟牀晚猶滴清談北館風滿衣折梅寄逺情依依山童晨起掃落葉不知松露霑荆扉經營布置各有態頗學畫者勞天機東吳杜郎江海客覽勝搜竒遍京國家園十畝畫不如猶向丹青愛陳迹西風八月南鴈飛扁舟逺自長安歸髙堂無事兄弟樂終日雞􅎟要鄰比新圖便是君家事何必區區詢畫師送友人清凉國裏列仙儒坐擁溪山畫不如黃卷上堂朝日後青襟分閣晚燈初晴嵐捲翠遙侵户瀑水分光欲浸裾便欲從君尋九曲隱屏仙掌更縈紆為潘克承題林良蘆鴈林郎花鳥今代竒水墨到處皆天機長縑濶幅信手揮妙處不屬丹青圍江頭雨深菱荇肥枯槎折葦紛離披鴐鵝羽冷畏逺飛雄雌兩兩相猥依靈苕翠羽不自危鴝鵒噤語晞𤣥衣依棲俯仰各有姿乍見幾欲呼鷹師乃知此老筆不疲市朝山林時見之雞林相君知白詩君家此本吾無疑北風漸髙禾黍稀雲飛日見江南歸吳江洞庭三泖涯天空水逺無拘羈焉得扁舟從爾嬉送劉宗哲進士尹束鹿長材宜德選望邑麗神州黃甲非身貴青箱本國謀絃歌深里巷雨露足田疇矯首西山月清光夜夜秋孚若時章約九日廣恩寺登髙雨不及赴白雲觀西紅葉堆重陽有約携尊罍游人不出看白雨老僧閉户生青苔乾坤此景復幾爾造化於物何亷哉未能騎馬且獨酌菊花許我明朝開戴溪山挽詩金陵人能詩善小兒醫有溪山樵唱集海鶴東飛不記程溪山猶是昔時清城門儻有重來日應笑兒童白髮生末俗﨑嶇巧智多紛紛夭札奈愁何青山不盡思公意落日空聞伐木歌賦棲翠樓送曹良金出使歸省羣山繞湖湖繞山髙樓突起湖山間湖光如藍山如黛雲近百里趨憑闌主人不出日髙坐笑弄煙霧招雲鸞雲鸞空飛渺無迹但見蒼蒼竹樹相回環芳蓀小松亦何意㸃綴几格娛清閒大郎新歸自天上春衣五色宫花斑樓前拜舞樓上醉山水亦似回歡顔煙凝不知晚色改潦盡更覺湖波寬登髙作賦逺莫致目極吳江楓葉丹送羅允恕歸省滿庭蘭玉翠交加近日西江更幾家纍葉書香傳祖父同時科甲際亨嘉三秋别思初驚鴈五色宫袍重染霞為問山中閒太史也應飛夢向東華題石田春江釣魚圖重江迢遞水煙通天設滄洲著釣翁返照入山迷紫翠平林過雨雜青紅閒邊嵗月真輸子忙裏鶯花正惱公為問中流容㸃筆扁舟畫我載泠風題竹送阮大經還金陵十載江東憶舊游竹林斜日坐深秋長安道上紅塵滿賴有清風消客愁談雅祥使歸壽母皇華夾道擁歸裝喜氣遙看滿北堂天上瑞雲垂五彩人間佳節傍重陽早時賢範熊丸在再世諸孫玉樹長七十一峯青在望若為登拜捧霞觴羅先生歸田八景為賦其四三顧書臺雲表三青巘蕭生昔棲遲緗素久已散荒臺仍故基落日循嶺圃逍遙面崔嵬當年選幽勝花竹繞階墀千齡亦未逺俯仰有餘悲勿訝岩居子緬想希安期雙溪道院雙溪走岩麓上有真仙居蕭爽蔭珠樹虛閒開玉除先生讀易罷杖屨或來於東寮紫鸞笙西館青霞裾招搖弭綘節想象凌清都日暮籃輿去天風送步虛中林社鼓髙榆蔭靈境秩祀嵗有䖍烹羊擊我鼓老稚走紛然落日更起舞酣歌間駢闐少壯逺行役投老歸農田鄉鄰既無故孫子亦多賢但願嵗常稔聽此終餘年古寺梵鐘梅花攪我夢欹枕五更初頭陀閔羣昧霜金吼桐魚一擊塵夢醒再聲靈襟虛須㬰萬籟動鳴雞遍前墟起坐視簷隙明星猶在隅却憶長安日整冠趨朝車送劉景星教肥鄉常日黃梁說夢游明朝匹馬度邯溝山連王屋排空下雲在天門抱日浮枕裏盧生迷嵗月皮間季野有陽秋丈夫功業時來建肯向青藜歎白頭景星治春秋有名孚若出示乃兄九三先生瑶草篇敬題其後逹人遺世網心與元化冥髙居養靈和土石被華精英英庭下草羅駢不知名明氷比皓質文玉擢修莖羣芳不敢伍煜煜揚翹英我願采掇之恐是玉山粳持以蒔千畝嫓彼堯階蓂路逺傷後時悵望吳峯青載歌小阮詞感我金蘭生青雲果善頌白雪宛遺聲餘芳倘許拾相携泛蓬瀛為盧悅清題竹四首盧郎老益清正似雪中竹嵗寒林下游還許王猷續雷雨過前溪竹色猶黯慘泥中有龍孫戢戢露頭頷風吹楚雲去一半在君山帝子不可見江空聞珮環凌晨步東林滿地散珩瑀舉頭見朝陽傍有青鸞舞沈石田畫楊君謙僧普泰雪夜談𤣥圖石田山水此第一儀曹魯山跡亦竒月明滿天雪在地聽取兩翁無語時為定默然題吳僧畫蘭二首猗猗芳蘭在彼幽谷孰為我徒清泉修竹清泉㳙涓修竹蒼蒼蓀也可人蔚乎相望明窗若空左右圖史永言諸君樂自今始吳有髙人得筆三昧灑墨飛空墜不沾地化為幽蘭殊妙特妍相所於歸繄定默然煜煜者蘭岩岩者石咨爾叢林兹焉作式山水小景江柳青青帶薄煙鸕鷀飛盡水如天幽人看得青山熟一任東風拍釣船送費千户襲職還松流水平林帶郭斜將軍門巷野人家費家舊西湖上青林華屋真城市村莊也百年勳蔭餘喬木三月春風想落花何日燕游還此地向來談笑即摶沙王師未斬樓蘭首看爾腰間似莫邪和許啓衷給事春日細雨閒門客到稀偶臨池水見晴暉浮萍本是風中絮爭得還隨柳絮飛即事和前人新出燕雛不記歸清晨捲簾到夕暉苔痕漸於細雨長榆莢正得斜風飛北邊稍喜烽火息南國却嗔魚鴈稀賴得相期有鍾子未應終遣壯心違邃菴逹人隱城市端居穆幽深雖當車馬交而無塵土侵側徑入迤邐層軒遞明陰蕭森間水竹窈窕想雲岑朝回隱几坐幽意宛山林想當締構初豈有逺世心抗席展圖史分庭盍朋簪覃恩窮海嶽清言振璆琳譬彼九臯唳風聽徹重􅙨鴻飛二十載俯仰成古今高雲復南逝時先生有南太常之命何時續幽尋行窩倘有作千里續遺音送楊承家邃翁天下竒之子亦超越琅玕映珊瑚文采爭煥發識君雖未幾一見眸已豁方期托芝蘭告别何倉卒江東名勝地京口豪雋窟槐黃逼秋期腹笥撑突兀三杯脫寶劒百步挽明月穿楊何足竒㑹見石羽沒清江柳方綿紫陌花未歇晴空正無雲萬里見孤鶻送宫諭李子陽先生赴南京太常少卿典學東朝舊史臣南臺禮樂荷新恩百年景運當熙洽三代遺文入討論花竹競誇官署好江山深拱帝京尊只愁未了閒居賦先生奉母夫人以行又被東風催北轅劉舜卿祖父母挽詩極目襄垣道蕭蕭落葉秋人猶避驄馬夢已隔丹丘比穴看明鏡同歸想玉樓餘芳知未歇孫子在瀛洲沈廷用以尺籍事來京却歸賦别老去江湖氣未消欲將長劔倚雲霄廷美少游邑庠十年幾作登樓夢一笑元非折簡招櫪下儘餘宛騕裊軍中誰是霍嫖姚浩歌一曲指歸路白鶴城西又晚潮送張信卿知歸德州短亭官柳下長路酒杯前待解薰風纜頻回落日鞭龔黃新寵命梁宋古山川去去應傳得歌謡滿日邊送陳玉疇提學南畿聖學久不講斯文日陵夷紛紛事占畢青黃互鐫追豈無豪雋人奈此場屋縻離章務迎合出意追新竒公言著簡册啓彼捷徑岐坐令青襟子釋耒拾秉遺所操諒如此即事吁可知陳侯儒林彥憲府久聲馳以彼氷蘗操樹此文章麾色笑春雨霽檟楚秋霜威矧伊根本地允矣列郡規指揮茍有嚮風行草爭靡走也章句士久墮荆棘蹊前瞻若有見內顧靡所施六籍本大道旁搜竟奚為贈言劇深願迥瀾此其時石邦秀侍御再按陜西乃弟翰檢先生索賦又見皇華映陜郊遺民應念使君勞關河尚有風塵警彈壓還須在繡袍青雲雙鳯立朝陽綵筆春生白簡霜心識西行非逺别夜來緑草滿池塘沈士登初入學夢人誦詩有細絲曾釣海鼇來之句是嵗集選得富春丞乃子陵隱處因贈此詩夢裏金鼇憶細絲桐江只在富春西久知萬事皆前定肯向浮生歎不齊坐上溪山明畫鷁人間嵗月等醯雞兩株松外千竿竹吟得新詩到處題蔣濟民自光祿署丞調主靖安簿滿考入京乞致仕賦以送之黃龍浦南雲水鄉八月鱸魚三尺長逺游不奈鄉思苦歸去正及秋風凉內朝供奉參鷺羽西江撫字留甘棠丈夫事業無小大看取老圃寒花香濟民既致仕家居十餘年足不履城市雖儒冠中有不及者王師仁少宰挽詩諱克復嘗巡撫蘇松等處曾瞻旌斾立江邊過眼棠陰二十年黃閣鹽梅閒老手青山松桂富新篇人髙晚節踰三讓公四上疏始得歸帝有餘恩賁九泉擬奠生芻不知處碧雲無際海南天王思德寄歙研吳箋歙樣新傳勝紫琳函封逺自柏臺深隱光似截波間玉涵潤長流月畔金箋素一時爭煥發煙霞當日記追尋西江使節氷霜重泚筆鑾坡竚好音東闕池上作次杭世卿吏部韻靈沼溶溶雨欲飛水東林苑望中微雲光倒湧金隄去寒色遙從錦樹歸詩出鎬京歌在藻地因龍首憶承暉君王自是稀游衍魚鳥無從識畫衣李徴伯挽詩鳴雨送殘夜青燈黯無光坐念絶代人今古永相望美德豈足恃令我初志荒忽復疑夢假衾襚已充箱掩涕不忍視起步空徊徨憶昨聽鶴亭與君初接言神交四千里從此成弟昆誦我避水書壬子嵗寄與謙者徵伯誦之云此時已識君矣意氣藹蘭蓀十年事幾變俯仰猶旦昏已矣蕭朱心傷哉復誰論間嵗苦離索舊游若雲萍與君每共歎忍復此長瞑元龍德卿按近甸旦暮涕已零遙遙兩汪子抑之器之在憂制此信何時聆虛簷團雲影永夜雙燭熒雲版蠟燭聨句清歡可復繼即此成千齡數短得氣清才髙與時齬黃鵠當摩空豈復須再舉乃知摧折意造物忍如許空梁飄素帷幽架落殘楮矯首青雲衢槐黃泪如雨元賔既無祿長吉亦早亡古人泪未盡今子重夭傷憎能豈天心念此誰紀綱綵㡛飾文木襲君錦繡腸下入三泉底千秋長閟藏惟應箕尾際永夜騰光芒生死猶寤寐昔人屢言之夢君執我手明言兩無疑云我雖死猶徵伯也何疑問死恨草草懷存亦依依及論重來理調笑名我癡云再生亦易望我為非熊則騃耳肯綮出妙語又云家君言聖人起居日用亦與人同但有節耳說得太髙便使人不敢學後問涯翁翁泫然曰誠有是言徘徊指還岐幽林猶倣佛髙壠儼崔嵬永念結沉痛蕭條誰與歸夢在髙丘樹下語四面斗絶指東北一徑使下笑而揖别思之宛然松嶺長春為周淳甫母壽匡山回望翠成林春色分明此地深雨露獨承千載潤氷霜不異一生心髙標倣佛丹梯外佳氣氤氲碧澗潯何日潘園奉周覽東風十里步清陰張廷肅憲副致仕歸中途得二郎子德捷報先生繡斧辭榮日令子青雲擢秀年宦轍九霄餘熟路書香一脈是真傳傍階霜菊深承露夾户星榆欲造天先生手植城中鮮有惆悵無因接賔燕碧山回望渺風烟畫馬為內學生題毶毶嫩緑垂楊短冉冉晴沙御堤軟驊騮行慣穩不驚圉人徐牽不教逺飛黃食料三品豐青絲絡首飄風騣曾見沙場征戰苦方知此物是真龍冬至謁陵次允升太史送行韻出門愁望北風驕百里園陵亦未遙餘雪印隄塵不動諸山迎日霧全消松楸夾道如前日冠珮中天限此宵想得羣仙㑹朝罷並瞻雲物慶豐饒雪山次吳寧菴先生韻夸娥失喜巨靈號騰六平分縮地勞孤牖忽驚銀海立兩峯誰論玉山髙嶔岩似欲生雲母融液猶堪瀹澗毛為報朝陽莫相妬先生吟筆正翻濤未雪風姨已怒號為山無乃雪重勞人間牟麥明年富坐裏蓬婆一夜髙目眩有時還拄笏神游他日想寒毛陽坡數曲如溪澗應待春風送海濤良金秋官録囚江右有發其同官不謹事者所司銜舊怨竄君名其中調東昌督馬通判衆知其誣而莫與辨也詩以送之東觀圖書共昔年西曹風月許聨編論心合在青雲上撫事空嗟白璧前曉日鵷鴻猶尺只春風駉駜又三千池魚塞馬俱休論且讀南華第一篇壬戌元宵應制絶句八首樓前燈火合彤霞雲裏簫韶引翠華散出黃柑齊拜賜玉皇遙在七香車兩宫慈壽極尊親聖主承歡一萬春放出金蓮長不謝扶來玉輦靜無塵銀幡賜了敕觀燈次第風光滿鎬京看到筵前鳩拂舞九農春事已關情華星寶月滿長安繡屋金釭夜未闌遙望千門起庭燎尚宫先輦奏回鑾紫壇回仗溢天津特敇金吾弛夜巡為有蕃禧助陽令六街花柳一時新宵旰憂勤十五年鼇山燈火亦初筵小臣未識魚龍戲中宴先歌蟋蟀篇紫檀紅蠟夜頻添萬嵗聲中樂未厭華月正當雲母障微風莫動水精簾乾清前殿夜將分萬燭交光絢綵雲傳敕明朝散燈宴詞臣好進勸農文後二日有㫖再賦律詩四首樂嵗逢春物物宜聖人行樂是乘時天垂玉燭三千紀地湧金蓮十萬枝星閣捲簾紅日近虹橋按曲綵雲遲願因歡慶思幽隱更法光明事緝熙千燈髙列奏宫懸五鳯齊飛拱御筵春到上元真富貴月臨雙闕正清圓甘泉西北長無警瀛海中間大有年暫弛金吾三夕禁未妨宣室九賔延好景新春屬上元蓬山排日㑹羣仙叢金間玉燈千樹翔鳯回鸞月一天直以升平留燕賞肯將光景付流連綵雲遙望笙歌合知奏邠風第幾篇紫皇宫闕夜通明飛閣回廊白晝行宸極本同天下樂霓裳不度月中聲河山表裏歸全盛雲物光華溢太清願祝聖人千萬夀年年燈火看升平許百户從軍普安州至潞渚卒時其子魯從豫游賦此弔之擬作燕歌贈粵行劒稜中斷不成聲一天凍雨紅旗斂萬里炎煙碧草橫假息忍看徴側在裹尸誰弔伏波營反者米魯女子也傷心最憶湖陰路垂柳閒門幾送迎君家海子東涯豫教內書館時於其家小憩郊行憶徵伯與德卿希大聨句故人丘壠望中孤玉古木荒村舊路紆清野奠有懷空酹酒宇交游無興更携壺玉人間流落文章在清夢裏依稀涕泪枯宇此日九原如可作清問君曾記玉樓無玉把筆英姿在眼中宇笑談曾共此堂東玉乾坤蒼莽游何處清花雪追隨夢未終宇價重連城驚毁璧玉氣消神駿想追風清悲歌亦是傷春調宇却與傷春調不同玉石橋歸路又斜陽清舊日經行宛未忘宇何物山川收間氣玉向來星斗避寒芒清青烏未卜前岡吉宇白雪空傳下里章玉一滴九泉今定到清騎龍休問白雲鄉宇送道士周翠岩還松江飇輪不到海東頭夢裏三山日夜浮歸去有時應駕鶴别來幾處見乘牛風清曉殿思金磬雲淡春空送綵輈借問赤松千載後幅巾還許伴清游送蕭指揮還金山將軍承寵出明光歸騎東風滿路香家有六韜藏虎豹身堪百戰掃豺狼北來烽火邊無警南去波濤海不揚細柳繞營春日靜雅歌誰與共壺觴寄髙曾唯去年下沽頭嘗索豫詩千里南河入望賖美人有約賦皇華鄉音不逺經冬鴈雲路常瞻八月槎官好水曹清徹底名髙玉樹淨無瑕北堂春日花如錦時向公餘奉小車送吳汝玉下第用己未春韻建業西風憶繫舟燕臺此别又經秋也知和璧終傳世恨向荆江復倚樓且莫臨岐傷逺道要須游刃視全牛長安春色年年似一樣王孫爛漫游送百户徐欽襲職還松江曲墻垂柳蔭清池十載髙門路不迷盡說柏舟同節苦欽早孤生母某氏與嫡共撫鞠厲志甚堅驚看玉樹與雲齊恩光曉日瞻龍仗行色秋風入馬蹄拂拭家藏舊弓劒從今步步上丹梯賦蟠桃圖為張時震父母壽𤣥洲髣佛海東涯海岸蟠桃大比瓜畫入彩縑疑著霧望迷仙苑欲生霞稀年令德真相配紫府丹臺别是家我欲金壺借餘墨一枝併寫杏園花維揚魏文璧工詩能琴善畫幅巾布袍游京師蕭然不與塵土雜將還與德卿御史各賦詩送之清溝緑樹繞江都樹裏人家畫不如艤櫂十年同過鳥臨流此日羡閒居乾坤老眼丹青在江海神游夢寐餘西北月湖連甓社幾時携手弄明珠題扇壽愛蔬吳先生尊人江海歸來一幅巾東風八十四回春日長勘罷參同契坐對青山即故人泰和蕭生將赴臨汀驛留三日為豫寫真賦此為贈本自煙江坐釣磯春風强使著荷衣不知面目從來假更與蕭郎問是非南望臨汀路八千皇華四牡日紛然江湖或有商岩相倘可因君送上天送張晦夫長史之沂州猶記征車逐後塵㒒隨計北上㑹晦夫於康莊驛遂與偕行離亭回首十經春衣冠稷下誰公右禮樂河間合此新長日橫經當便坐有時紆錦見鄉鄰君家去沂州甚近緑楊騎馬城坳路應向西風憶故人還金行為叔武郎中贈濟南姚龍故人留金兒不聞故人已死人誰云昨日結交今有變何況天涯生死分延州挂劔事已矣濟南髙風見吾子金還故人事則已事吾當然非有以江海千秋歌義士送寧菴學士赴南院紫清仙吏亦分曹瀛海晴虹隔翠濤詞下掖垣花欲動講回前殿日初髙城臨秋水迎飛蓋閣倚春風想運毫為謝白雲荆渚上樓船不似北河勞送盛春雨還吳未來消息滿長安小住何妨趣駕還海內正懸春雨望山中誰放夏雲閒每尋燕語多髙論轉覺鴻飛不易攀翹首閶門煙月路幾時携酒扣𤣥關哭次兒天敘寄兩弟五首孤根託淺土所賴衆葉扶斧斤日相尋誰能不傷枯根傷葉乃落葉落根轉孤不知天地仁根也真何辜仰天天蒼蒼扣地惟黃壚有語不可道泪下如傾珠虎狼亦愛子烏鳥亦戀雛生子不能庇悲恨當何如伯也歸故鄉漂泊無寧居仲子最孝謹性復愛詩書百方撓其中一病辭寒廬垂死與母言血淚沾衣裾沈思不忍道命也有生初養蠧傷桂根擊鼠傷定盆盆傷鼠故在桂死蠧轉蕃明明世間事瞀亂與誰論吾兒曾閔性至死無餘言念之益我痛作詩訴煩寃十年住京國日與憂患隨逢人得家信十書九攢眉芝蘭日以瘁荆棘日以肥宿纍本在我餘殃及吾兒種樹已結子養雛已能飛一朝委塵土煩寃當告誰汝母初來時骨肉共團欒依依戀微祿幸爾免饑寒負乘知有愧酷罰倘可寬弱女在旅殯十年猶苦酸如何復及爾中道摧羽翰蕭條古僧房兄妹兩孤單疏窗對寒雨念之傷肺肝何當歸爾魂慟哭淞水干喬時章除瑞安侯訓導侯實慈壽宫弟時章內翰師召子也長樂清風動內朝漢宫陰馬宋髙曹外家多福遵慈訓西孰延賔得雋髦永日青襟環講坐有時紅燭對揮毫相看益重酬恩地身是鑾坡舊鳯毛南有蠻為陰子淑憲副作南有蠻穴都勻反乎覆傲以嚚反噬厥主戕我民鴟張四顧掠且焚繄陰侯算若神戢我武綏以文綏之弗來殱乃羣鑾破膽伏以馴釋不問𢎞我仁豕入其笠吾誰嗔嗚呼普安城亦吾人一不戒血成津胡為不遣當使君嗚呼胡為不遣當使君時來魯據普安叛其初御史一言激之也程德望祠部於書室前鑿池作亭秋望落成而正之內翰適至因名其亭曰登月室曰聚奎要豫同賦方塘開我前明月出我東仙人騎鶴來憩我亭之中調笑弄月影徘徊吟天風夜久月漸髙光滿池若空遺我丹桂枝自携白芙蓉飄然凌風去千秋懷德容文星近東壁煌煌照圖書千秋五緯聚煜煜聨明珠豈徒兆文運皇步躋亨衢美哉君子堂春風迓簮裾髙㑹既有以嘉名諒非虛君看庭下人星斗羅襟襦髙朗自今始太史徵明符送湯千户還吳留守將軍金虎符明光傳警肅周廬新恩寵拜雙龍闕别路光生駟馬車投筆書生終刻印入關童子已拋繻樓船八月吳江燕誰共雕盤薦玉魚宗伯傅體齊先生挽詩兩朝名德重儒紳西掖南宫列近臣典禮百年歸考論文章四海入陶鈞先生一知貢舉兩教庶吉士春風遽撤朝回座夜月徒傷畫裏神近屢見先生遺像地下青溪定相待霓旌先後想紛綸青溪先五月薨送顧汝馨通家人物舊知名十載相看倍眼明捧檄君方感毛義思賢我復到顛閎青雲未覺流芳逺白髮多應别路生無限羈愁與鄉思併先秋鴈過吳城舜臣以詩慰問次韻故人千里寄新詩正是愁人閣淚時黃鳥有情依灌木碧蘿無命託松枝尋思往事多艱阻却悟深盟是禍基長歎一回還自慰重哀寧望老天知衛景玉生辰席上作我生於君後三算我及君游已十年浮世升沈幾搔首時初聞何汝誠訃髙秋風物又登筵銀鉤欲轉薇花月金獸初騰柏子煙他日仙班只今定丹梯須讓海鷗先戲簡王汝楫短日西風木葉飛游人無處不思歸連厫百室如雲峙肯念吳兒未授衣汝楫時監國子倉鄉人以輸稅後期當罰詩至遂得解方石先生季父逸老以寶慶守致仕先生名其居曰懸車舊第寶慶殁先生有詩命次其韻執鞭無地候巾車逸老編中識面初露冕猶聞下江漢雲山誰與畫衡廬青槐古柏京塵逺寒日西風宰樹踈莫向方岩誦哀些竹林回首正欷歔題畫鵲朝陽欲上萬年枝九色光芒射紺衣昨夜銀河濟靈駕露華寒濕未禁飛題花鳥二絶邊鸞不起林良老海內丹青合到誰晴日窗間弄沙鳥楚煙湘樹不勝思黃鳬不食聚沙觜蘆雞相將踏清泚飛燕翩翩軟風裏江鄉春晴景如此五馬行贈宋舜和之廣信翩翩五馬城東隅車載兩轓兼隼旟雪晴塵清馬蹄健長鳴跋地當雲衢漢家太守唐刺史握節專城殿千里古來青史亦吾人肯使諸公盡專美西江望君如望雲驅車躍馬無逡巡聞道羣偷先出境已識新侯是宋均先夕㑹于唐禮部元善宅有報饒信羣盜解散者送趙起龍兼簡其季父濟民濟民善種菊又自言得參同妙理有先儒所未發者白鶴城西是舊游趙家亭館菊花秋鄉關客邸勞魂夢風物天涯惜去留髙隱久應忘世味美材還合樹勛猷竹林㑹語從容地真訣參同可再紬送吳克常南京光祿監事同年周啓明內弟也通家親戚故鄉人臨别相逢意轉親晤語留連下城日宦程迢遞促車塵髙岡合止冲霄翼淺水寧容縱壑鱗朱雀烏衣壯游地為君惆悵十年春送朱文宿謁告東還天寒游子正思家手把離觴感物華鄉夢五更猶禁漏歸軒千里即仙槎庭萱屢報東風鵲宫錦爭看上苑花同學故人應問我緑莎春雨候江沙十二月十一日進㑹典黃蓋亭亭擁赭函簫韶聲起殿東南百年盛事中天見八聖深仁薄海覃堯典合從虞史潤周官不假漢儒參願言善述光前訓竹帛千秋作美談明日宴禮部大官供帳稱殊恩隊舞畨歌出內園禮肅上公尊奭旦書成新典邁虞軒雍容不止過三爵披覽何由望九閽經幄小臣霑醉甚但歌天保對堯尊送沈繼昌絲綸閣裏鳯凰毛五彩朝陽映碧霄出使口銜天語重拜辭衣傍御香飄里門駐節驚梅蕊驛路逢春問柳條為憶聖情深眷倚肯耽山水後趨朝戴寶之祖韶軒翁挽詩西風林壑晚凄其歎息儀刑不可追天地並臨刲股夕里閭相泣蓋棺時謀深豐芑金樓冊心切苞桑白傅詞翹首玉輝原上路幾人下馬讀穹碑草一日夜坐憶亡兒清夜長吟動四鄰吟成人靜獨霑巾不知此假纒綿意天地相關復幾人視不成形舉目存青燈一盞近黃昏彭殤竟是誰分出妄使瞿曇欲斷恩茅山書屋小茅山下三間屋養默齊中萬卷書竹帛散餘嗟往事海桑遷後復吾廬簷頭樹色低侵帙門裏泉流曲貫除想見日長占畢倦時來憑檻數游魚封知府葉公挽詩百嵗閒身五馬封向來江海復誰同門䦨慶建看諸子兄弟椿津對兩翁身後詩書方自逺眼前林壑便憂空碧山煙雨淮南路尚想扁舟理釣筒次韻啓衷給事病後見寄宋玉楊朱各有悲杜陵曾借草堂資由來造物多兒戲畢竟風流是我師夢裏青山休作意眼前黃卷足新知春風幾日開西館聊欲携尊問所疑賦僮僕歡迎賀叔武尊人都憲致仕陶令還家日歡迎走僕僮人間長見畫林下復添公物色殊相近遭逢敻不同飛騰㑹明盛揚歷踐昭融苕水猶遺愛橫山早息戎公鎮守寧夏全歸渠亦喜逺涉路何窮指㸃桑榆茂傳觀里巷空挽衣參稚子扶杖雜村翁黃菊霜前約青山雨後功行藏自吾道消息任天工晚景看如此皇恩信有終丹青如解寫何羡洛城東題學生畫枝頭野花紅欲語草緑猶帶朝來雨狂蜂浪蝶不自持下上東風作容與畫師好手亦難逢陶成已老况孫龍南薰殿裏和丹粉猶堪一笑解天容東江家藏集卷九
