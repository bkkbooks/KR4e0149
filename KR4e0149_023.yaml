body:
  text: 東江家藏集卷二十三中集十九明顧清撰北遊稿雜著一十五首銅雀硯銘豫嘗觀萬物之變相尋于無窮而陵谷崩湮貴賤往往易位有不勝其可慨者方曹瞞築臺于鄴雖一材一埴殫資力以為之其意固欲傳之無窮歿不再傳而鞠為草莽其事載史册三尺之童茍知名義者皆賤惡之至覆臺之瓦飄落於風雷野火之餘者或取以為硯士大夫乃反貴之若商彞周鼎然由乎今以觀其始庸詎知其至此哉蓋其廢之速也固以操之虐而其物之精則自足以傳後而可珍亦若斯碑和璽無掩於嬴秦之虐也雖然其物精其弊乎民也亦多矣故為銘其額以示後之得是硯而用之者銘曰貴而厄岐陽之石顯而沈泗水之金斯硯之珍以其物不以其人窄軒銘士參三才以德非居俯仰無愧靈扃晏如圭竇蓽門天寬地舒有歉於中惟恐人覺彼雖不言我恆悚戄廣厦洞房伏鼠屈蠖君窄其軒匪窄其心簾几屏牀可書可琴息偃自足何必髙深王公大人相府渠渠君豈弗堪分則有拘君身在朝君志在野汗漫空同無不可者如鴻與泥寧久斯下太史作銘請志軒楹居也勿欺出而慎行業廣德崇茲焉永徵舒軒銘宋竹洲先生之裔孫有曰信字廷孚者以舒軒自號都水郎中李君彥夫既為之記矣廷孚復介其鄉人程君永祺徵豫言夫舒者伸也亦曰散也有任適不拘之意焉廷孚家萬山中有以自樂無求于人斯其所謂舒者然吾以為天下之理嚴而後有泰節而後有和君之能自樂而無求必有其道而未易以言也為之銘以諗之銘曰彼荒而怠我守弗懈或棘而趨我行其徐不懈而徐是謂執禮久而弗渝目視足履心泰而寧身安而舒是曰成德惟聖之徒竹洲之孫宅是商山有翼燕居舒軒是顔惟節乃和惟嚴斯泰樂而無求曰有本在太史作銘志彼軒楹舒哉舒哉其德之成寶善堂銘惟昔我祖宗積德行義承慶于天以祐我後人使粗識禮義竊祿于朝先君嘗擬作堂名曰寶善未就而歿小子遵承先志幸遂落成敬勒斯銘垂示永世銘曰我祖為善如農力耕小子不佞會逢其登聞道緒餘荷國寵榮匪慶之餘曷云爾能新堂既成華扁在楹出此金玉貽爾雲仍其本則孝其歸則誠永寶弗墜我後其興過半松像贊形之厖德之充年幾耋貌則童委軒裳於天上卧煙雨於江東識公晚者以為香山之白傅而見之早者則曰漢代之于公此夫秋官屬大夫洪都副亷訪生禾興老華亭士稱之為一齋先生而又曰半松翁者邪任參政進士巾服像贊此先生大廷登對後待曉五鳳樓聽臚唱時邪將南宫燕罷奉謝表上赤墀時邪抑長安看花遍舍菜先師趨大成門時邪槐簡蔥袍冠帶凝如其中若深思者蓋不以一第自矜而已慨然有天命之畏人窮之悲矣噫此令終之保所以特受夫先達之知而髙文大節至今為後學之師也邪此像流落于裝潢師郁氏幾二十年先生之孫復貞得之以示清敬為之贊先生初登第與同年謁鄉先輩陳公景祺公異之客去書齋門之背曰吾鄉進士五人克保令終者任某一人而已後先生完節而歸果如公言楊普能像贊都圻繁會紛華是矜何以驅之曰利與名質哉楊翁善葆其素如青蓮生泥不涅以汚亦有世祿橫金曵緋曰此非我事猶子其宜綸巾褐袍燕坐清晝爐香縈前經卷在右是將從給孤參維摩追松喬而並夀者邪鄒柏軒像贊貌充而愈體胖而舒問奚則然神明內腴我登寧山想見之子幹譽貽謀良亦稱此世則道鄉時稱柏軒煒矣丹青其亡若存任藝軒像贊元松鄉七葉孫喜讀書慕古人不自售終隱淪儼衣裳巍冠巾顔清揚宛如存問不對傷豫神歲之暮雪霰繁尋碧藝繞空軒喟其歎述此文壬申冬至過內弟明善拜藝軒先生遺像追感疇昔不覺涕零敬為之贊先生諱志字孝忠生正統己巳而歿以正德戊辰安貧樂善好成人之美皆今人所難能也武城趙璉寫豫六十歲容請留其稿為題三十四字與之傍觀道是自顧則疑我之知我孰與人知山林朝市麋鹿金緋歉豫中者豈獨斯而已邪有遊方之外者持老子觀書圖乞豫贊豫方有所感援筆為書不覺其言之過也繄混元體虛無升崑崙復奚須文五千吾以蕪矧鉛砂熺鼎爐燎玄黃禮空虛本之迷支日敷教豈然氓則愚世橫流日下趨騰穢腥彌九區覿遺容企玄謨掊斗衡焚璽符穆淳風古之初雖弗中免淪汚誰從者其與俱心君頌心學之傳尚矣而尊之曰君則自荀卿氏始卿之言曰心者形之君也出令而無所受令者也考亭朱子稱其與孟子心官之論最切蓋君於天下無所不統內而羣工外而列牧各職其職而所以令之則在君心於一身亦無所不統耳目視聽手足操履各事其事而所以令之則在心故心有君之象焉端居靜處思吾身自一息之動以至於凡天下之故有不命於是而無悖者乎夫頌者容也美盛德之形容也心君之德其可頌也已敢再拜稽首揚厲而鋪張之其詞曰於皇我君位絳宫兮髙朗廓清洞虛中兮端拱默淵感斯通兮坤輿茫茫天穹窿兮維氣與理磅礴充兮測其包函君與之同兮義以為制仁其容兮禮降而卑知則崇兮攬不盈掬放之無窮兮目以之明聽由聰兮曰聖與狂命斯從兮昔在勳華惟敬恭兮四方為綱建茂庸兮彼受與辛蟊賊內訌兮豫末小子瞀昏蒙兮惟君之威嚴撿豫躬兮疇曰不顯陽􅀈空兮孰云弗聞震豐隆兮拜稽揚言歌峻功兮期勤弗壞尚有終兮天秩加冠訓詞維我祖父以來世世積德我弗敢墜以有爾父克享天祿爾輩其承之兹維吉辰為爾冠躋汝于成人往迎爾相汝友子南實在賔位爾維勉之紹乃先德式爾子南孝于親友于兄弟克成令名以永多福無忝爾所生新居上梁文伏以百年吳下世稱萃德之家一日雲間共覩鼎新之業鄉邦助喜山水增輝共惟宅主可間內翰先生天與髙年神相多福早承遺善府君之訓直道而行晚帶瀛洲仙子之銜清風益振爰以園廬播殖之積出為子孫經逺之規因地拓基化湫隘而為爽塏相時舉事屏氛翳而納休祥首建層樓次新燕寢左嚴宗祏右肅賔寮門廡翼以前陳閨闈肅而內整朴不至陋將以侈乎上恩文不過華用永明乎素志洎選名而立號咸崇德而象賢先知乃逸題觀稼於樓顔率由不忘施繼善於堂署中庭不以列歌舞别院惟以敘親賢作於今將傳於後聿暨乃心為其逸先處其勞庶無罪悔若乃山川之形勝盡乎冠蓋之登臨試聽歌謡乃見佳麗兒郎畢和畫棟齊升拋梁東樓閣園亭錦繡重下有碧流通巨海春雷不日起潛龍拋梁西畫闌回處碧山低捲起朱簾望新月數竿修竹鳳毛齊拋梁南紅日融融淑景添明月夀筵歌七十宫袍五綵映朱簾拋梁北翹首北辰裁只尺祥光先夕見中台兩兩明珠挂簷額拋梁上元氣茫茫含萬象未論舉手摘星辰巳覺胸襟浩無障拋梁下正見平田事春稼窗間更有讀書聲何必箕裘慕王謝伏願上梁之後門闌溢慶家室多宜賢子賢孫奕世之書香不斷肯堂肯構一方之輪奐常新上梁文者稱美頌禱之詞合作梓人言猶詩之樂章自歌工而指主人也為自言者恐未安姑記以問達者寶善堂上梁文伏以承家有本惟尊祖而重宗居室有方戒欲速而盡美昔在先君之世嘗為貽後之謀蓋將由寢以及堂固已立名而正位幸兩歲之豐稔屬三吳之宴安黍稷重穋溢于原田松杉柏柟來自江漢乃以嘉平之吉日式完畫堵之遺規祖有善而孫寶之非徒名也父所作而子述之庶永保焉咨爾兒郎聽豫短頌拋梁東墻下荆花欲綻紅共説今年春更早山頭連日是東風拋梁西平田古木映疏籬于茅乘屋皆同日畫出邠風七月詩拋梁南祖林松柏翠毶毶下有短碑髙四尺無窮世澤此中涵拋梁北矗矗樓臺映空碧鄉鄰多富復多賢正好相親莫相失拋梁上晴日薰人過挾纊愛人容物似冬曦題榜分明有先樣拋梁下厚礎深基承壯架風雨不動鼠不侵秖要周防密無罅伏願上梁之後男皆孝弟女悉柔良不侈不驕顧堂名為永監以似以續衍宗祀于無疆題超果寺重起西廊疏超果寺自西隱受公化去寖以衰替西南廊屋頽廢者十餘間其南向三間先師友蘭張先生講授之地而清所侍學焉者也西隱之孫傑峯俊公以今年夏繼主寺事謀興復之而豫適家居乃以銀十兩授傑峯為倡期以落成之日即講堂舊址為友蘭書院以奉先生香火而延師其中以教鄉人子弟及寺之僧行如受公時蓋因傑峯之志而以致豫之情固亦寺之舊觀也傑峯願力甚大且將并法堂丈室而一新之有相厥成盍自兹始笁乾東魯教則殊宗洄水瓣香義均返本慨先師之始教屬兹剎之方隆四十年夜案晨燈恍如夙昔幾百武回廊邃館半入消沈每經瓦礫之區無限羮墻之感幸傑峯之繼席乃西隱之嫡孫肯構肯堂時推善述某邱某水昔也同遊既尋盟並契于夙心抑起廢復兼乎義舉鸞回虹繞外以嚴水月之居藻奠蘋羞內以妥友蘭之位一籌初展兩美具存人其人廬其廬是或一道爾為爾我為我各既乃心東江家藏集卷二十三
