body:
  text: 東江家藏集卷三十五後集二明顧清撰歸來稿詩九十五首癸未元日用壬午韻欹枕殘宵萬跡陳白頭那復笑陳人書囊上下三千歲甲子依稀四百辰新年六十四蓋三百九十餘甲子矣冠劒此時天上㑹湖山前日夢中春涓流巨海無窮意俯仰乾坤只病身雪後登樓用沈西潜韻殘年擲我去堂堂頗覺靑春日月長載酒有人過栗里上書無事訟安昌憑闌草木欣欣動倚棹鳬鷖欵欵翔別有淡交真味在萬籖棐几碧藝香凍雲飛散曉來天舉目靑山九㸃全竹筍迸階猶帶雪柳枝低檻欲生煙閒尋廣受還鄉事偶到機雲入洛年八百里封還若此龍陽何况木奴年山人約為豫種橘故云初九日見紅梅約味苓同賞是日新作水樓亦欲詩人過之為後來嘉話也白牛溪上負苓翁華髮蕭然碧兩瞳坐擁詩書忘永日醉吟花柳又東風王侯宅第烟霄外泉石交游夢想中風閣水簾今在眼且來先看早梅紅立春有感用辛巳韻憶昔諸賢秉化鈞萬方同醉洛陽春絲紅縷緑盤心菜剪碧塗金勝裏人往事不堪重理夢短吟聊與當傳真君王聖德同堯舜願倚青陽頌日新旦起偶書起臨靑鏡拂冠巾又見江南一度春老覺杖藜行處穩病於方藥試來真吟思好句翻疑夢坐愛名山不近人六十四年多少事向來何敢道全身生辰次味苓韻生筵酒盞接元春次第風光到此辰夢好協公桑蔭傳詩來錫我上方珍園林鐘鼓非前輩廊廟江湖亦老臣孱弱願期交引翼共瞻堯日萬年春次姚絅菴韻少年學步希攀龍後生先輩殊而同文場接軫借光價海月下照滄江虹當時庠序總豪俊公於其間尤長雄歲行壬子我忝竊公意夙與神靈通黃旗捷足走夜半隱若平地行豐隆升沉不作時世態江頭别酒雙壺崇劉蕡何必下李邰雲龍竟爾乖相從虛名我亦自知我厚抱世豈能忘公南安一世僅小試梁棟已奏蘇湖功至今諸生誦遺訓有若漢士希林宗閒居詩筆老益進人意所淡公偏濃犬馬之齡亦奚有大篇投贈何舂容祓除牛舌雞口穢滌蕩栁眼梅花風寒林索莫幽谷閟頃刻萬景回春融塵區奔走三十載微命豈不懸靑穹檣掀舟舞幾阽殆夢中每想垂綸翁致君有意苦才薄擊壤且逐康衢童養魚池南鶴涇北歸來兩見春花紅去時衆雛皆長大丹玊冠頂黃金瞳長鳴一聲起煙際哀怨似弔吳臣忠洛陽羈客竟不返草堂空鎖靑山松小奴獲稻試春釀一瓮曉熟天門冬弧南光燭斗牛分諸老百福神皆充相携一笑醉花底便可寫入丹青中不作雲臺卧華頂亦合桓榮陪李躬尋思却恨公不飲未怕北海尊罍空生辰㑹兩學廣文有以煙火為戲者因成四韻貯煙含霧結機絲旁絡中聯鬼不知一炬么微平地起萬花紛駭入雲披龍蛇雜出星辰下霹靂交從指掌馳直到上頭人喝采滿衣灰燼踏泥歸諸廣文見和疊韻奉酬萬變靈通火一絲只應師偃未曾知寶王珠絡浮空下神女龍綃隔霧披明月上時雷炮發暗塵驚處火輪馳詞臣正憶鰲山盛為謝嘉賔緩緩歸别駕高君解綬歸衆皆嘆惜競為詩以送之豫亦繼作聽鶴亭前酒一巵柳條花蕚共依依也知物色皆天豫但覺風光與願違羈紲可能長客路雲山從此謝塵衣漻然氷玊脂膏地猶喜吾人有是非君初受任吏部稱其文其在官民不擾而事治奉身之物皆平取市中去之日無一錢寄而郡僚中獨去君一人此羣情所以不厭也鍾卿密繡衣示近報有懷傅文穆公十廟威神儼在天萬邦黎庶尚多賢臯䕫事業誠遐矣房杜襟懷亦朗然兩手果能藏萬目一時何以易千年令人轉憶臨川老屈指懷憂草載前公嘗與西涯論人才至某科曰如何得此一陳過也故云六言園林日日春風市喧不到墻東犬卧落紅籬下鶯啼新緑陰中小樓平跨林梢足底昏明兩潮藏舟不須巨壑度鶴即是仙橋乍去還來沙鳥將開半落林花社鼓前村隱隱機聲别院啞啞闌干欲過還留緑肥新漲溪流花落游魚影亂風和鳴鳥聲柔涉世已知踰限讀書元自不多幸可澆花種竹還思列㦸鳴珂霄漢九重雲日江湖萬里風煙田父相逢偶語今年大是豐年遊絲將墮復舉好鳥急過遺音總是少年光景只多往事關心為愛夕陽晴好不知行過秋亭墻角桃花片片枝頭梅子靑靑桂林談君教吾松六年甚得士子心忽聞罷去相與駭歎而莫知所從徐考其名與君之為人正相反也於其行詩以白之花自含仁絮自飛春風著物本何私秪應鶗鴂中宵起不盡芳蘭九畹滋江月有情千里共湘流無恙此心知瑞蓮池上題詩在總是諸生去後思數日不過西亭忽木蘭著三花平生所未覩也涉筆書此招味苓同賞天隨詩裏洞庭船玉貌雲孫故儼然游遍洛陽曾不見賞音今日付朱絃味瀾飛泉出巨壑百里回瀾翔酌之味其甘仰視雲山蒼山髙土滋厚土厚泉益芳浸灌富畦壠回環固陵岡誰知一滴潤中有千林香先生靑烏胄家在雲水鄉常言九峯靑孰與三江長妙契一以握川靈走奔忙我老懷首邱君來協吾祥盤盤鳯山麓南趨向朝陽溪流左右帶落此團玉光顧㑹本舊浦祥澤亦名塘須君一染指為我終其臧夏君原宿世傳地理陰陽之學而自號味瀾蓋以山澤氣通遡流可以知本亦昔人飲曹溪水而知上有佳處之意也豫為山妻求葬地得之鳯凰山陽君議與豫合為賦此詩仙鶴褚道人嘗欲得一詩久未能答近和元吉壽篇見者謂似游仙體因書以貽之然終不近也曾立蕭臺縹眇天塵心一墮八千年却從海上三山駕來集城南五色泉遼鶴再聞中夜語葛龍深抱午時涎緑章赤字無人檢猶在虛皇玉案前四月七日陪約菴適齊二太守東園鴻臚龍山都諫登超果一覽樓望西隱堂有感還飲翠林精舍作時西隱火已一年而寺主傑峯亦化去矣是日翠林亦病出蔬饌延客故末句云云天台樓閣冠羣山童稚游歌日倚闌豫少讀書寺中歲月不知靑鬢改松梧長繞碧窗寒塵龕落日悲彈指劫海何人更助瀾賴得遠師容客醉不教啼鳥怨春殘來鶴樓次周北野韻江上樓成記鶴來鶴飛江外幾徘徊仙人不作臨臯夢游子新從洛下回天末逺風傳嘹亮竹間斜月見毰毸何時重續城南㑹高詠南飛送一杯閏四月三日北莊分秧約味苓同觀與聨句千金難買俞塘北百畝新開水曲莊相約明朝移短櫂緑陰傳酒看分秧緑陰傳酒看分秧曲水縈回送羽觴味苓畫裏蘭亭詩七月清一時流詠遍江鄉味苓蔣文藻水竹村居閒身不屬樊籠瑣茅屋偏宜水竹村盡日枕書藝閣靜有時揮翰墨池翻娟娟翠羽凉生坐落落清瑶淡迤門贏得白頭心眼淨春風長見長兒孫出都時館中諸君有晚庭侍詠聯句其後不預者相繼有作近方寄至次韻答之匡時無計乞身難望望雲西九㸃山雷雨恩深天作解桑榆景近鳥飛還詞中郢客重聞調枕裏盧生已度關猶有感懷詩未了桔橰長夏不曾閒今夏苦旱曾傳初詔未央前舉目金容尚儼然天地氷霜春不間江湖星斗夜常懸無心海鳥當人下可畫雲山與屋連珍重故人相慰意一時分付釣魚船夜夢為人作幽居詩得二句嫌其寂寞而止既寤因足成之苔生井幹草生階不見馬蹄門外來風月滿庭書滿架一尊時對碧山開和楊時望新居雜詠盛年馳逺志將老思閒靜天運有消息人事遞豐省自從大道喪階磩生榛梗欣榮亦偶然淪伏豈非幸詩班未可笑過涉且滅頂惟慮西潭月照此胸中耿道存無窮達志適忘逺近子桑七日病豈憶惠施問由也號升堂乃作窮途愠君家三賦翁天球振空韻才高徒後名事往嗟頽運何以發淸謡東鄰有芳醖君鄰家白酒有名卜居須仁里結友須良契湘纍江潭行紉佩必蘭蕙蓬麻兩因依腐蠸終蝥蚋君看稷下生肯乞墦間祭吾徒幸閒居塵境息啁嘒𤣥文倘許窺烏藤尚堪曵月出新雨餘桐陰落金井經旬困隆鬱捫頸欲生癭飄然懷靈仙願作綵鸞請鸞飛空𡨕𡨕去入無窮境靡求焉有爭不暑安知冷下視區中人紛紛逐風影題阮襲之合浦還珠卷子喪目與喪孫歸目亦明嗣承真一線游歷恍他生舞袖春花媚書燈夜案淸雲階繩武地細話十年情邂逅驚遲暮暌違熟姓名三場先後榜四海弟兄情病阻臨溪餞愁聞觸暑行因詩叙竒事流詠滿江城𢎞治壬子麻城阮先生襲之校文應天而豫沗薦名己未豫同考禮闈而襲之登進士第其後襲之以哭子喪明棄官家居不相聞久矣嘉靖癸未㑹松城道乃孫來歸病目復明事相與驚歎判府胡侯因出董大參及豫舊僚胡君孝思序記屬為嗣音而先生行矣隆暑抱病不能出餞姑書此别卷一以見君家嗣續之不偶然一以紀三十年場屋斯文之好庶子孫之無忘云爾讀蕳齊法駕道引詞有感擬作五首驂龍駕驂龍駕龍駕引鸞旌羅列三光俱在下青雲回首玊皇城風露杳𡨕𡨕金風裊金風裊飛珮度銀泓仙袂六銖凉似水摶桑東望火雲蒸回首指蓬瀛雷隱隱雷隱隱列缺挾飛車一擲火鈴三萬里人間何處著妖邪歸路海天霞祥雲起祥雲起雲起四天明寶月宫中光氣滿流黃一道墜明星萬壽聖人生歌萬壽歌萬壽稽首玊宸尊下視九州雲五色羣龍濟濟㑹天門一氣儼長存再用翰林諸公韻人間行路古來難亦有南山與北山蓴菜可能羊酪美張翰不共陸機還雲林窈窕時孤往蓬户尋常夜不關翹首羣龍㑹霄漢滄洲天放老夫閒糠粃因風偶在前向來淘汰豈徒然臣生得失雞蟲比帝德光華日月懸野鶩自非威鳯侣三江元共五湖連夜來一枕游仙夢親見秦皇駕海船讀天游集君平成都隱室無儋石儲羅冲家萬金往遺傾後車我餘子不足遺我將安居笑謂平生過酬稱良非虛我嘗宿卿家周覽子室廬見子朝夕間汲汲無少舒我卜不下堂垂簾常晏如餘錢纍數百凝塵委牀隅以兹對相較豈不我有餘王生景芳躅特筆天游書覽之重有感長歎仰天衢斯賢誠曠代冲也今亦無猶知敬賢也文僖尹西洛賔幕皆鴻儒希蹤郭延卿野服臨其居荒僻少過從未見諸公如菲然具杯案班荆叙歡娛日昳羣吏集麾蓋滿庭除公等皆何官騎從爾云都盤飱靡加味體貌不殊初談咏西山暮出門送登車諸公恍自失纍日增歎吁襟懷有如此聲利豈能驅下視望塵子飛龍翔太虛枯木竹石為鄭節之題霜凋孤桐樹槎牙碧琅玕夜半山月出飛下兩青鸞幽人適不寐清影上闌干聞客言有省也識隨時好難忘泥古心交絲易為幔孤植鮮成林邈矣期千歲悠哉寄一琴草堂人靜夜三諷白圭吟和楊時望睡起江樓日未頽小園籬落豆花開歸遲野鶴鳴相及見慣沙鷗眼一猜春夢一場成獨笑秋風萬里為誰來木犀枝上靑靑蕊已辦分香入酒杯南京摺扇名天下成化間尤重李昭骨王孟仁畫兼之者誇以為竒而今不可得矣明善內弟以聽泉主人扇索題其畫則孟仁筆也展玩數四舊京風致宛在目前為書此以志感李郎扇骨王郎畫三十年前盛有名老眼摩挲舊時墨却思騎馬鳯臺行次韻答陳魯南魏闕江湖總帝臣碧山金馬亦平分機雲此日真無恨隨陸當年也未文清淺幾灣松谷水飄搖一片海天雲只應細雨斜風調未可羣仙上界聞庭前有柏屏閔其束縛命小童解之因題四韻山中霜柏自亭亭多事園丁強作屏剪截共驚鸞尾鍛屈纒何異楚囚扃濠梁水上魚能樂茂叔窗前草自靑釋縛解圍俄頃事拂雲從汝到千齡絅菴先生懸弧中夏而延客以初冬致賀誠後時矣而餘觴猶可掇也輒成四韻庸助笑言寒日西風淨帽紗清尊緑酒對黃花閒思往事三春夢老覺流年兩鬢華元節未妨寒食拜壽觴應共海籌加小車莫厭頻來駐前輩如公更幾家芙蓉金菊間開時至園林百卉芳紛紛紫緑間靑黃芙蓉不帶春風面依舊寒花一處香往歲阻風江上嘗登圌山望海門孫思和逸想樓甚近而未之到也誦守溪翁之作遐思渺然敬次其韻連雲不見五城樓曾立金鰲頂上頭回首乾坤雙雪鬢海風吹夢落滄洲寓感依阿每得意骯髒常失時古人已共歎末路轉多岐芝蘭掩蕭艾鸑鷟避鳶鴟人衆天可勝而我猶人猗欣欣詎可遏悄悄空自悲惟當秉明哲大運隨所之短轡紆長駕行行未渠已川途屢回互常恐迷所指天機妙倚伏人事亦難擬尋常婚媾筵中有冦戎壘有時濤波翻舉網得雙鯉流行隨大化百歲詎能幾溫凉久矣更甘苦亦如此諧俗誠以難抱拙長已矣諒無當世資庶曰寢息美江河亘九地日月麗九旻明者必有本流者必有源一極肇萬有至理無餘言行人望逆旅所覬一榻溫黃昏幸即次遽欲隳乃垣以彼蟲鼠智妄啓般倕門高言視一世舉目皆童昏六籍炳明訓靈扃儼威神十室且忠信寰中豈無人誰歟仗三尺屏此魑魅羣濓洛繼絶學紫陽集羣儒微言析豪末精義窮錙銖氷泮解衆惑春融歸一初餘功及藻翰金石垂楷模高蹤邈難繼詭轡啓殊途掇拾珙璧瑕進彼珉與玞蔀屋雖見斗肺肝本昭如彼狂諒已矣蒙也真何辜淑人啓土有感隨事寫懷用辛巳韻修門同入不同歸歸日靑山未敢期淑人喪還與臺章同日中傷頗重人皆危之鸞匣君今正丘首漁竿我亦上苔磯五十年中幾别離誰知此别遂長歸紅顔白髮終千古敢向蒼蒼怨小兒今日靑山始是歸為君三過著麻衣淑人卒戊寅喪還以辛巳至是乃葬可憐稚女隨人哭問著阿㜑渾未知為君礱石為君辭幾度含毫濕素衣兩字龍光三錫命一行先上赤繒旗並居華屋更無時回首風塵兩鬢絲坐擁孤衾聼寒雨此情猶望有人知昔司空表聖辭官後預營冢壙與賔客同游世傳以為達豫葬淑人迫於歲暮功雖未訖而規制定矣營度往還得絶句十二首目之曰生游棹歌非敢仰希先躅亦聊以寄興云爾瑁湖烟水接通波問訊塘橋路不多長向北花園下過歸舟齊唱夜游歌通波門外水烟長五里紅亭浸碧塘記得兒童游戲日夏家墳樹鬱蒼蒼十里湖光十里山山容滉漾水雲間橫橋便是中分地長與游人記往還水面風來聞磬聲玉虛臺殿俯淸泠年來晴雨無憑准我欲雲階暫乞靈漸近靑山水漸灣水灣回處正當山山形飛落靑霄鳯水勢旋為碧玊環玉環東轉帶虹腰一水東行赴海遙三百年來文物盡行人猶自說塘橋蛇嶺高盤翠作堆玉屏重擁鳯飛回南宫對客披圖處誰道扁舟此日來嘗畫松地圖與駱兵部來臣共觀駱指吳㑹及鳯凰山南有地顧浦北來山隱隱張村東下水悠悠不須細問靑烏子論姓還應我一丘短垣疏柳枕橫塘中有尚書晝錦堂落日回舟思無限漁歌一曲下滄浪尚書李銅至剛也西來一水自山涇半入塘橋半鶴城南北回環如有意往來長得順流行萬古乾坤一寸心西風回首二毛侵靑山幸有全歸地敢向煙霞計淺深執手交期終此地生游勝事起今年烏紗一幅靑天下畫楫雙支緑水前近作小亭池上背墻面流左右林樾日色不到而忩几虛明顔之曰息影味苓至而喜之賦詩三首因次其韻浮世空名與謗隨欲從蛙黽問公私年來悟得安心理只在池亭隱几時獨立常疑與世違回看世路有危機清池緑樹紅忩裏敢道先生昨日非前頭千古後來今俯仰中間一寸心若對此君能不愧也應無事短墻陰送朱原誠之桂林有後引曾與江樓共績文書聲猶想夜深聞風雲入手無多事場屋掄才獨後君八桂曉山蒼玉立兩江春水碧羅分聖朝綏遠須循吏應使棠陰接四鄰朱君原誠少嘗從豫學連蹇場屋以太學生出判桂林之奉議州臨别贈此奉議古百粵地近代始列職方鄰邦牧守猶世授親仁保民副九重綏遠之意正原誠今日事也故見之卒章吳子南將赴羅源問保民保身之道豫告之曰子家一閒翁之積厚矣子能承之推是心以勤施於政將無適不可豈直羅源而况其身哉子南請書於卷遂櫽括為韻語以貽之體裁音律固在所不論也不見閒翁三十春每將淳德衆中論蘭階茁秀看吾子花縣鳴琴問保民萬化流行自興孝九經倫序起修身靑雲賸有前頭路記取長沙運甓人次韻伍松月都憲松江感事本無仙術可休糧舉目鄉關兩鬢霜忽枉新吟話疇昔如觀舊俗飽倉箱當時經畫垂金石幾日飄揚趂粃糠復古周宣仗申甫老生翹首頌康穰來詩前聯云米穀陳陳幾四億閭閻比比足千箱問之實三十七萬幾千石蓋成化辛酉以公常州推官來盤濟農餘米今聞倉廩皆空故有此作甲申三月望日識奠三江舟中有作四月二十一日淺碧婁江水蘼蕪被兩涯平生到曾未此日看成悲悵望雲龍㑹淹留絮酒期中岡知近遠煙樹鬱參差憶昔曹園别公西我自東竟成千載恨猶幸一尊同往事鴻飛外浮生蝶夢中有懷知莫問梁月繐帷空多暇推南省公來日紏紛執經辭斷斷尊主意勤勤鹽鼎虛黃閣颷車已白雲向來庭左辨列柏想猶聞進退關憂樂哀榮具始終策名龍首重節惠奉常公桃徑春陰遍槐庭晚色濃濮園初議在天下想遺忠葉竹忩出示月中折枝桂花上有司馬蘭亭題字嫦娥宫殿隔人寰玉户金箱夜不關桂子定知何歲落至今清影竹忩間眼中前輩風流遠物外閒情日月長小閣垂簾對遺墨天風時送木樨香葺舊居有感成化丙申移居時豫年十七今四十九年矣憶昨移家日真移一束書夢猶循舊境時亦待閒居俯仰嗟鄰近經營荷慶餘兒郎誇善頌風木正愁豫次韻答尤元吉少日游歌伴惟君實俊英連飛才豈後幸㑹我方丁望道如瞻華紬書若泛溟本期同晚翠而獨借春榮逐隊升金馬聯輝傍玉衡五雲環帝宅列宿拱元精往事嗟投杼平生幾折肱全身寧論得學道敢希名尺寸時頻揣錙銖亦細稱靑雲珠履客滄海雪鷗盟竹徑門初啓桃蹊蔭已成不求元避悔無愛復誰憎種玉思分潤栽蘭欲藉馨酒杯通大道詩律寫幽貞錦繡三千假空靈一寸扃晚雲低樹密落月到牀明調燮存刀匕行藏付寢興故人無我棄時誦日新銘秀州塘過慶雲橋南𣲖為小溪山人李公玉家其上公玉善談星數星之著者為斗人呼其地為斗溪君遂因以自號秀塘東分一支曲溪上幽人數間屋夜深星斗轉遙空繞屋明珠湛寒渌幽人說天三十年三光磊落胸中懸胸中溪底交映徹上與元化同回旋湘纍卜居問詹尹支磯亦訪成都隱洛陽車騎塵染衣垔浪五湖聲跡泯茫茫大運誰主持懸生列象古猶斯榮光德耀空載籍飛流彗孛交梭馳扁舟何日溪上路為我一洗平生疑顧虛齊在湖南聞豫致仕有作席間誦之次韻為謝塵埃衮衮逐浮名泰華鴻毛比重輕九折路窮人亦倦三江舟到水還生詩來楚澤流新詠曲按貞元想舊聲斟酌此堂堪一醉向來書劒幾同盟十一月十四日夢人示所注周易前列卦爻後系衆說朱闌素紙繕寫極精緻豫以錢求卦得小畜之坤後四日冬至紀之以詩玉版仙書字若蠅金錢神語更分明五龍不極行天勢一牝猶存未雨名林壑故應朝市隔陽和默自水泉萌淸臺雲物今誰紀搔首闌干北斗橫無題世事古來如意少光陰畢竟自家多望塵潘嶽今何許帶索榮期且漫歌江檻月寒梅弄影湖橋春動水增波無言一卷牀頭易消盡西風兩鬢皤東江家藏集卷三十五
