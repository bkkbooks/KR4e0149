body:
  text: 東江家藏集卷二十七中集二十三明顧清撰北遊稿祭文一十九首祭任母顧夫人文維𢎞治八年嵗次戊午九月甲午朔十八日外孫壻翰林庶吉士顧清謹緘辭具儀遙祭于故任太夫人顧氏之靈曰鳴呼清自弱嵗學于門墻夫人目之謂可教訓出入顧待異于羣兒爰命外孫締兹姻好夤緣倚賴以有今日厚恩未報每用闕然百年無何凶問遽及嗚呼哀哉憶在壬子拜辭北上喜溢顔面奬藉諄諄謂我平生心於此盡賤纍繼行撫諭尤切自云未艾尚及汝歸汝今逺行母深念我誨言猶在幽明永違薄宦所縻奔赴無及永念疇昔莫能措心瓣香馳奠露此哀悃言則可盡情無可窮南望吳山不勝哽塞尚享祭都御史唐公文嗚呼公之儀表英偉出倫公之器度邁往不羣其問學所充固已擢賢科而躋要近其設施之效亦既殿藩屏而福生民六薦于宰司而始登憲府一忤於權近而遂以弗伸槩公之平生固亦近世之豪傑而拘拘者豈足望其後塵某生同州里或忝姻親當公之進也固望其大有為於斯世及公之退也又皆仰髙志於青雲睢陽洛社之事蓋將有待焉而竟止於此寧不起深痛於斯文也嗚呼人莫不有死死而貴有聞公今已矣太末之墟爼豆若存其身可歿而其在人者固千載而常新也持彼較此則公所不得殆浮雲之過秋旻而聖眷之優渥恤典之殷蕃亦足以慰公於九原矣瓣香東拜望公儼然騎箕尾薄煙霄而臨睨夫舊鄉其將聞某斯言邪祭楊立齋先生文維𢎞治十二年嵗次己未九月戊午朔門生杭濟錢榮吳宗周周璽曹時信周倫顧清程杲戴銑張𢎞至黃明夏從壽呂元夫白金孫忠顯宗璽張宏王軏等謹以牲醴庶羞之奠昭告于故司經局洗馬立齋先生楊公之靈曰鳴呼先生世不謂其止於斯也先生質厚而飬充識遠而器洪學富經綸而言曽不出口才髙時彥而禮見其恭故其館閣蜚聲不可謂非際遇宫坊簡任不可謂非顯融而士猶以為未足以盡公也昊天不弔遽降鞠凶使華國之文徒誦于海內而為霖之望竟鬱于寰中嗚呼哀哉濟等材非楩梓迹本桑蓬辱甄收於連茹屢親接于登龍顧兹永訣情何有終執紼登途酹此一鍾西望太行雲峯萬重幸嗣續之有託庶通家之未窮公其鑒之尚享代家君祭先母文維𢎞治十六年嵗次癸亥十一月甲子朔二十日癸未封翰林編修顧某率男清等以明日甲申葬我先室孺人陸氏于先塋今日遷柩謹以柔毛剛鬛庶羞之儀奠于祖道而言曰嗚呼傷哉昔君之歸我也遇我食貧拮據綢繆迫于生而不暇比其中也婚喪相繼困于事而靡歡及諸子成立荐蒙國恩孫曽滿前可相樂矣而君不我留奄忽先逝追惟平生窘狹之日長而優裕之日短糟粳之義重而菽水之情孤徘徊故廬豈勝悲感臨風一奠從此千秋嗚呼傷哉尚享祭王東山文代同年宋良佐御史作嗚呼于作高門定國升庸祜植三槐實啓魏公蓋力耕而弗獲信造物之所隆維公居鄉彥方仲弓施于有政卓茂魯恭乃生少宰為時人龍帝命寵嘉纍錫重封優遊耄期完節而終考前修而若契稽後祿其焉窮愷也備員朝列固嘗望公名如山斗乘軺南甸曽不及拜公於下風即逺有期我車復東回瞻洞庭煙霏萬重憑絮酒之一酌寄遙拜於東峯公其知乎尚享祭盛宜人陳氏文代邢治中作宜人參政綸之配給事中張𢎞至外母也邢時年八十二嗚呼始吾與端齋參政遊也則聞宜人之賢端齋歿三十有五年矣而吾猶及送宜人之葬感今念昔俯仰曷勝端齋之厚德宜有傳而乏嗣宜人之賢能用端齋意以托嗣續於無窮至于撫幼女飭閨門斂裕就約勤苦自將如黃門之志皆女德之至難也下見端齋其可以無愧已即窆玈溪送車闐道瓣香尊酒蓋逺為端齋慰而近以酹宜人嗚呼尚享祭錢與謙修撰文維𢎞治十八年嵗次乙丑十二月辛亥朔十日庚申亡友太史錢先生將歸於故丘友生顧清謹以牲醴庶羞奠於祖道而言曰惟我與君童稚論交長得惟馨益廣其遊三人同心氣鋭志一挾書聮牀夜以繼日無堅不透有紛必釋當君得意拊几墮幘脫略細故追蹤古人竹帛之期衆謂狂言三十年來萬事雲變鏌鋣沉淵鉛刀充斷長沙賈傅南海虞翻古今所歎知復何論京華十年恆接宵寐歸以凶喪只尺千里病弗及視暝而後臨對面隔世我哀曷任兹辰之良往即玄宅惟馨復病臥不能出一觴獨酹萬感叢襟寒日杲杲逝川沈沈生死不易猶有此心君其知乎尚享祭徐暗齋文舜和侍讀之父閣學以下同祭臨淄之胄盛于西江暗齋之賢式是鄉邦既勤蠱幹尤篤義方蔚爾家彥為邦之光丘園孔嘉蕃錫鼎來胡不憗留而遽其歸空江鶴鳴幽谷猿啼遺榮實多髙蹤莫追遙望青山酹此一巵尚享祭先君文維正德四年嵗次己巳四月壬戌朔二十三日甲申孝子清謹以柔毛剛鬣庶羞之儀昭告于先考封翰林院編修可間府君之靈嗚呼我之别親而從宦蓋將以祿飬也祿未及養而吾母先逝痛毒悔恨無以為生服已闋而遲徊二年蓋圖養吾父以補前尤也拘畏文法復此逺離而遂以永訣生平二親疾弗視殮弗躬衰絰來歸痛哭柩前何益於吾親而今而後雖祿千鍾饌五鼎於吾生亦何益也永遷有期今日祖奠我父有靈其尚聞此言尚往永寧以安我餘生以芘我後人也嗚呼痛哉尚享祭髙竹心文正德六年嵗次辛未十一月丁未朔二十五日辛未友生某謹以清酌庶羞祭于竹心處士髙君之靈自我識君埀三十年敦朴之姿信實之行於古人殆不多見求之今世實晨星之在遼天八十考終子姓多賢人間之事畢矣思如君者不可以復見乃吾人之戚而奚憾焉絮酒炙雞為君永訣者今日之事豐碑華表紀公懿行尚有託於來傳尚享代喻守祭王同知文嗚呼憂國奉公人臣之誼君之守官庶可無愧本釐戎務兼即田工給餉連年遭時鞠凶出入危難卒以成功賢而獨勞疾用斯革君雖不言實軫豫臆若考其平生頖水成賢轅門贊畫清白一心終始一德又可見其源本之有自來而功業之所由積也某等目君危殆愛莫能回兹辰永違豈勝懷感襆被而入垂槖而歸斯名不刋可以永世君其知乎尚饗祭任竹居文維公少而英邁晚而斂藏教于里中曲成無倦出其門者咸仰德焉清早以姻親繆承知愛藝軒已逝幸公猶存衰絰南還公已疾病候視未及訃音遽聞嗚呼哀哉旅殯僧寮實起變故微衷莫展永愧延陵臨風一觴豈勝感歎尚饗公諱惠字孝孚藝軒之弟貧而克孝卒停柩于堂值回祿遷于超果僧舍諸生為助襄事蓋深可念云祭怡菴先生文維正德八年嵗次癸酉冬十一月乙丑朔二十四日戊子門生翰林院侍讀學士顧清謹緘辭致誠遣男天彛以潔牲庶羞清酌之儀昭告于先師涇府右長史怡菴先生之靈曰嗚呼清之辱于門下也四十有四年由童而冠以迄于今夫孰非先生之教亦孰非先生之恩淺薄疏庸濫塵近列曽不能效其分寸以光于師門而先生已矣欲以報德嗟復何言先生之言行清既粗有所撰述而其家世之懿固已表著於人人惟子姓之蕃或未底于成立而遺文墜緒尚有資於討論此門下老生之責亦先生所望於後昆聞訃以來頻接宵夢意或在是而言不可分也瓣香遙拜致我輪囷清固不以死生而易志先生之英爽亦當於此而有聞幸未即泯庶有以復而未敢以相忘也先生其果聞哉尚享祭二弟文維正德九年嵗次甲戌十二月原闕朔越十二日兄清既聞吾弟士行之喪又某原闕日始克緘辭致儀命長男天彛奠于柩前而言曰嗚呼人生百年如露與電父母兄弟相親幾時吾生三十有三年而與吾弟别别十年而吾母棄背始得與吾弟會又四年而再别别二年而復會則吾父已亡所存者吾兄弟三人耳時艱嵗歉服已終而不能出蓋相與周旋又四年而始别則吾之志其亦可知矣嗚呼孰謂别未久而吾弟竟先我而亡邪痛哉吾弟聰明機警年未弱冠已自有為爰及壯年遂爾成立亦既有子有屋有船有園有田謂我休官得相與追隨以終我餘年也而孰謂其遽至此邪嗚呼痛哉吾家本寒微然祖宗以來積德纍善稱于鄉鄰及我之身遂蒙國恩兄弟子姪諸房競爽人謂此天所以為吾祖宗報而尋源知本益務培養以衍于無窮則後人事也每思與吾弟商確略放古人義學義莊之意立為規程教養子姓使盡為好人不至驕奢縱逸棄禮冒法墜墮門户為先祖羞而力未能及徒往來於胸中今吾弟往矣吾又繫身于官不得自遂重念天與學既未成又未更事一家內外萃於其身若非折節虛心親賢聽善則吾弟辛勤二十年之所立豈能支持眷言至此我心如焚因遣天彛致奠覼縷及此亦有書與三弟使訓飭天與且經理其家三弟必能行吾言天與必能從三弟之訓吾弟雖歿而不忘其子也則亦將以吾之言為然吾尊酒臠肉不足以致情于吾弟而惓惓之意乃以為吾弟身後之謀也吾弟其聞之邪其果以吾之言為然否邪其將無所聞而莫知其然不然邪嗚呼痛哉尚饗祭楊留耕文年月日具官梁儲等謹以牲帛庶羞清酌之儀遙祭于誥封少保兼太子太保戶部尚書文淵閣大學士留耕楊公之靈曰坤維間氣為時生賢靈秀所聚有開必先維公之生頴異出羣䇿名天府董學名藩有烈有功有學有文其在先哲三槐老泉不竟厥施錫類孔蕃三孤列卿倫魁從臣勳業文章萃公之門帝眷有加纍錫重恩玊帶錦衣逍遙暮年八十考終榮名具全方今海內孰與公倫師臣釋位哀動九閽矧惟具僚誼重斯文岷江縈紆劒閣嶙峋可閟者形不滯者神眷兹舊遊能弗顧存肴核既旅牲帛再陳詞以酹公庶其有聞尚饗祭劉夫人文維正德十年嵗次乙亥九月甲申朔原闕日原闕少傳兼太子太傳吏部尚書兼謹身殿大學士梁儲等以潔牲庶羞清酌之儀遙祭于誥贈夫人劉母鄧氏之靈曰彤管之書內助是徵夫人之夫令德令名問母之賢觀于其子夫人之庭金玊濟濟省署黌庠諸孫繼昌沿流遡源孰濬而長遐年令終諸福斯備恤典有隆遺榮莫既某等託交令子夙仰賢風升堂已矣執引靡從幨帷在庭一薦芳醴遙望岷峨雲空萬里嗚呼哀哉尚饗祭曹十峯文維正德十一年嵗次丙子九月己卯朔越九日丁亥鄉友衛璋衛瓚顧清趙經周時敕戴恩錢岌周鉞胡嶽曹寬山岑王臨沈鋭袁讚張明師楊秉義等謹以清酌庶羞之儀遙祭于故都察院司務十峯曹君之靈曰嗚呼十峯而止於斯時豈無材如君則稀既豪邁而挺特又謙恭而坦夷於義利之分則一毫而弗茍當是非之辨雖百挫而不移有學有才有識有為加之以樂善親賢之志愛人容物之懷如先生者謂無遠不到無適不宜也何青萍之暫試竟玊樹之髙摧將彼蒼之無意豈吾道之云非然而僚友懷其義官長惜其材凛直氣與正言粲麗藻而清詞其取諸身雖約固天所以大其後之遺也璋等誼聮桑梓氣染蘭芝方逺離之在念遂永訣而長辭春與秋其幾日奄山川之凄其望髙雲而掩涕悵會合之無期諒久要之未忘庶斯言之有知嗚呼哀哉尚饗祭李文正公文維正德十一年嵗次丙子九月己卯朔二十日戊戌少傳兼太子太傳吏部尚書謹身殿大學士梁儲等謹以牲帛庶羞清酌之儀敬祭于故少師兼太子太師吏部尚書華蓋殿大學士贈太師諡文正李公之靈曰嗚呼貞元間氣會于公身正而不亢直而能溫孝友之行足以儀于邦國忠清之志可以質于鬼神食天祿者五十三年而家無贏産參機政者十有八載而門無雜賔蓋舉天下無足以投其意好而所為汲汲獨世道之與人文用以結深知于先帝荷末命于投囏當其震撼擊撞盤錯糾紛勇者蒙難而削迹懦者毁轍而回輪徐握其機默運以神或掎其後或逆其先有縱有操維義之徇卒能掃凶竪之烈焰清皇路之妖氛蓋昔人云泰山喬嶽人不見其運動而功利之及物不可以數計而周知者惟公其有焉至于文章翰墨本經綸之餘事急流勇退乃庸人之所難惟夫虛靜之天終老靡晦憂勤一念未死常存此古人所以負天下之重服天下之心而公之所以見先帝於九原也儲等從公也久飲德惟醇望獨樂之園如將復起誦憗遺之誄悲不忍云素車臨載酹此一尊此又昔人所謂上為天下慟而下以哭其私也先生其聞之乎尚饗祭喻府君文維正德十二年嵗次丁丑正月丁丑朔十五日辛卯詹事府少詹事兼翰林院學士松人顧清謹緘辭寓儀致祭于故松江知府內江喻侯之靈嗚呼侯之云亡忽已更嵗世途紛紜益感淪逝維侯之心我則知之專於為民他或有遺小夫沾沾意淺望厚一違其私何事不有蓋棺論定身往心存君公之思公乃在民我早識侯侯亦我諒闕訪疑詢維民之障降命何短為德靡終民也無祿侯則何恫苗殘莠鬯鸞伏鷙起有槩豫衷豈惟我里髙鴻西逝凄矣豫悲寄奠一觴非以其私嗚呼哀哉尚饗東江家藏集卷二十七
